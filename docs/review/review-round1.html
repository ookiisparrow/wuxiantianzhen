<style>
/* Layout: 一页一题的单栏问卷；顶部是 15 段进度条，题目卡居中，推荐原因贴在被推荐的选项下方。 */
:root {

  --surface: #ffffff;

  --accent-soft: #e4edf6;
  --rec: #2a7a58;
  --rec-soft: #e2f1ea;
  --warn: #9a6a12;
  --warn-soft: #f6ecd3;
  --danger: #a33a3a;
  --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;

@media (prefers-color-scheme: dark) {

    --bg: #111715; --surface: #1a2220; --ink: #e5ebe8; --muted: #9aa7a1; --line: #2d3935;

}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #1a2220; --ink: #e5ebe8; --muted: #9aa7a1; --line: #2d3935;
  --accent: #7fb0e0; --accent-ink: #0f1a24; --accent-soft: #1d2d3d;
  --rec: #6cc59d; --rec-soft: #18302a; --warn: #e0b45c; --warn-soft: #34291a; --danger: #e08585;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 740px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header.top { display: flex; flex-direction: column; gap: 10px; }
.brandrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.seg:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.stripmeta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
h1 { font-family: var(--font-display); font-size: 25px; line-height: 1.35; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 18px; margin: 0; }
.ctx { background: var(--bg); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.ctx p { margin: 0; }
.ctx .lab { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
.src { font-size: 13px; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.optwrap { display: flex; flex-direction: column; gap: 0; }
.opt { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
.opt:hover { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.hasWhy { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }

.badge { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.opt.sel .badge { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.otitle { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.odesc { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; }
.pill { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--rec-soft); color: var(--rec); }
.why { border: 1px solid var(--rec); border-top: 0; background: var(--rec-soft); border-radius: 0 0 8px 8px; padding: 12px 14px; font-size: 15px; display: flex; flex-direction: column; gap: 8px; }
.why .lab { font-size: 12px; letter-spacing: .08em; color: var(--rec); font-weight: 700; }
.why p { margin: 0; }
button, .btn { font: inherit; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; min-height: 44px; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
textarea { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 84px; resize: vertical; line-height: 1.6; }
textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lab { font-size: 14px; color: var(--muted); }
.defer { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.defer input { width: 20px; height: 20px; accent-color: var(--warn); }
.nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.navr { display: flex; gap: 10px; flex-wrap: wrap; }
.state { font-size: 13px; color: var(--muted); }
.state.fail { color: var(--danger); }
.cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.cat { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 15px; }
.cat b { display: block; }
.cat span { color: var(--muted); font-size: 14px; }
.sumlist { display: flex; flex-direction: column; gap: 0; }
.sumitem { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.sumitem:first-child { border-top: 0; }
.sumno { font-family: var(--font-display); font-weight: 700; color: var(--muted); }
.sumq { font-weight: 700; }
.sumans { font-size: 15px; margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.sumnote { font-size: 14px; color: var(--muted); margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.tag.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.tag.miss { color: var(--danger); border-color: var(--danger); }
.banner { border-radius: 8px; padding: 12px 14px; font-size: 15px; }
.banner.ok { background: var(--rec-soft); border: 1px solid var(--rec); }
.banner.warn { background: var(--warn-soft); border: 1px solid var(--warn); }
.copybox { width: 100%; min-height: 160px; font-size: 13px; }
@media (max-width: 520px) {
  .card { padding: 18px 16px; }
  h1 { font-size: 22px; }

}
@media (prefers-reduced-motion: no-preference) { .opt, .btn { transition: border-color .12s, background .12s; } }

<script>
(function () {
  "use strict";
  var ROUND = { id: "r1", name: "第 1 轮 · 核心问题" };
  var LS_KEY = "wxtz-review-r1";
  var DOC_PATH = "rounds/r1";

  /* ---------- 题目（核心问题）---------- */
  var Q = [
    { id: "capacity", cat: "订单与派单",
      title: "直播卖得比织女做得快，怎么办？",
      ctx: [
        "10-17 的示例是每位织女每周约 6 件。一期 3–5 位织女，每周大约只有 18–30 件产能（约每天 3–4 件，这是我按示例推算的，不是你给的数字）。一场直播的成交量很可能远高于这个数。",
        "抖店库存要手工设，现在的设计里没有“织女容量 → 可售数量”的联动（审核项 G7）。超卖会直接撞上 14 天交期，抖店对发货超时按实付 1%/5% 赔付，严重时还可能罚违约金。"
      ],
      src: "来源：旧需求 BY-11、G7；docs/03 §3.1；docs/02 §1.1",
      opts: [
        { id: "a", label: "限量上架：开播前按织女剩余容量手工设抖店库存，卖完即止", desc: "系统只需给出“今日可售数量建议”（所有织女剩余容量之和）。" },
        { id: "b", label: "预售期拉到抖店上限 15 天，多收单、后追加织女", desc: "单量不设限，靠时间缓冲。" },
        { id: "c", label: "不限量，超出产能的订单由运营联系买家退款", desc: "销量最大化，但会带来大量取消和差评。" },
        { id: "d", label: "先把织女扩到 10 位以上再开播", desc: "产能充足，但一期启动会被招募拖慢。" }
      ],
      rec: "a",
      why: "一期要证明的是履约闭环，而不是冲销量。限量最稳；“限量款”本身也是直播话术。系统侧只多一个容量汇总，几乎不增加开发量。b 把交期压到上限、超出后没有兜底；c 会制造最多的取消和投诉。" },

    { id: "cadence", cat: "订单与派单",
      title: "直播以外时段下的单，什么时候派？",
      ctx: [
        "现在的节奏是“晚上直播，次日 8:30 导出订单，9:00–13:00 整点派单”，这套节奏也是取消风险的缓冲。",
        "但小黄车商品在直播结束后仍可购买，白天自然流量、凌晨 01:00 以后的付款订单怎么算，没有写。"
      ],
      src: "来源：docs/03 §1、§11.6；11-22 对话（直播与派单节奏）",
      opts: [
        { id: "a", label: "一天一批：8:30 导出时已付款的订单，当天 9:00 起派；之后付款的顺延到次日", desc: "规则单一，织女可预期，也是批量导出和批量寄件的基础。" },
        { id: "b", label: "白天随到随派（整点滚动派单）", desc: "买家等得更短，但取消风险和运营负担都上升。" },
        { id: "c", label: "直播结束后下架商品，只在直播中可买", desc: "订单全部集中在晚上，节奏最干净，但损失自然流量。" },
        { id: "d", label: "每周固定 2 天派单（成批处理）", desc: "运营最省事，但买家等待更久，很难守 14 天交期。" }
      ],
      rec: "a",
      why: "一天一批是整个设计的底座：缓冲取消、一次性导出 CSV、一次性批量在线寄件都依赖它。c 可以作为某款爆量时的临时手段，不必写成常规规则。" },

    { id: "merge", cat: "订单与派单",
      title: "同一个顾客的多笔订单，要不要合并成一个包？",
      ctx: [
        "现设计：派单前窗口内，同一顾客的多笔订单用 sha256(省|市|脱敏姓名|脱敏手机) 合成一包，只给一位织女、一个袋码、一个包裹。",
        "问题：导出的收件人信息是密文或部分隐藏，不同人可能撞键（误合，两个人的货寄到一起），同一人换手机号又合不上（漏合）。一期订单量小，合单省下的邮费有限。"
      ],
      src: "来源：docs/03 §3.1、§11.6；旧需求 OR-1",
      opts: [
        { id: "a", label: "一期只合“同一抖店订单号内的多件商品”，跨订单不合", desc: "同订单号合并是确定无误的；跨订单合单放二期再研究。" },
        { id: "b", label: "系统按合单键给出“建议合并”，运营逐条确认", desc: "能省邮费，但每天多一道人工确认。" },
        { id: "c", label: "完全自动合单（现设计）", desc: "最省人工，误合时会造成投诉和地址暴露。" },
        { id: "d", label: "完全不合单，一单一包", desc: "最简单，邮费最高。" }
      ],
      rec: "a",
      why: "跨订单合单靠脱敏信息猜，错了代价高（寄错、买家投诉、地址被另一位买家看到）；一期订单少，多花几块邮费比出错便宜。需要时二期再用真实 CSV 校验合单键。" },

    { id: "surplus", cat: "订单与派单",
      title: "固定款的“余货”，多久没人买就要兜底？",
      ctx: [
        "已决定：固定款开工后被取消，织女继续做完成为余货，下一次同款订单优先派给她，工价按新订单结，不另补偿。",
        "没说清：如果很久没有同款新订单怎么办？线材成本已从她的线材池扣掉，余货又占着她的地方。固定款也可能被下架。"
      ],
      src: "来源：11-22 对话（固定款开工后取消）；docs/03 §3.3",
      opts: [
        { id: "a", label: "保留 30 天；仍无同款订单，平台按材料成本回购（做福利款或清货）", desc: "只补材料成本，不补工价。" },
        { id: "b", label: "织女自留自处理，平台不管（现设计的字面意思）", desc: "平台零成本，但织女承担全部损失。" },
        { id: "c", label: "平台承诺无限期优先派给她，不回购", desc: "不花钱，但对织女没有兜底期限。" },
        { id: "d", label: "14 天内无同款订单，平台按“工价 50% + 材料成本”买断", desc: "对织女更友好，平台成本更高。" }
      ],
      rec: "a",
      why: "既保护织女，又限制了平台的敞口：材料成本是真实垫付的钱，工价不补可以避免“做完就算收入”的倒逼。30 天只是起点，可以调；固定款本来就少，实际发生概率低。" },

    { id: "logistics-b", cat: "物流与发货",
      title: "在线寄件如果实测走不通，你想用哪个备用方案？",
      ctx: [
        "整个一期物流押在抖店“在线寄件”上，以下三件事还没有实测：个人住宅能否作发货地址、织女所在城市是否在开通名单内、能否按订单号批量勾选。在线寄件没有 API，一旦不通，没有自动的第二条路径。",
        "已有的备选：①集货点（几位织女把货寄到同城点统一发）②织女用抖店 App 自行寄件填单号（有每日额度、不可查不可提，还有虚假发货风险）③开放平台 API + 电子面单（要软著，个体户资格未明）④提前上线快递100 的上门取件（二期能力）。"
      ],
      src: "来源：docs/02 §2、§3；docs/05 闸门 2、风险 R1/R2",
      opts: [
        { id: "a", label: "先不预设：一期只招“在开通城市名单内”的织女，用第一批真实订单实测，结果出来再选", desc: "三个未知项没有答案前，不为尚未发生的问题做备选开发。" },
        { id: "b", label: "预设为集货点", desc: "同城织女把货寄给集货点，由集货点统一发。要多一个人和一段运输。" },
        { id: "c", label: "预设为自行寄件填单号（应急）", desc: "最省事，但有额度限制和虚假发货风险，只能短期用。" },
        { id: "d", label: "预设为提前做快递100 上门取件", desc: "官方预约上门，但会把二期工作提前，一期范围变大。" }
      ],
      rec: "a",
      why: "实测只需要一单真实订单就能知道答案，信息不足时现在选备选方案是在猜；城市不在名单内的织女只是延后到二期，不会阻塞一期。等结果出来，我会把备选方案按实际卡点缩小成一两个。" },

    { id: "sender-info", cat: "物流与发货",
      title: "面单上的寄件人信息，织女愿意暴露多少？",
      ctx: [
        "“织女与买家信息隔离”是核心原则，但货是从织女家直发的：寄件人姓名、手机号、地址会印在面单上，买家和快递员都看得到。",
        "抖店在线寄件能否隐藏寄件人或使用虚拟号，官方文档没写（11-14 只查到顺丰丰密面单可隐藏）。"
      ],
      src: "来源：docs/03 §4.3；docs/02 §2、§5；旧需求 OR-4",
      opts: [
        { id: "a", label: "姓名用“店铺名+工号”，手机号和地址用织女真实的，签知情同意书", desc: "快递员能联系到织女；买家看不到真实姓名，但看得到手机号和地址。" },
        { id: "b", label: "全部用织女真实姓名、手机、地址", desc: "最简单，隐私最差。" },
        { id: "c", label: "手机号换成平台公共号码，地址用织女的", desc: "保护手机号，但快递员联系不上织女，取件失败率会上升。" },
        { id: "d", label: "先实测在线寄件是否支持隐藏或虚拟号，再定", desc: "有官方能力时选最好的；没有时回到 a。" }
      ],
      rec: "d",
      why: "最好的办法取决于抖店有没有虚拟号或隐藏能力，这在实测（闸门 2）里一并确认成本几乎为零。没有这项能力时，退到 a，一期织女是熟人，知情同意足够。" },

    { id: "pay-formula", cat: "钱与责任",
      title: "织女每单拿多少钱，怎么算？",
      ctx: [
        "两版规则冲突。10-15/10-17：按件、按款式固定工价，不跟销量或售价挂钩。11-14：应得 = 售价 − 支付手续费 − 包装费 − 运营费 − 税费 + 买家分担的邮费。",
        "11-21 起平台统一付运费，“买家分担邮费”已经没有意义；“税费 1%”依据不明（G8）；抖店有优惠券和满减，实付价会波动，织女收入会跟着波动。当前数据模型里实际写的是按款固定的 craftFeeFen。"
      ],

      "<h1>先回答 " + N + " 个核心问题</h1>" +
      '<div class="ctx"><p>这些是我把项目意图和设计对照后，发现“不够清晰、不够确定、有冲突、可能出 bug”的核心问题。每页一题，每题有选项、我的推荐和推荐原因，也可以选“其他”自己写。</p>' +
      "<p>你的选择会自动保存；全部答完后点“提交”。我读取答案后，如果某些核心问题的答案还牵出需要再判断的子问题，会开第 2 轮；不需要的话就直接更新文档。</p></div>" +
      '<div class="cats">' + byCat + "</div>" +
      '<div class="nav"><span class="state">选推荐只是默认建议，每题都可以改。不确定的题可以点“先不定”。</span>' +
      '<div class="navr"><button class="btn primary" data-act="goq" data-i="' + first + '">' + (started ? "继续作答（第 " + (first + 1) + " 题）" : "开始第 1 题") + "</button>" +
      (started ? '<button class="btn" data-act="gosum">查看汇总</button>' : "") + "</div></div></section>";
  }

  function viewQ(i) {
    var q = Q[i], a = getA(q.id);
    var opts = q.opts.map(function (o, k) {
      var sel = a.choice === o.id;
      var isRec = q.rec === o.id;
      var why = isRec ? '<div class="why"><span class="lab">我为什么推荐这个</span><p>' + esc(q.why) + "</p></div>" : "";
      return '<div class="optwrap"><label class="opt' + (sel ? " sel" : "") + (isRec ? " hasWhy" : "") + '" data-opt="' + o.id + '">' +
        '<input type="radio" name="opt" value="' + o.id + '"' + (sel ? " checked" : "") + ">" +
        '<span class="badge">' + String.fromCharCode(65 + k) + "</span>" +
        '<span><span class="otitle">' + esc(o.label) + (isRec ? ' <span class="pill">推荐</span>' : "") + "</span>" +
        '<span class="odesc">' + esc(o.desc) + "</span></span></label>" + why + "</div>";
    }).join("");
    var other = '<div class="optwrap"><label class="opt' + (a.choice === "other" ? " sel" : "") + '" data-opt="other">' +
      '<input type="radio" name="opt" value="other"' + (a.choice === "other" ? " checked" : "") + ">" +
      '<span class="badge">✎</span><span><span class="otitle">其他：我自己写答案</span>' +
      '<span class="odesc">以上都不合适，或者想改其中某个选项。</span></span></label></div>' +
      '<div class="field" id="otherField"' + (a.choice === "other" ? "" : " hidden") + ">" +
      '<label for="otherText">你的答案</label><textarea id="otherText" data-field="text" placeholder="写下你想怎么处理">' + esc(a.text || "") + "</textarea></div>";
    var last = i === N - 1;
    return '<section class="card">' +
      '<div class="eyebrow">' + esc(q.cat) + " · 第 " + (i + 1) + " / " + N + " 题</div>" +
      "<h1>" + esc(q.title) + "</h1>" +
      '<div class="ctx"><span class="lab">为什么问这个</span>' + q.ctx.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
      '<span class="src">' + esc(q.src) + "</span></div>" +
      '<div class="opts" role="radiogroup" aria-label="选项">' + opts + other + "</div>" +
      '<div class="field"><label for="noteText">补充说明或理由（可选）</label><textarea id="noteText" data-field="note" placeholder="例如：为什么选这个、有什么顾虑、需要我先查什么">' + esc(a.note || "") + "</textarea></div>" +
      '<label class="defer"><input type="checkbox" id="deferBox" data-field="defer"' + (a.defer ? " checked" : "") + "> 这题我先不定，需要更多信息或先调研</label>" +
      '<div class="nav"><button class="btn" data-act="' + (i === 0 ? "gostart" : "goq") + '" data-i="' + (i - 1) + '">' + (i === 0 ? "返回说明" : "上一题") + "</button>" +
      '<div class="navr"><button class="btn small" data-act="usrec">采用推荐</button>' +
      '<button class="btn primary" data-act="' + (last ? "gosum" : "goq") + '" data-i="' + (i + 1) + '">' + (last ? "完成，查看汇总" : "下一题") + "</button></div></div>" +
      "</section>";
  }

  function viewSummary() {
    var c = counts();
    var dirty = S.submittedAt && S.updatedAt > S.submittedAt;
    var banner = "";
    if (S.submittedAt && !dirty) banner = '<div class="banner ok">已于 ' + new Date(S.submittedAt).toLocaleString() + " 提交。回到对话告诉我“已提交”，我会读取答案。</div>";
    else if (S.submittedAt && dirty) banner = '<div class="banner warn">提交之后你又修改了答案，请重新提交。</div>';
    else if (c.empty) banner = '<div class="banner warn">还有 ' + c.empty + " 题没有回答，可以先提交，也可以回去补。未答的题我会当作“没想好”，不会替你决定。</div>";
    var items = Q.map(function (q, i) {
      var st = status(q), a = getA(q.id);
      var ans = answerText(q);
      var tags = "";
      if (st === "empty") tags = '<span class="tag miss">未答</span>';
      if (a.defer) tags += ' <span class="tag warn">先不定</span>';
      return '<div class="sumitem"><div class="sumno">' + (i + 1) + "</div><div>" +
        '<div class="sumq">' + esc(q.title) + "</div>" +
        (ans ? '<div class="sumans">' + esc(ans) + "</div>" : "") +
        (a.note && a.note.trim() ? '<div class="sumnote">备注：' + esc(a.note.trim()) + "</div>" : "") +
        '</div><div class="sumact">' + tags + ' <button class="link" data-act="goq" data-i="' + i + '">修改</button></div></div>';
    }).join("");
    return '<section class="card"><div class="eyebrow">' + esc(ROUND.name) + "</div><h1>汇总与提交</h1>" + banner +
      '<div class="sumlist">' + items + "</div>" +
      '<div class="nav"><button class="btn" data-act="goq" data-i="' + (N - 1) + '">回到第 ' + N + " 题</button>" +
      '<div class="navr"><button class="btn" data-act="copy">复制全部答案</button>' +
      '<button class="btn primary" data-act="submit">' + (S.submittedAt ? "重新提交" : "提交") + "</button></div></div>" +
      '<div id="copyArea"></div></section>';
  }

  function render() {
    var r = route();
    if (r.v === "q") { app.innerHTML = viewQ(r.i); renderStrip(r.i); }
    else if (r.v === "summary") { app.innerHTML = viewSummary(); renderStrip(-1); }
    else { app.innerHTML = viewStart(); renderStrip(-1); }
    setSave(saveMode);
    if (r.v !== "q") window.scrollTo(0, 0);
  }

  /* ---------- 事件 ---------- */
  function curQ() { var r = route(); return r.v === "q" ? Q[r.i] : null; }
  function refreshSel() {
    var q = curQ(); if (!q) return;
    var a = getA(q.id);
    app.querySelectorAll(".opt").forEach(function (el) {
      var on = el.getAttribute("data-opt") === a.choice;
      el.classList.toggle("sel", on);
      var inp = el.querySelector("input"); if (inp) inp.checked = on;
    });
    var f = document.getElementById("otherField"); if (f) f.hidden = a.choice !== "other";
    var cb = document.getElementById("deferBox"); if (cb) cb.checked = !!a.defer;
    renderStrip(route().i);
  }

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (t) {
      var act = t.getAttribute("data-act");
      if (act === "goq") { go("q" + (parseInt(t.getAttribute("data-i"), 10) + 1)); return; }
      if (act === "gostart") { go("start"); return; }
      if (act === "gosum") { go("summary"); return; }
      if (act === "usrec") { var q = curQ(); if (q) { setA(q.id, { choice: q.rec }); refreshSel(); } return; }
      if (act === "copy") { doCopy(); return; }
      if (act === "submit") { doSubmit(); return; }
    }
  });
  document.getElementById("strip").addEventListener("click", function (e) {
    var t = e.target.closest("[data-act='goq']");
    if (t) go("q" + (parseInt(t.getAttribute("data-i"), 10) + 1));
  });
  app.addEventListener("change", function (e) {
    var q = curQ(); if (!q) return;
    if (e.target.name === "opt") {
      setA(q.id, { choice: e.target.value });
      refreshSel();
      if (e.target.value === "other") { var ta = document.getElementById("otherText"); if (ta) ta.focus(); }
    } else if (e.target.id === "deferBox") {
      setA(q.id, { defer: e.target.checked });
      refreshSel();
    }
  });
  app.addEventListener("input", function (e) {
    var q = curQ(); if (!q) return;
    var f = e.target.getAttribute("data-field");
    if (f === "text") { setA(q.id, { text: e.target.value }); renderStrip(route().i); }
    else if (f === "note") { setA(q.id, { note: e.target.value }); }
  });
  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "textarea" || tag === "input" || e.metaKey || e.ctrlKey || e.altKey) return;
    var r = route();
    if (r.v !== "q") return;
    if (e.key === "ArrowRight") go(r.i === N - 1 ? "summary" : "q" + (r.i + 2));
    if (e.key === "ArrowLeft") go(r.i === 0 ? "start" : "q" + r.i);
  });
  window.addEventListener("hashchange", render);

  async function doSubmit() {
    S.submittedAt = Date.now();
    S.updatedAt = S.submittedAt;
    persistLocal();
    if (timer) { clearTimeout(timer); timer = null; }
    render();
    await flush();
    render();
    if (!dbh) {
      var area = document.getElementById("copyArea");
      if (area) area.innerHTML = '<div class="banner warn" style="margin-top:12px">云端保存不可用，我读不到你的答案。请点“复制全部答案”，把文字贴回对话。</div>';
    }
  }
  function doCopy() {
    var text = exportText();
    var area = document.getElementById("copyArea");
    function fallback() {
      area.innerHTML = '<div class="field" style="margin-top:12px"><span class="lab">浏览器不允许自动复制，请手动全选复制：</span><textarea class="copybox" id="copyBox" readonly></textarea></div>';
      var b = document.getElementById("copyBox"); b.value = text; b.focus(); b.select();
    }
    try {
      navigator.clipboard.writeText(text).then(function () {
        area.innerHTML = '<div class="banner ok" style="margin-top:12px">已复制到剪贴板。</div>';
      }, fallback);
    } catch (e) { fallback(); }
  }

  /* ---------- 启动 ---------- */
  document.getElementById("roundName").textContent = ROUND.name + " · 共 " + N + " 题";
  loadLocal();
  render();
  setSave("none");

  (async function connect() {
    try {
      var db = await (window.claude && window.claude.use ? window.claude.use("db") : null);
      if (!db) { if (Object.keys(S.answers).length) setSave("local"); else setSave("local"); return; }
      dbh = db;
      var snap = await Promise.race([
        db.doc(DOC_PATH).get(),
        new Promise(function (_, rej) { setTimeout(function () { rej({ code: "timeout" }); }, 10000); })
      ]);
      var cloudUpdated = 0;
      if (snap && snap.exists) {
        var d = snap.data() || {};
        cloudUpdated = d.updatedAt || 0;
        var ca = d.answers || {};
        Object.keys(ca).forEach(function (id) {
          if (!S.answers[id] || (ca[id].t || 0) > (S.answers[id].t || 0)) S.answers[id] = ca[id];
        });
        S.submittedAt = Math.max(S.submittedAt || 0, d.submittedAt || 0);
        S.updatedAt = Math.max(S.updatedAt || 0, cloudUpdated);
        persistLocal();
        var ae = document.activeElement;
        if (!ae || !/^(TEXTAREA|INPUT)$/.test(ae.tagName)) render();
        lastCloud = cloudUpdated || Date.now();
        setSave("cloud");
      } else {
        setSave("local");
        setSave(Object.keys(S.answers).length ? "saving" : "none");
      }
      if (S.updatedAt > cloudUpdated && Object.keys(S.answers).length) queueSave();
      else if (!Object.keys(S.answers).length) setSave("none");
    } catch (e) {
      setSave(dbh ? "fail" : "local");
    }
  })();
})();
</script>
