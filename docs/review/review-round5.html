    if (saving) { again = true; return; }
    saving = true;
    if (dbh) setSave("saving");
    try {
      if (!dbh) throw { code: "nodb" };
      await dbh.doc(DOC_PATH).set(payload());
      lastCloud = Date.now();
      setSave("cloud");
    } catch (e) {
      setSave(dbh ? "fail" : "local");
    }
    saving = false;
    if (again) { again = false; flush(); }
  }
  function queueSave() {
    persistLocal();
    if (timer) clearTimeout(timer);
    if (!dbh) { setSave("local"); return; }
    setSave("saving");
    timer = setTimeout(function () { timer = null; flush(); }, 700);
  }
  function touch() { S.updatedAt = Date.now(); }

  /* ---------- 答案辅助 ---------- */
  function getA(id) { return S.answers[id] || {}; }
  function setA(id, patch) {
    var a = Object.assign({}, getA(id), patch, { t: Date.now() });
    S.answers[id] = a;
    touch();
    queueSave();
  }
  function status(q) {
    var a = getA(q.id);
    if (a.choice === "other" ? !!(a.text && a.text.trim()) : !!a.choice) return "done";
    if (a.defer) return "defer";
    return "empty";
  }
  function letter(q, id) { for (var i = 0; i < q.opts.length; i++) if (q.opts[i].id === id) return String.fromCharCode(65 + i); return "?"; }
  function answerText(q) {
    var a = getA(q.id);
    if (!a.choice) return "";
    if (a.choice === "other") return "其他：" + (a.text || "").trim();
    for (var i = 0; i < q.opts.length; i++) if (q.opts[i].id === a.choice) return letter(q, a.choice) + ". " + q.opts[i].label;
    return "";
  }
  function counts() {
    var c = { done: 0, defer: 0, empty: 0 };
    Q.forEach(function (q) { c[status(q)]++; });
    return c;
  }
  function exportText() {
    var lines = [ROUND.name + "（共 " + N + " 题）"];
    Q.forEach(function (q, i) {
      var a = getA(q.id), st = status(q);
      var s = (i + 1) + ". [" + q.id + "] " + q.title + "\n   答：" + (answerText(q) || (st === "defer" ? "（先不定）" : "（未答）"));
      if (a.defer && st === "done") s += "  [标记：需要更多信息]";
      if (a.defer && st === "defer") s += "";
      if (a.note && a.note.trim()) s += "\n   备注：" + a.note.trim();
      lines.push(s);
    });
    return lines.join("\n");
  }

  /* ---------- 渲染 ---------- */
  var app = document.getElementById("app");
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function route() {
    var h = (location.hash || "").replace("#", "");
    if (h === "summary") return { v: "summary" };
    var m = /^q(\d+)$/.exec(h);
    if (m) { var i = parseInt(m[1], 10) - 1; if (i >= 0 && i < N) return { v: "q", i: i }; }
    return { v: "start" };
  }
  function go(h) { if (location.hash === "#" + h) render(); else location.hash = h; }

  function renderStrip(cur) {
    var el = document.getElementById("strip");
    if (el.style) el.style.gridTemplateColumns = "repeat(" + N + ", 1fr)";
    el.innerHTML = Q.map(function (q, i) {
      var st = status(q);
      return '<button class="seg ' + (st === "done" ? "done" : st === "defer" ? "defer" : "") + (cur === i ? " cur" : "") +
        '" data-act="goq" data-i="' + i + '" title="第 ' + (i + 1) + " 题：" + esc(q.title) + '" aria-label="第 ' + (i + 1) + ' 题"></button>';
    }).join("");
    var c = counts();
    document.getElementById("progressText").textContent = "已答 " + c.done + " / " + N + (c.defer ? "，待定 " + c.defer : "");
  }

  function viewStart() {
    var c = counts();
    var byCat = CATS.map(function (name) {
      var n = Q.filter(function (q) { return q.cat === name; }).length;
      return '<div class="cat"><b>' + name + "</b><span>" + n + " 题</span></div>";
    }).join("");
    var first = 0;
    for (var i = 0; i < N; i++) if (status(Q[i]) === "empty") { first = i; break; }
    var started = c.done + c.defer > 0;
    return '<section class="card">' +
      '<div class="eyebrow">' + esc(ROUND.name) + "</div>" +
      "<h1>开发前的结构性决定：" + N + " 个问题</h1>" +
      '<div class="ctx"><p>这 6 个问题改起来代价大，最好在开发前定：买家端与织女端是一个还是两个小程序、小程序订单能否派给直播池织女、一单多款如何拆、用什么通知织女、账本是否覆盖收入侧、验证期 ERP 与我们系统的分工。</p>' +
      "<p>每题都有我的推荐和原因，也可选“其他”自己写。答案自动保存，答完点“提交”。其中通知渠道涉及的微信规则我还没有核实，已在题中标注。</p></div>" +
      '<div class="cats">' + byCat + "</div>" +
      '<div class="nav"><span class="state">选推荐只是默认建议，每题都可以改。不确定的题可以点“先不定”。</span>' +
      '<div class="navr"><button class="btn primary" data-act="goq" data-i="' + first + '">' + (started ? "继续作答（第 " + (first + 1) + " 题）" : "开始第 1 题") + "</button>" +
      (started ? '<button class="btn" data-act="gosum">查看汇总</button>' : "") + "</div></div></section>";
  }

  function viewQ(i) {
    var q = Q[i], a = getA(q.id);
    var opts = q.opts.map(function (o, k) {
      var sel = a.choice === o.id;
      var isRec = q.rec === o.id;
      var why = isRec ? '<div class="why"><span class="lab">我为什么推荐这个</span><p>' + esc(q.why) + "</p></div>" : "";
      return '<div class="optwrap"><label class="opt' + (sel ? " sel" : "") + (isRec ? " hasWhy" : "") + '" data-opt="' + o.id + '">' +
        '<input type="radio" name="opt" value="' + o.id + '"' + (sel ? " checked" : "") + ">" +
        '<span class="badge">' + String.fromCharCode(65 + k) + "</span>" +
        '<span><span class="otitle">' + esc(o.label) + (isRec ? ' <span class="pill">推荐</span>' : "") + "</span>" +
        '<span class="odesc">' + esc(o.desc) + "</span></span></label>" + why + "</div>";
    }).join("");
    var other = '<div class="optwrap"><label class="opt' + (a.choice === "other" ? " sel" : "") + '" data-opt="other">' +
      '<input type="radio" name="opt" value="other"' + (a.choice === "other" ? " checked" : "") + ">" +
      '<span class="badge">✎</span><span><span class="otitle">其他：我自己写答案</span>' +
      '<span class="odesc">以上都不合适，或者想改其中某个选项。</span></span></label></div>' +
      '<div class="field" id="otherField"' + (a.choice === "other" ? "" : " hidden") + ">" +
      '<label for="otherText">你的答案</label><textarea id="otherText" data-field="text" placeholder="写下你想怎么处理">' + esc(a.text || "") + "</textarea></div>";
    var last = i === N - 1;
    return '<section class="card">' +
      '<div class="eyebrow">' + esc(q.cat) + " · 第 " + (i + 1) + " / " + N + " 题</div>" +
      "<h1>" + esc(q.title) + "</h1>" +
      '<div class="ctx"><span class="lab">为什么问这个</span>' + q.ctx.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
      '<span class="src">' + esc(q.src) + "</span></div>" +
      '<div class="opts" role="radiogroup" aria-label="选项">' + opts + other + "</div>" +
      '<div class="field"><label for="noteText">补充说明或理由（可选）</label><textarea id="noteText" data-field="note" placeholder="例如：为什么选这个、有什么顾虑、需要我先查什么">' + esc(a.note || "") + "</textarea></div>" +
      '<label class="defer"><input type="checkbox" id="deferBox" data-field="defer"' + (a.defer ? " checked" : "") + "> 这题我先不定，需要更多信息或先调研</label>" +
      '<div class="nav"><button class="btn" data-act="' + (i === 0 ? "gostart" : "goq") + '" data-i="' + (i - 1) + '">' + (i === 0 ? "返回说明" : "上一题") + "</button>" +
      '<div class="navr">' + (q.rec ? '<button class="btn small" data-act="usrec">采用推荐</button>' : '') +
      '<button class="btn primary" data-act="' + (last ? "gosum" : "goq") + '" data-i="' + (i + 1) + '">' + (last ? "完成，查看汇总" : "下一题") + "</button></div></div>" +
      "</section>";
  }

  function viewSummary() {
    var c = counts();
    var dirty = S.submittedAt && S.updatedAt > S.submittedAt;
    var banner = "";
    if (S.submittedAt && !dirty) banner = '<div class="banner ok">已于 ' + new Date(S.submittedAt).toLocaleString() + " 提交。回到对话告诉我“已提交”，我会读取答案。</div>";
    else if (S.submittedAt && dirty) banner = '<div class="banner warn">提交之后你又修改了答案，请重新提交。</div>';
    else if (c.empty) banner = '<div class="banner warn">还有 ' + c.empty + " 题没有回答，可以先提交，也可以回去补。未答的题我会当作“没想好”，不会替你决定。</div>";
    var items = Q.map(function (q, i) {
      var st = status(q), a = getA(q.id);
      var ans = answerText(q);
      var tags = "";
      if (st === "empty") tags = '<span class="tag miss">未答</span>';
      if (a.defer) tags += ' <span class="tag warn">先不定</span>';
      return '<div class="sumitem"><div class="sumno">' + (i + 1) + "</div><div>" +
        '<div class="sumq">' + esc(q.title) + "</div>" +
        (ans ? '<div class="sumans">' + esc(ans) + "</div>" : "") +
        (a.note && a.note.trim() ? '<div class="sumnote">备注：' + esc(a.note.trim()) + "</div>" : "") +
        '</div><div class="sumact">' + tags + ' <button class="link" data-act="goq" data-i="' + i + '">修改</button></div></div>';
    }).join("");
    return '<section class="card"><div class="eyebrow">' + esc(ROUND.name) + "</div><h1>汇总与提交</h1>" + banner +
      '<div class="sumlist">' + items + "</div>" +
      '<div class="nav"><button class="btn" data-act="goq" data-i="' + (N - 1) + '">回到第 ' + N + " 题</button>" +
      '<div class="navr"><button class="btn" data-act="copy">复制全部答案</button>' +
      '<button class="btn primary" data-act="submit">' + (S.submittedAt ? "重新提交" : "提交") + "</button></div></div>" +
      '<div id="copyArea"></div></section>';
  }

  function render() {
    var r = route();
    if (r.v === "q") { app.innerHTML = viewQ(r.i); renderStrip(r.i); }
    else if (r.v === "summary") { app.innerHTML = viewSummary(); renderStrip(-1); }
    else { app.innerHTML = viewStart(); renderStrip(-1); }
    setSave(saveMode);
    if (r.v !== "q") window.scrollTo(0, 0);
  }

  /* ---------- 事件 ---------- */
  function curQ() { var r = route(); return r.v === "q" ? Q[r.i] : null; }
  function refreshSel() {
    var q = curQ(); if (!q) return;
    var a = getA(q.id);
    app.querySelectorAll(".opt").forEach(function (el) {
      var on = el.getAttribute("data-opt") === a.choice;
      el.classList.toggle("sel", on);
      var inp = el.querySelector("input"); if (inp) inp.checked = on;
    });
    var f = document.getElementById("otherField"); if (f) f.hidden = a.choice !== "other";
    var cb = document.getElementById("deferBox"); if (cb) cb.checked = !!a.defer;
    renderStrip(route().i);
  }

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (t) {
      var act = t.getAttribute("data-act");
      if (act === "goq") { go("q" + (parseInt(t.getAttribute("data-i"), 10) + 1)); return; }
      if (act === "gostart") { go("start"); return; }
      if (act === "gosum") { go("summary"); return; }
      if (act === "usrec") { var q = curQ(); if (q && q.rec) { setA(q.id, { choice: q.rec }); refreshSel(); } return; }
      if (act === "copy") { doCopy(); return; }
      if (act === "submit") { doSubmit(); return; }
    }
  });
  document.getElementById("strip").addEventListener("click", function (e) {
    var t = e.target.closest("[data-act='goq']");
    if (t) go("q" + (parseInt(t.getAttribute("data-i"), 10) + 1));
  });
  app.addEventListener("change", function (e) {
    var q = curQ(); if (!q) return;
    if (e.target.name === "opt") {
      setA(q.id, { choice: e.target.value });
      refreshSel();
      if (e.target.value === "other") { var ta = document.getElementById("otherText"); if (ta) ta.focus(); }
    } else if (e.target.id === "deferBox") {
      setA(q.id, { defer: e.target.checked });
      refreshSel();
    }
  });
  app.addEventListener("input", function (e) {
    var q = curQ(); if (!q) return;
    var f = e.target.getAttribute("data-field");
    if (f === "text") { setA(q.id, { text: e.target.value }); renderStrip(route().i); }
    else if (f === "note") { setA(q.id, { note: e.target.value }); }
  });
  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "textarea" || tag === "input" || e.metaKey || e.ctrlKey || e.altKey) return;
    var r = route();
    if (r.v !== "q") return;
    if (e.key === "ArrowRight") go(r.i === N - 1 ? "summary" : "q" + (r.i + 2));
    if (e.key === "ArrowLeft") go(r.i === 0 ? "start" : "q" + r.i);
  });
  window.addEventListener("hashchange", render);

  async function doSubmit() {
    S.submittedAt = Date.now();
    S.updatedAt = S.submittedAt;
    persistLocal();
    if (timer) { clearTimeout(timer); timer = null; }
    render();
    await flush();
    render();
    if (!dbh) {
      var area = document.getElementById("copyArea");
      if (area) area.innerHTML = '<div class="banner warn" style="margin-top:12px">云端保存不可用，我读不到你的答案。请点“复制全部答案”，把文字贴回对话。</div>';
    }
  }
  function doCopy() {
    var text = exportText();
    var area = document.getElementById("copyArea");
    function fallback() {
      area.innerHTML = '<div class="field" style="margin-top:12px"><span class="lab">浏览器不允许自动复制，请手动全选复制：</span><textarea class="copybox" id="copyBox" readonly></textarea></div>';
      var b = document.getElementById("copyBox"); b.value = text; b.focus(); b.select();
    }
    try {
      navigator.clipboard.writeText(text).then(function () {
        area.innerHTML = '<div class="banner ok" style="margin-top:12px">已复制到剪贴板。</div>';
      }, fallback);
    } catch (e) { fallback(); }
  }

  /* ---------- 启动 ---------- */
  document.getElementById("roundName").textContent = ROUND.name + " · 共 " + N + " 题";
  loadLocal();
  render();
  setSave("none");

  (async function connect() {
    try {
      var db = await (window.claude && window.claude.use ? window.claude.use("db") : null);
      if (!db) { if (Object.keys(S.answers).length) setSave("local"); else setSave("local"); return; }
      dbh = db;
      var snap = await Promise.race([
        db.doc(DOC_PATH).get(),
        new Promise(function (_, rej) { setTimeout(function () { rej({ code: "timeout" }); }, 10000); })
      ]);
      var cloudUpdated = 0;
      if (snap && snap.exists) {
        var d = snap.data() || {};
        cloudUpdated = d.updatedAt || 0;
        var ca = d.answers || {};
        Object.keys(ca).forEach(function (id) {
          if (!S.answers[id] || (ca[id].t || 0) > (S.answers[id].t || 0)) S.answers[id] = ca[id];
        });
        S.submittedAt = Math.max(S.submittedAt || 0, d.submittedAt || 0);
        S.updatedAt = Math.max(S.updatedAt || 0, cloudUpdated);
        persistLocal();
        var ae = document.activeElement;
        if (!ae || !/^(TEXTAREA|INPUT)$/.test(ae.tagName)) render();
        lastCloud = cloudUpdated || Date.now();
        setSave("cloud");
      } else {
        setSave("local");
        setSave(Object.keys(S.answers).length ? "saving" : "none");
      }
      if (S.updatedAt > cloudUpdated && Object.keys(S.answers).length) queueSave();
      else if (!Object.keys(S.answers).length) setSave("none");
    } catch (e) {
      setSave(dbh ? "fail" : "local");
    }
  })();
})();
</script>
