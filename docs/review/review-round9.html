* { box-sizing: border-box; }
body {

  background: var(--bg);

.wrap {

  flex-direction: column;

header.top {

  gap: 10px;
}
.brandrow {

  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.brand {

  font-weight: 700;

}
.round {

  color: var(--muted);
}
.strip {

}
.seg {

  background: var(--line);
  border: 0;
  padding: 0;

}
.seg:hover { transform: scaleY(1.25); }
.seg.done { background: var(--accent); }

}
.card {

.eyebrow {

  color: var(--muted);

}
h1 {

  gap: 6px;

  cursor: pointer;
  background: var(--surface);
  transition: border-color .15s ease, background .15s ease;
}
.opt:hover { border-color: var(--accent); }
.opt.sel {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.opt.hasWhy {

}

  border: 1.5px solid var(--line);

  place-items: center;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);

.sumitem {

.hint {

  color: var(--muted);

@media (max-width: 540px) {
  .card { padding: 18px 16px; }

  .sumitem { grid-template-columns: 28px 1fr; }

  var N = QUESTIONS.length;
  var state = { answers: {}, updatedAt: 0 };

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object" && parsed.answers) state = parsed;
      }
    } catch (e) {}
  }

  function save() {
    state.updatedAt = Date.now();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      var el = document.getElementById("saveText");
      if (el) el.textContent = "已自动保存在本机浏览器";
    } catch (e) {}
  }

  function getAns(id) {
    return state.answers[id] || { choice: "", other: "", note: "", defer: false };
  }

  function setAns(id, patch) {
    var cur = getAns(id);
    state.answers[id] = Object.assign({}, cur, patch);
    save();
  }

  function isAnswered(q) {
    var a = getAns(q.id);
    if (a.defer) return true;
    if (!a.choice) return false;
    if (a.choice === "OTHER") return (a.other || "").trim().length > 0;
    return true;
  }

  function countDone() {
    var c = 0;
    for (var i = 0; i < N; i++) if (isAnswered(QUESTIONS[i])) c++;
    return c;
  }

  function getRoute() {
    var h = (location.hash || "").replace(/^#/, "");
    if (!h || h === "start") return { view: "start", idx: -1 };
    if (h === "summary") return { view: "summary", idx: N };
    var m = /^q(\d+)$/.exec(h);
    if (m) {
      var i = parseInt(m[1], 10) - 1;
      if (i >= 0 && i < N) return { view: "q", idx: i };
    }
    return { view: "start", idx: -1 };
  }

  function go(hash) {
    location.hash = "#" + hash;
  }

  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, function (ch) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
    });
  }

  function renderStrip(activeIdx) {
    var strip = document.getElementById("strip");
    var html = "";
    for (var i = 0; i < N; i++) {
      var q = QUESTIONS[i];
      var a = getAns(q.id);
      var cls = "seg";
      if (a.defer) cls += " defer";
      else if (isAnswered(q)) cls += " done";
      if (i === activeIdx) cls += " cur";
      html += '<button type="button" class="' + cls + '" data-act="goq" data-i="' + i + '" title="第 ' + (i + 1) + ' 题：' + esc(q.title) + '"></button>';
    }
    strip.innerHTML = html;

    var done = countDone();
    var pt = document.getElementById("progressText");
    if (activeIdx >= 0 && activeIdx < N) {
      pt.textContent = "第 " + (activeIdx + 1) + " / " + N + " 题 · 已完成 " + done + " 题";
    } else if (activeIdx === N) {
      pt.textContent = "汇总页 · 已完成 " + done + " / " + N + " 题";
    } else {
      pt.textContent = "已完成 " + done + " / " + N + " 题";
    }
  }

  function renderStart() {
    renderStrip(-1);
    var done = countDone();
    var app = document.getElementById("app");
    app.innerHTML =
      '<section class="card">' +
        '<div class="eyebrow">一页一题 · 翻车场景推演 · 约 2 分钟</div>' +
        '<h1>把最后 8 处“不稳定节点”彻底焊死</h1>' +

          '</div>' +
        '</div>' +
      '</section>';

  function renderQuestion(i) {
    renderStrip(i);
    var q = QUESTIONS[i];
    var a = getAns(q.id);
    var optsHtml = "";

    for (var j = 0; j < q.options.length; j++) {
      var o = q.options[j];
      var isRec = o.k === q.rec;
      var isSel = a.choice === o.k;
      optsHtml +=
        '<div class="optwrap">' +
          '<label class="opt' + (isSel ? ' sel' : '') + (isRec ? ' hasWhy' : '') + '">' +
            '<input type="radio" name="opt" value="' + o.k + '"' + (isSel ? ' checked' : '') + '>' +
            '<span class="badge">' + o.k + '</span>' +
            '<span>' +
              '<span class="otitle">' + esc(o.t) + (isRec ? ' <span class="pill">推荐</span>' : '') + '</span>' +
              '<span class="odesc">' + esc(o.d) + '</span>' +
            '</span>' +
          '</label>' +
          (isRec ? '<div class="why"><div class="lab">为什么推荐这个方案？</div><p>' + esc(q.why) + '</p></div>' : '') +
        '</div>';
    }

    var isOther = a.choice === "OTHER";
    optsHtml +=
      '<div class="optwrap">' +
        '<label class="opt' + (isOther ? ' sel' : '') + '">' +
          '<input type="radio" name="opt" value="OTHER"' + (isOther ? ' checked' : '') + '>' +
          '<span class="badge">自</span>' +
          '<span>' +
            '<span class="otitle">其他想法（我自己写）</span>' +
            '<span class="odesc">按我下面写的来</span>' +
          '</span>' +
        '</label>' +
      '</div>';

    var app = document.getElementById("app");
    app.innerHTML =
      '<section class="card">' +
        '<div class="eyebrow">' + esc(q.group) + '</div>' +
        '<h1>' + esc(q.title) + '</h1>' +
        '<div class="scene">' +
          '<div class="lab">真实翻车场景带入</div>' +
          '<p>' + esc(q.scene) + '</p>' +
        '</div>' +
        '<div class="opts">' + optsHtml + '</div>' +
        (isOther
          ? '<div class="field"><span class="lab">写下你的做法：</span><textarea id="otherText" data-field="other" placeholder="直接用大白话写就行…">' + esc(a.other) + '</textarea></div>'
          : '') +
        '<div class="field">' +
          '<span class="lab">补充备注（选填）：</span>' +
          '<textarea data-field="note" placeholder="没有补充可以空着">' + esc(a.note) + '</textarea>' +
        '</div>' +
        '<label class="defer">' +
          '<input type="checkbox" id="deferBox"' + (a.defer ? ' checked' : '') + '>' +
          '<span>这题先不定</span>' +
        '</label>' +
        '<div class="nav">' +
          '<button type="button" class="btn" data-act="' + (i === 0 ? 'gostart' : 'goq') + '" data-i="' + (i - 1) + '">← 上一题</button>' +
          '<div class="navr">' +
            '<button type="button" class="btn recbtn" data-act="userec">采纳推荐（' + q.rec + '）并下一题</button>' +
            (i === N - 1
              ? '<button type="button" class="btn primary" data-act="gosum">去汇总页 →</button>'
              : '<button type="button" class="btn primary" data-act="goq" data-i="' + (i + 1) + '">下一题 →</button>') +
          '</div>' +
        '</div>' +
      '</section>';
  }

  function exportText() {
    var lines = ["【无限天真 · 第 9 轮不稳定节点加固结果】", ""];
    for (var i = 0; i < N; i++) {
      var q = QUESTIONS[i];
      var a = getAns(q.id);
      var ansStr = "未选";
      if (a.defer) {
        ansStr = "先不定";
      } else if (a.choice === "OTHER") {
        ansStr = "自定义：" + (a.other || "").trim();
      } else if (a.choice) {
        var found = q.options.find(function (x) { return x.k === a.choice; });
        ansStr = a.choice + "：" + (found ? found.t : "");
        if (a.choice === q.rec) ansStr += "（推荐）";
      }
      lines.push((i + 1) + ". " + q.title);
      lines.push("   决定：" + ansStr);
      if ((a.note || "").trim()) lines.push("   备注：" + a.note.trim());
    }
    return lines.join("\n");
  }

  function renderSummary() {
    renderStrip(N);
    var done = countDone();
    var listHtml = "";
    for (var i = 0; i < N; i++) {
      var q = QUESTIONS[i];
      var a = getAns(q.id);
      var badge = '<span class="tag miss">未选</span>';
      var ansText = "还没做决定";
      if (a.defer) {
        badge = '<span class="tag warn">先不定</span>';
        ansText = "留到后续再定";
      } else if (a.choice === "OTHER") {
        badge = '<span class="tag ok">自定义</span>';
        ansText = (a.other || "").trim() || "（未填内容）";
      } else if (a.choice) {
        var found = q.options.find(function (x) { return x.k === a.choice; });
        badge = '<span class="tag ok">选 ' + a.choice + (a.choice === q.rec ? ' · 推荐' : '') + '</span>';
        ansText = found ? found.t : a.choice;
      }
      listHtml +=
        '<div class="sumitem">' +
          '<div class="sumno">#' + (i + 1) + '</div>' +
          '<div>' +
            '<div class="sumq">' + esc(q.title) + '</div>' +
            '<div class="sumans">' + badge + esc(ansText) + '</div>' +
            ((a.note || "").trim() ? '<div class="sumnote">备注：' + esc(a.note.trim()) + '</div>' : '') +
          '</div>' +
          '<div class="sumact"><button type="button" class="btn small" data-act="goq" data-i="' + i + '">修改</button></div>' +
        '</div>';
    }

    var app = document.getElementById("app");
    app.innerHTML =
      '<section class="card">' +
        '<div class="eyebrow">汇总与导出</div>' +
        '<h1>确认你的 8 项加固决定</h1>' +
        (done < N
          ? '<div class="banner warn">还有 ' + (N - done) + ' 题没选。可以点右侧“修改”补齐，或直接一键填成推荐。</div>'
          : '<div class="banner ok">8 处脆弱点已全部确认加固！点下方“复制全部答案”发给我，我立即更新进终版开发蓝图。</div>') +
        '<div class="sumlist">' + listHtml + '</div>' +
        '<div class="nav">' +
          '<button type="button" class="btn" data-act="goq" data-i="' + (N - 1) + '">← 返回第 8 题</button>' +
          '<div class="navr">' +
            '<button type="button" class="btn" data-act="allrec">把未选题全部填成推荐</button>' +
            '<button type="button" class="btn primary" data-act="copy">复制全部答案</button>' +
          '</div>' +
        '</div>' +
        '<div id="copyArea"></div>' +
      '</section>';
  }

  function render() {
    var r = getRoute();
    if (r.view === "start") renderStart();
    else if (r.view === "summary") renderSummary();
    else renderQuestion(r.idx);
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var act = btn.getAttribute("data-act");
    if (act === "goq") {
      go("q" + (parseInt(btn.getAttribute("data-i"), 10) + 1));
    } else if (act === "gostart") {
      go("start");
    } else if (act === "gosum") {
      go("summary");
    } else if (act === "userec") {
      var r = getRoute();
      if (r.view === "q") {
        var q = QUESTIONS[r.idx];
        setAns(q.id, { choice: q.rec, defer: false });
        go(r.idx === N - 1 ? "summary" : "q" + (r.idx + 2));
      }
    } else if (act === "allrec") {
      for (var i = 0; i < N; i++) {
        var qi = QUESTIONS[i];
        if (!isAnswered(qi)) setAns(qi.id, { choice: qi.rec, defer: false });
      }
      render();
    } else if (act === "copy") {
      var txt = exportText();
      var area = document.getElementById("copyArea");
      function showBox(msg) {
        area.innerHTML =
          '<div class="banner ' + (msg ? 'ok' : 'warn') + '" style="margin-top:8px">' +
            (msg || '浏览器限制自动复制，请全选下方文字手动复制发给我：') +
          '</div>' +
          '<div class="field" style="margin-top:8px"><textarea class="copybox" id="copyBox" readonly></textarea></div>';
        var b = document.getElementById("copyBox");
        b.value = txt;
        if (!msg) { b.focus(); b.select(); }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () {
          showBox("已复制到剪贴板！直接粘贴回对话发给我即可。");
        }, function () { showBox(""); });
      } else {
        showBox("");
      }
    }
  });

  document.getElementById("app").addEventListener("change", function (e) {
    var r = getRoute();
    if (r.view !== "q") return;
    var q = QUESTIONS[r.idx];
    if (e.target.name === "opt") {
      setAns(q.id, { choice: e.target.value, defer: false });
      renderQuestion(r.idx);
      if (e.target.value === "OTHER") {
        var ta = document.getElementById("otherText");
        if (ta) ta.focus();
      }
    } else if (e.target.id === "deferBox") {
      setAns(q.id, { defer: e.target.checked });
      renderStrip(r.idx);
    }
  });

  document.getElementById("app").addEventListener("input", function (e) {
    var r = getRoute();
    if (r.view !== "q") return;
    var q = QUESTIONS[r.idx];
    var f = e.target.getAttribute("data-field");
    if (f === "other") {
      setAns(q.id, { other: e.target.value });
      renderStrip(r.idx);
    } else if (f === "note") {
      setAns(q.id, { note: e.target.value });
    }
  });

  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "textarea" || tag === "input" || e.metaKey || e.ctrlKey || e.altKey) return;
    var r = getRoute();
    if (r.view !== "q") return;
    if (e.key === "ArrowRight") go(r.idx === N - 1 ? "summary" : "q" + (r.idx + 2));
    if (e.key === "ArrowLeft") go(r.idx === 0 ? "start" : "q" + r.idx);
  });

  window.addEventListener("hashchange", render);
  load();
  render();
})();
</script>
</body>
</html>
