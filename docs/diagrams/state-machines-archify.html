<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无限天真 · 核心状态机交互架构图（Archify 风格）</title>
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f6;
  --ink: #161c24;
  --muted: #5d6a7a;
  --line: #d6dde6;
  --grid: rgba(22, 28, 36, 0.055);
  --shadow: 0 6px 24px rgba(15, 23, 42, 0.06);

  /* 顾客小程序 mp-buyer（胶囊形 · 蓝靛系） */
  --buyer-fill: #e8f1ff;
  --buyer-stroke: #2563eb;
  --buyer-text: #1e3a8a;

  /* 织女小程序 mp-weaver（六边形 · 翡翠绿系） */
  --weaver-fill: #e4f7ef;
  --weaver-stroke: #0f9d68;
  --weaver-text: #064e3b;

  /* 运营后台 & 云端引擎（方卡片 · 石板灰/紫系） */
  --sys-fill: #f3f0ff;
  --sys-stroke: #6d28d9;
  --sys-text: #3b0764;

  /* 异常/取消/售后终态（斜角虚线 · 暖橙红系） */
  --err-fill: #fff1f0;
  --err-stroke: #dc2626;
  --err-text: #7f1d1d;

  /* 正常终态（双框绿金） */
  --done-fill: #ecfdf5;
  --done-stroke: #059669;
  --done-text: #065f46;

  --edge: #7b8a9e;
  --edge-happy: #2563eb;
  --edge-err: #dc2626;
}
:root[data-theme="dark"] {
  --bg: #0d1117;
  --surface: #151b23;
  --surface-2: #1d2530;
  --ink: #e6edf3;
  --muted: #8b98a9;
  --line: #2a3441;
  --grid: rgba(230, 237, 243, 0.05);
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.4);

  --buyer-fill: #152544;
  --buyer-stroke: #60a5fa;
  --buyer-text: #dbeafe;

  --weaver-fill: #102e25;
  --weaver-stroke: #34d399;
  --weaver-text: #d1fae5;

  --sys-fill: #23193b;
  --sys-stroke: #a78bfa;
  --sys-text: #ede9fe;

  --err-fill: #35181b;
  --err-stroke: #f87171;
  --err-text: #fee2e2;

  --done-fill: #0f2d22;
  --done-stroke: #10b981;
  --done-text: #a7f3d0;

  --edge: #6b7a8f;
  --edge-happy: #60a5fa;
  --edge-err: #f87171;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
}
.app {
  display: grid;
  grid-template-rows: auto auto 1fr;
  height: 100vh;
}
header.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.titlebox {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.titlebox h1 {
  font-size: 16px;
  margin: 0;
  font-weight: 700;
}
.titlebox .sub {
  font-size: 12px;
  color: var(--muted);
}
.tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.tab {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--muted);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s ease;
}
.tab:hover { color: var(--ink); border-color: var(--buyer-stroke); }
.tab.active {
  background: var(--buyer-stroke);
  border-color: var(--buyer-stroke);
  color: #fff;
}
.tools {
  display: flex;
  align-items: center;
  gap: 6px;
}
.tbtn {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  padding: 5px 10px;
  border-radius: 7px;
  font-size: 12.5px;
  cursor: pointer;
}
.tbtn:hover { border-color: var(--buyer-stroke); }
.tbtn.on {
  background: var(--weaver-fill);
  border-color: var(--weaver-stroke);
  color: var(--weaver-text);
  font-weight: 600;
}
.legendbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 8px 18px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
  flex-wrap: wrap;
}
.legends {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}
.leg {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-weight: 600;
}
.leg svg { width: 32px; height: 18px; overflow: visible; }
.hint { color: var(--muted); font-size: 12px; }

.stage-wrap {
  position: relative;
  overflow: hidden;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  cursor: grab;
}
.stage-wrap.dragging { cursor: grabbing; }
svg#canvas {
  width: 100%;
  height: 100%;
  display: block;
  user-select: none;
}

/* SVG Node & Edge styles */
.node { cursor: pointer; transition: filter .15s ease; }
.node:hover { filter: drop-shadow(0 4px 10px rgba(37, 99, 235, 0.22)); }
.node.selected .shape { stroke-width: 3.2px; }
.node text.ntitle { font-size: 13.5px; font-weight: 700; text-anchor: middle; pointer-events: none; }
.node text.ncode { font-size: 10.5px; font-family: ui-monospace, Menlo, monospace; text-anchor: middle; opacity: 0.78; pointer-events: none; }
.node text.ntag { font-size: 10px; font-weight: 700; text-anchor: middle; pointer-events: none; }

.node.buyer .shape { fill: var(--buyer-fill); stroke: var(--buyer-stroke); stroke-width: 2; }
.node.buyer text { fill: var(--buyer-text); }

.node.weaver .shape { fill: var(--weaver-fill); stroke: var(--weaver-stroke); stroke-width: 2; }
.node.weaver text { fill: var(--weaver-text); }

.node.sys .shape { fill: var(--sys-fill); stroke: var(--sys-stroke); stroke-width: 2; }
.node.sys text { fill: var(--sys-text); }

.node.err .shape { fill: var(--err-fill); stroke: var(--err-stroke); stroke-width: 1.8; stroke-dasharray: 5 3; }
.node.err text { fill: var(--err-text); }

.node.done .shape { fill: var(--done-fill); stroke: var(--done-stroke); stroke-width: 2.4; }
.node.done text { fill: var(--done-text); }

.edge-path { fill: none; stroke: var(--edge); stroke-width: 1.8; }
.edge-path.happy { stroke: var(--edge-happy); stroke-width: 2.2; }
.edge-path.err { stroke: var(--edge-err); stroke-width: 1.7; stroke-dasharray: 5 4; }
.edge-trace {
  fill: none;
  stroke: var(--edge-happy);
  stroke-width: 3;
  stroke-dasharray: 8 18;
  opacity: 0;
  pointer-events: none;
}
body.trace-on .edge-trace {
  opacity: 0.9;
  animation: dashFlow 1.2s linear infinite;
}
@keyframes dashFlow {
  to { stroke-dashoffset: -26; }
}
.edge-label-bg { fill: var(--surface); opacity: 0.92; rx: 4; ry: 4; stroke: var(--line); stroke-width: 0.8; }
.edge-label { font-size: 11px; fill: var(--muted); text-anchor: middle; dominant-baseline: central; pointer-events: none; }

/* Inspector Drawer */
.drawer {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 310px;
  max-height: calc(100% - 28px);
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 16px;
  display: none;
  flex-direction: column;
  gap: 10px;
}
.drawer.open { display: flex; }
.dhead {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 8px;
}
.dclose {
  border: 0;
  background: var(--surface-2);
  color: var(--muted);
  width: 26px;
  height: 26px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 15px;
}
.dpill {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 99px;
}
.dpill.buyer { background: var(--buyer-fill); color: var(--buyer-text); border: 1px solid var(--buyer-stroke); }
.dpill.weaver { background: var(--weaver-fill); color: var(--weaver-text); border: 1px solid var(--weaver-stroke); }
.dpill.sys { background: var(--sys-fill); color: var(--sys-text); border: 1px solid var(--sys-stroke); }
.dpill.err { background: var(--err-fill); color: var(--err-text); border: 1px solid var(--err-stroke); }
.dpill.done { background: var(--done-fill); color: var(--done-text); border: 1px solid var(--done-stroke); }
.drawer h3 { margin: 2px 0 0; font-size: 16px; }
.drawer .code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
.drawer .sec { border-top: 1px solid var(--line); padding-top: 8px; font-size: 13px; line-height: 1.6; }
.drawer .sec b { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
</style>
</head>
<body class="trace-on">
<div class="app">
  <header class="topbar">
    <div class="titlebox">
      <h1>无限天真 · 核心状态机交互图</h1>
      <span class="sub">按端区分节点形状 · 点击节点看副作用</span>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="tools">
      <button class="tbtn on" id="traceBtn" title="开关主路径动态流向">流向动画：开</button>
      <button class="tbtn" id="zoomOut">－</button>
      <button class="tbtn" id="zoomReset">适配</button>
      <button class="tbtn" id="zoomIn">＋</button>
      <button class="tbtn" id="themeBtn">切换深浅色</button>
    </div>
  </header>

  <div class="legendbar">
    <div class="legends">
      <span class="leg">
        <svg viewBox="0 0 32 18"><rect x="1" y="2" width="30" height="14" rx="7" ry="7" fill="var(--buyer-fill)" stroke="var(--buyer-stroke)" stroke-width="2"/></svg>
        顾客小程序 (mp-buyer · 含粉丝志愿者) —— 胶囊圆角
      </span>
      <span class="leg">
        <svg viewBox="0 0 32 18"><polygon points="6,1 26,1 31,9 26,17 6,17 1,9" fill="var(--weaver-fill)" stroke="var(--weaver-stroke)" stroke-width="2"/></svg>
        织女小程序 (mp-weaver) —— 六边形
      </span>
      <span class="leg">
        <svg viewBox="0 0 32 18"><rect x="1" y="2" width="30" height="14" rx="3" ry="3" fill="var(--sys-fill)" stroke="var(--sys-stroke)" stroke-width="2"/></svg>
        运营后台 / 云端引擎 / 外部通道 —— 方卡片
      </span>
      <span class="leg">
        <svg viewBox="0 0 32 18"><polygon points="5,1 27,1 31,5 31,13 27,17 5,17 1,13 1,5" fill="var(--err-fill)" stroke="var(--err-stroke)" stroke-width="1.8" stroke-dasharray="4 2"/></svg>
        取消 / 售后 / 异常终态 —— 切角虚线
      </span>
    </div>
    <span class="hint">滚轮缩放 · 拖拽画布 · 点击任意节点查看详情</span>
  </div>

  <div class="stage-wrap" id="stageWrap">
    <svg id="canvas">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
          <path d="M 1 1 L 9 5 L 1 9 z" fill="var(--edge)"/>
        </marker>
        <marker id="arr-happy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 1 1 L 9 5 L 1 9 z" fill="var(--edge-happy)"/>
        </marker>
        <marker id="arr-err" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
          <path d="M 1 1 L 9 5 L 1 9 z" fill="var(--edge-err)"/>
        </marker>
      </defs>
      <g id="viewport"></g>
    </svg>

    <aside class="drawer" id="drawer">
      <div class="dhead">
        <div>
          <span class="dpill" id="dPill"></span>
          <h3 id="dTitle"></h3>
          <div class="code" id="dCode"></div>
        </div>
        <button class="dclose" id="dClose">×</button>
      </div>
      <div class="sec"><b>谁来操作 / 触发端</b><div id="dActor"></div></div>
      <div class="sec"><b>核心规则与副作用</b><div id="dDesc"></div></div>
      <div class="sec"><b>涉及集合与关键字段</b><div id="dSchema"></div></div>
    </aside>
  </div>
</div>

  var curIdx = 0;

  var selectedId = null;

  var svg = document.getElementById("canvas");

  var stageWrap = document.getElementById("stageWrap");

  function applyTransform() {
    vp.setAttribute("transform", "translate(" + tx + "," + ty + ") scale(" + scale + ")");
  }

  function fitView() {
    var d = DIAGRAMS[curIdx];
    var rect = stageWrap.getBoundingClientRect();
    var pad = 44;
    var sw = (rect.width - pad * 2) / d.w;
    var sh = (rect.height - pad * 2) / d.h;
    scale = Math.min(1.08, Math.max(0.45, Math.min(sw, sh)));
    tx = (rect.width - d.w * scale) / 2;
    ty = (rect.height - d.h * scale) / 2;
    applyTransform();
  }

  function shapePath(n) {
    var hw = n.w / 2, hh = n.h / 2;
    if (n.role === "buyer") {
      // 胶囊圆角矩形 (Pill / Stadium)
      return '<rect class="shape" x="' + (-hw) + '" y="' + (-hh) + '" width="' + n.w + '" height="' + n.h + '" rx="' + hh + '" ry="' + hh + '"/>';
    }
    if (n.role === "weaver") {
      // 六边形 (Hexagon)
      var c = 18;
      var pts = [
        (-hw + c) + "," + (-hh),
        (hw - c) + "," + (-hh),
        hw + ",0",
        (hw - c) + "," + hh,
        (-hw + c) + "," + hh,
        (-hw) + ",0"
      ].join(" ");
      return '<polygon class="shape" points="' + pts + '"/>';
    }
    if (n.role === "err") {
      // 切角矩形 (Beveled Octagon)
      var b = 10;
      var pts2 = [
        (-hw + b) + "," + (-hh),
        (hw - b) + "," + (-hh),
        hw + "," + (-hh + b),
        hw + "," + (hh - b),
        (hw - b) + "," + hh,
        (-hw + b) + "," + hh,
        (-hw) + "," + (hh - b),
        (-hw) + "," + (-hh + b)
      ].join(" ");
      return '<polygon class="shape" points="' + pts2 + '"/>';
    }
    if (n.role === "done") {
      // 双框圆角矩形
      return '<rect class="shape" x="' + (-hw) + '" y="' + (-hh) + '" width="' + n.w + '" height="' + n.h + '" rx="10" ry="10"/>' +
             '<rect x="' + (-hw + 4) + '" y="' + (-hh + 4) + '" width="' + (n.w - 8) + '" height="' + (n.h - 8) + '" rx="7" ry="7" fill="none" stroke="var(--done-stroke)" stroke-width="1" opacity="0.6"/>';
    }
    // 运营/云端引擎：方卡片矩形
    return '<rect class="shape" x="' + (-hw) + '" y="' + (-hh) + '" width="' + n.w + '" height="' + n.h + '" rx="6" ry="6"/>';
  }

  function anchorPoint(n, tx2, ty2) {
    var dx = tx2 - n.x, dy = ty2 - n.y;
    var hw = n.w / 2 + 2, hh = n.h / 2 + 2;
    if (dx === 0 && dy === 0) return { x: n.x, y: n.y };
    var sx2 = Math.abs(dx) > 0.001 ? hw / Math.abs(dx) : 1e9;
    var sy2 = Math.abs(dy) > 0.001 ? hh / Math.abs(dy) : 1e9;
    var t = Math.min(sx2, sy2);
    return { x: n.x + dx * t, y: n.y + dy * t };
  }

  function esc(s) {
    return String(s || "").replace(/[&<>"]/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
  }

  function renderDiagram() {
    var d = DIAGRAMS[curIdx];
    var map = {};
    d.nodes.forEach(function (n) { map[n.id] = n; });

    var html = '<g class="edges">';
    d.edges.forEach(function (e) {
      var a = map[e.from], b = map[e.to];
      if (!a || !b) return;
      var p1 = anchorPoint(a, b.x, b.y);
      var p2 = anchorPoint(b, a.x, a.y);
      var mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
      var pathD, lx, ly;
      if (e.curve) {
        var dx = p2.x - p1.x, dy = p2.y - p1.y;
        var len = Math.hypot(dx, dy) || 1;
        var nx = -dy / len, ny = dx / len;
        var cx = mx + nx * e.curve, cy = my + ny * e.curve;
        pathD = "M " + p1.x + " " + p1.y + " Q " + cx + " " + cy + " " + p2.x + " " + p2.y;
        lx = 0.25 * p1.x + 0.5 * cx + 0.25 * p2.x;
        ly = 0.25 * p1.y + 0.5 * cy + 0.25 * p2.y;
      } else {
        pathD = "M " + p1.x + " " + p1.y + " L " + p2.x + " " + p2.y;
        lx = mx; ly = my;
      }
      var cls = "edge-path" + (e.type === "happy" ? " happy" : e.type === "err" ? " err" : "");
      var mk = e.type === "happy" ? "url(#arr-happy)" : e.type === "err" ? "url(#arr-err)" : "url(#arr)";
      html += '<path class="' + cls + '" d="' + pathD + '" marker-end="' + mk + '"/>';
      if (e.type === "happy") {
        html += '<path class="edge-trace" d="' + pathD + '"/>';
      }
      if (e.label) {
        var lw = Math.max(46, e.label.length * 10.5 + 14);
        html += '<rect class="edge-label-bg" x="' + (lx - lw / 2) + '" y="' + (ly - 10) + '" width="' + lw + '" height="20"/>';
        html += '<text class="edge-label" x="' + lx + '" y="' + ly + '">' + esc(e.label) + '</text>';
      }
    });
    html += '</g><g class="nodes">';

    d.nodes.forEach(function (n) {
      var selCls = selectedId === n.id ? " selected" : "";
      html += '<g class="node ' + n.role + selCls + '" data-id="' + n.id + '" transform="translate(' + n.x + ',' + n.y + ')">';
      html += shapePath(n);
      html += '<text class="ntag" y="' + (-n.h / 2 + 14) + '">' + esc(n.tag) + '</text>';
      html += '<text class="ntitle" y="3">' + esc(n.title) + '</text>';
      html += '<text class="ncode" y="' + (n.h / 2 - 9) + '">' + esc(n.code) + '</text>';
      html += '</g>';
    });
    html += '</g>';

    vp.innerHTML = html;
    fitView();
  }

  function renderTabs() {
    var html = "";
    DIAGRAMS.forEach(function (d, i) {
      html += '<button class="tab' + (i === curIdx ? ' active' : '') + '" data-tab="' + i + '">' + esc(d.name) + '</button>';
    });
    document.getElementById("tabs").innerHTML = html;
  }

  function openDrawer(n) {
    selectedId = n.id;
    var pill = document.getElementById("dPill");
    pill.className = "dpill " + n.role;
    pill.textContent = roleNames[n.role];

    document.getElementById("dActor").textContent = n.actor;
    document.getElementById("dDesc").textContent = n.desc;
    document.getElementById("dSchema").textContent = n.schema;
    document.getElementById("drawer").classList.add("open");
    document.querySelectorAll(".node").forEach(function (el) {
      el.classList.toggle("selected", el.getAttribute("data-id") === n.id);
    });
  }

  function closeDrawer() {
    selectedId = null;
    document.getElementById("drawer").classList.remove("open");

  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]");
    if (!b) return;
    curIdx = parseInt(b.getAttribute("data-tab"), 10);
    closeDrawer();
    renderTabs();
    renderDiagram();
  });

  vp.addEventListener("click", function (e) {
    var g = e.target.closest(".node");
    if (!g) return;
    var id = g.getAttribute("data-id");
    var n = DIAGRAMS[curIdx].nodes.find(function (x) { return x.id === id; });
    if (n) openDrawer(n);
  });

  document.getElementById("dClose").addEventListener("click", closeDrawer);

  document.getElementById("traceBtn").addEventListener("click", function () {
    var on = document.body.classList.toggle("trace-on");
    this.classList.toggle("on", on);
    this.textContent = "流向动画：" + (on ? "开" : "关");
  });

  document.getElementById("themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  });

  document.getElementById("zoomIn").addEventListener("click", function () { scale = Math.min(2.2, scale * 1.18); applyTransform(); });
  document.getElementById("zoomOut").addEventListener("click", function () { scale = Math.max(0.35, scale / 1.18); applyTransform(); });
  document.getElementById("zoomReset").addEventListener("click", fitView);

  stageWrap.addEventListener("wheel", function (e) {
    e.preventDefault();
    var factor = e.deltaY < 0 ? 1.1 : 0.91;
    var rect = stageWrap.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var ns = Math.min(2.4, Math.max(0.35, scale * factor));
    tx = mx - (mx - tx) * (ns / scale);
    ty = my - (my - ty) * (ns / scale);
    scale = ns;
    applyTransform();
  }, { passive: false });

  stageWrap.addEventListener("mousedown", function (e) {
    if (e.target.closest(".node") || e.target.closest(".drawer")) return;
    dragging = true;
    sx = e.clientX - tx;
    sy = e.clientY - ty;
    stageWrap.classList.add("dragging");
  });
  window.addEventListener("mousemove", function (e) {
    if (!dragging) return;
    tx = e.clientX - sx;
    ty = e.clientY - sy;
    applyTransform();
  });
  window.addEventListener("mouseup", function () {
    dragging = false;
    stageWrap.classList.remove("dragging");
  });
  window.addEventListener("resize", fitView);

  if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
  renderTabs();
  renderDiagram();
})();
</script>
</body>
</html>
