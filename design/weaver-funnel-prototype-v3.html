<!DOCTYPE html>
<html lang="zh-CN" data-theme="slate_indigo" data-variant="standard" data-dataset="demo">
<head>
<meta charset="UTF-8" />
<!-- mobile-native + better-accessibility: Never disable user zoom; fix 17px input size instead -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#F5F6F8" />
<title>无限天真 · 织女准入小程序 v3（全工作流精修 · 适老关怀与极限压力验证版）</title>
<style>
  /* ===== 1. Semantic Palette Tokens (Locked Primary: #3 质检靛青灰 slate_indigo) ===== */
  :root,
  [data-theme="slate_indigo"] {
    --stage-bg: #E2E5EC;
    --bg: #F5F6F8;
    --card: #FFFFFF;
    --soft: #EEF0F4;
    --line: rgba(21, 25, 34, 0.08);
    --line-strong: #C7CFDF;
    --input-border: #8590A6; /* >= 3.2:1 non-text contrast against #FFF (WCAG 1.4.11) */
    --stitch: #8E9BB5;

    --brand: #293B63;
    --brand-dark: #1D2B4A;
    --brand-soft: #F0F3F9;
    --brand-line: rgba(41, 59, 99, 0.24);
    --btn-shadow: rgba(29, 43, 74, 0.12);

    --ok: #177245;
    --ok-soft: #ECF6F0;
    --ok-line: rgba(23, 114, 69, 0.24);

    --warn: #945610;
    --warn-soft: #FDF5E8;
    --warn-line: rgba(148, 86, 16, 0.26);

    --bad: #C43626;
    --bad-soft: #FDF0EE;
    --bad-line: rgba(196, 54, 38, 0.26);

    --ink: rgba(17, 24, 39, 0.92);
    --ink-mid: rgba(17, 24, 39, 0.64);
    --ink-sub: rgba(17, 24, 39, 0.46);
  }

  [data-theme="trust_blue"] {
    --stage-bg: #DCE3ED;
    --bg: #F4F6FA;
    --card: #FFFFFF;
    --soft: #EBF0F7;
    --line: rgba(17, 24, 39, 0.08);
    --line-strong: #C9D5E6;
    --input-border: #7F93B0;
    --stitch: #8CA4C4;

    --brand: #1B56B5;
    --brand-dark: #133F87;
    --brand-soft: #EEF4FC;
    --brand-line: rgba(27, 86, 181, 0.24);
    --btn-shadow: rgba(27, 86, 181, 0.14);

    --ok: #177245;
    --ok-soft: #ECF6F0;
    --ok-line: rgba(23, 114, 69, 0.24);
    --warn: #945610;
    --warn-soft: #FDF5E8;
    --warn-line: rgba(148, 86, 16, 0.26);
    --bad: #C43626;
    --bad-soft: #FDF0EE;
    --bad-line: rgba(196, 54, 38, 0.26);

    --ink: rgba(17, 24, 39, 0.92);
    --ink-mid: rgba(17, 24, 39, 0.64);
    --ink-sub: rgba(17, 24, 39, 0.46);
  }

  [data-theme="wechat_jade"] {
    --stage-bg: #DDE5E0;
    --bg: #F4F6F5;
    --card: #FFFFFF;
    --soft: #E9EFEC;
    --line: rgba(18, 29, 24, 0.08);
    --line-strong: #C6D5CE;
    --input-border: #7D968A;
    --stitch: #87A898;

    --brand: #077A55;
    --brand-dark: #055A3E;
    --brand-soft: #EAF5F0;
    --brand-line: rgba(7, 122, 85, 0.24);
    --btn-shadow: rgba(7, 122, 85, 0.14);

    --ok: #077A55;
    --ok-soft: #EAF5F0;
    --ok-line: rgba(7, 122, 85, 0.24);
    --warn: #945610;
    --warn-soft: #FDF5E8;
    --warn-line: rgba(148, 86, 16, 0.26);
    --bad: #C43626;
    --bad-soft: #FDF0EE;
    --bad-line: rgba(196, 54, 38, 0.26);

    --ink: rgba(17, 26, 22, 0.92);
    --ink-mid: rgba(17, 26, 22, 0.64);
    --ink-sub: rgba(17, 26, 22, 0.46);
  }

  /* ===== 2. WeUI Typography + Concentric Radii + Emil Motion Tokens ===== */
  :root {
    --font-hero: 34px;
    --font-h1: 22px;     /* WeUI 页面大标题 22px / 44rpx */
    --font-body: 17px;   /* WeUI 主正文 / 导航栏 / 主按钮 / 选项主文案 17px / 34rpx */
    --font-sub: 15px;    /* WeUI 次要正文 15px / 30rpx */
    --font-desc: 14px;   /* WeUI 辅助说明 14px / 28rpx */
    --font-cap: 12px;    /* WeUI 次级标签 / 状态栏 12px / 24rpx */

    /* better-ui Concentric Radii: outer (18px) = inner (8px) + padding (10px) */
    --radius-card: 12px;
    --radius-outer: 18px;
    --radius-inner: 8px;
    --radius-btn: 10px;
    --card-shadow: 0 1px 2px rgba(17, 24, 39, 0.03), 0 4px 12px rgba(17, 24, 39, 0.025);

    /* emil-design-eng Strong Custom Easing Curves */
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --dur-press: 120ms;
    --dur-fade: 125ms;
    --dur-lead: 175ms;
    --dur-support: 155ms;
    --dur-sheet-in: 240ms;
    --dur-sheet-out: 180ms; /* Asymmetric: exit faster than enter */
  }

  /* Variant 3: WeChat Care Mode (关怀大字版 — steps up along WeUI tokens while keeping zero scroll!) */
  [data-variant="care_large"] .phone {
    --font-h1: 22px;
    --font-body: 17px;
    --font-sub: 17px;
    --font-desc: 15px;
    --font-cap: 14px;
  }

  /* Variant 2: Visual-Max Minimal Copy Mode (极简少字图示版 — hides secondary prose, enlarges visuals) */
  [data-variant="visual_max"] .screen .lead:not(.keep-lead) {
    display: none;
  }
  [data-variant="visual_max"] .hero-art {
    height: 204px;
  }
  [data-variant="visual_max"] .quiz-art {
    height: 112px;
  }
  [data-variant="visual_max"] .guide-svg {
    height: 124px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  /* mobile-native Baseline: overscroll containment & landscape font-inflation guard */
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--stage-bg);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    text-rendering: optimizeLegibility;
  }

  /* mobile-native Hard Rule #8: user-select: none ONLY on controls, NEVER on body/content */
  button, [role="button"], [role="radio"], [role="checkbox"], .wx-top, .stage-bar {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  button, input, a, [role="button"], [role="radio"], [role="checkbox"] {
    touch-action: manipulation;
  }

  /* better-accessibility 2.4.13: High-contrast >=3:1 :focus-visible ring for keyboard/switch users */
  button:focus-visible,
  input:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }

  ::selection {
    background: var(--brand-soft);
    color: var(--brand-dark);
  }

  /* ===== Desktop Stage ===== */
  .stage {
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 16px 24px;
  }

  /* ===== 375pt WeChat Viewport ===== */
  .phone {
    width: 375px;
    height: min(760px, calc(100vh - 32px));
    min-height: 620px;
    background: var(--bg);
    border-radius: 42px;
    border: 1px solid transparent;
    box-shadow:
      0 0 0 8px #1E222B,
      0 0 0 9.5px rgba(255, 255, 255, 0.18),
      0 24px 56px rgba(17, 24, 39, 0.20);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  /* Top WeChat Chrome */
  .wx-top {
    flex-shrink: 0;
    background: var(--bg);
    position: relative;
    z-index: 20;
  }
  .wx-status {
    height: 42px;
    padding: 12px 24px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: var(--font-cap);
    font-weight: 600;
    letter-spacing: 0.2px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .wx-notch {
    width: 104px;
    height: 24px;
    background: #14171F;
    border-radius: 999px;
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
  }
  .wx-nav {
    height: 44px;
    padding: 0 12px 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .wx-back {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: var(--font-sub);
    font-weight: 400;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 8px 6px 8px 0; /* >= 44px hit target height */
    min-height: 44px;
    cursor: pointer;
    font-family: inherit;
    min-width: 84px;
    transition: opacity var(--dur-fade) var(--ease-out), transform var(--dur-press) var(--ease-out);
  }
  .wx-back:active { opacity: 0.55; transform: translateX(-2px); }
  .wx-back.hidden { visibility: hidden; pointer-events: none; }
  .wx-title {
    font-size: var(--font-body);
    font-weight: 500;
    color: var(--ink);
    text-align: center;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .wx-capsule {
    width: 84px;
    height: 30px;
    border-radius: 999px;
    border: 0.5px solid rgba(17, 24, 39, 0.12);
    background: rgba(255, 255, 255, 0.68);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    flex-shrink: 0;
  }
  .wx-cap-div {
    width: 0.5px;
    height: 16px;
    background: rgba(17, 24, 39, 0.14);
  }

  /* Hairline 4-Stage Progress Bar */
  .stage-bar {
    flex-shrink: 0;
    padding: 4px 20px 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .stage-seg {
    flex: 1;
    height: 3px;
    border-radius: 999px;
    background: rgba(17, 24, 39, 0.08);
    overflow: hidden;
  }
  .stage-seg-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--brand);
    transition: width 220ms var(--ease-out), background-color 180ms var(--ease-out);
  }
  .stage-seg.done .stage-seg-fill {
    background: var(--ok);
    width: 100%;
  }

  /* ===== choreograph Skill: Direction-Aware + Cast Roles (Lead / Support / Decoration) =====
     - Forward (Next): content enters from +8px right; Back: enters from -8px left.
     - Lead (.c-lead): 0ms, moves 8px (4px for Support .c-support at 35ms).
     - Decoration (.c-deco): fades ONLY (0px movement!) at 55ms — non-uniform gaps, total < 240ms.
     - One entrance per container; keyboard/reviewer jumps skip animation completely!
  */
  @keyframes enterFwdLead    { from { opacity: 0; transform: translateX(8px); }  to { opacity: 1; transform: translateX(0); } }
  @keyframes enterFwdSupport { from { opacity: 0; transform: translateX(4px); }  to { opacity: 1; transform: translateX(0); } }
  @keyframes enterBackLead   { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes enterBackSupport{ from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes decoFade        { from { opacity: 0; }                              to { opacity: 1; } }
  @keyframes badgeSettle     { from { opacity: 0; transform: scale(0.94); }      to { opacity: 1; transform: scale(1); } }
  @keyframes gentleNudge     { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-4px); } 65% { transform: translateX(4px); } }

  @media (prefers-reduced-motion: no-preference) {
    .screen.dir-fwd .c-lead    { animation: enterFwdLead var(--dur-lead) var(--ease-out) both; }
    .screen.dir-fwd .c-support { animation: enterFwdSupport var(--dur-support) var(--ease-out) 35ms both; }
    .screen.dir-fwd .c-deco    { animation: decoFade var(--dur-fade) var(--ease-out) 55ms both; }

    .screen.dir-back .c-lead    { animation: enterBackLead var(--dur-lead) var(--ease-out) both; }
    .screen.dir-back .c-support { animation: enterBackSupport var(--dur-support) var(--ease-out) 35ms both; }
    .screen.dir-back .c-deco    { animation: decoFade var(--dur-fade) var(--ease-out) 55ms both; }

    .badge-pop { animation: badgeSettle 180ms var(--ease-out) both; }
    .nudge-attn {
      animation: gentleNudge 240ms var(--ease-out);
      box-shadow: 0 0 0 2px var(--brand) !important;
    }
  }

  /* choreograph Reduced Motion: collapse delays & movement into singlesimultaneous opacity fade */
  @media (prefers-reduced-motion: reduce) {
    .screen.dir-fwd .c-lead,
    .screen.dir-fwd .c-support,
    .screen.dir-fwd .c-deco,
    .screen.dir-back .c-lead,
    .screen.dir-back .c-support,
    .screen.dir-back .c-deco {
      animation: decoFade 120ms ease both;
    }
    .nudge-attn { box-shadow: 0 0 0 2px var(--brand) !important; }
  }

  /* ===== Main Viewport: STRICT NO VERTICAL OR HORIZONTAL SCROLL ===== */
  .screen {
    flex: 1;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
    padding: 12px 20px 8px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    position: relative;
  }

  /* Page Header Row (break-ui resilient: min-width:0 on title, flex-shrink:0 on trailing control) */
  .head-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
    position: relative;
  }
  .h1 {
    margin: 0;
    min-width: 0;
    flex: 1;
    font-size: var(--font-h1);
    font-weight: 600;
    line-height: 1.34;
    letter-spacing: -0.2px;
    color: var(--ink);
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  .lead {
    margin: 0 0 14px;
    font-size: var(--font-desc);
    font-weight: 400;
    line-height: 1.48;
    color: var(--ink-mid);
    text-wrap: pretty;
  }

  /* Origin-Aware Voice Trigger + Popover (better-ui optical padding: 9px icon-side vs 11px text-side!) */
  .speak-wrap {
    position: relative;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .speak-btn {
    appearance: none;
    position: relative;
    height: 30px;
    padding: 0 11px 0 9px; /* better-ui: 2px less padding on leading icon side */
    border-radius: 999px;
    border: 1px solid var(--brand-line);
    background: var(--card);
    color: var(--brand);
    font-size: var(--font-cap);
    font-weight: 500;
    font-family: inherit;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(17, 24, 39, 0.03);
    transition: background-color var(--dur-fade) var(--ease-out), color var(--dur-fade) var(--ease-out), transform var(--dur-press) var(--ease-out);
  }
  /* Invisible 44px touch hit-target expansion without colliding with sibling controls */
  .speak-btn::after {
    content: "";
    position: absolute;
    inset: -7px -4px;
  }
  .speak-btn:active { transform: scale(0.97); }
  .speak-btn.speaking {
    background: var(--brand);
    border-color: var(--brand);
    color: #FFFFFF;
  }

  .voice-pop {
    position: absolute;
    top: 36px;
    right: 0;
    width: 220px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(21, 25, 34, 0.94);
    backdrop-filter: blur(8px);
    color: #FFFFFF;
    font-size: var(--font-cap);
    line-height: 1.45;
    box-shadow: 0 10px 24px rgba(17, 24, 39, 0.18);
    transform-origin: top right;
    opacity: 0;
    transform: scale(0.95) translateY(-3px);
    pointer-events: none;
    transition: opacity var(--dur-fade) var(--ease-out), transform 150ms var(--ease-out);
    z-index: 45;
  }
  .voice-pop.open {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }
  .voice-bars {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    height: 10px;
    margin-right: 5px;
    vertical-align: middle;
  }
  .voice-bars i {
    display: block;
    width: 2px;
    height: 8px;
    border-radius: 1px;
    background: #93C5FD;
    animation: eqBar 520ms var(--ease-out) infinite alternate;
  }
  .voice-bars i:nth-child(2) { animation-delay: 140ms; height: 10px; }
  .voice-bars i:nth-child(3) { animation-delay: 260ms; height: 6px; }
  @keyframes eqBar { from { transform: scaleY(0.45); } to { transform: scaleY(1); } }

  /* ===== Welcome Screen ===== */
  .hero-art {
    width: 100%;
    height: 180px;
    border-radius: var(--radius-card);
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .pillar-group {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    display: flex;
    margin-top: auto;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .pillar-chip {
    flex: 1;
    min-width: 0;
    padding: 13px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
  }
  .pillar-chip + .pillar-chip::before {
    content: "";
    position: absolute;
    left: 0;
    top: 16px;
    bottom: 16px;
    width: 1px;
    background: var(--line);
  }
  .pillar-ico {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--brand-soft);
    color: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .pillar-txt {
    font-size: var(--font-desc);
    font-weight: 500;
    color: var(--ink);
    text-align: center;
  }

  /* ===== Grid Choice Cards (break-ui resilient: min-height instead of rigid height, min-width: 0) ===== */
  .grid-2 {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
  }
  .big-opt {
    appearance: none;
    min-height: 54px;
    padding: 10px 14px;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    color: var(--ink);
    font-size: var(--font-body);
    font-weight: 500;
    line-height: 1.28;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out), transform var(--dur-press) var(--ease-out);
  }
  .big-opt > span:first-child {
    min-width: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .big-opt:active { transform: scale(0.975); background: var(--soft); }
  .big-opt.selected {
    border: 1.5px solid var(--brand);
    background: var(--brand-soft);
    color: var(--brand-dark);
    font-weight: 600;
  }
  .big-opt.full {
    grid-column: 1 / -1;
    min-height: 50px;
  }

  /* WeUI Radio Indicator */
  .weui-radio {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--line-strong);
    background: var(--card);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background-color var(--dur-fade) var(--ease-out), border-color var(--dur-fade) var(--ease-out);
  }
  .weui-radio svg {
    opacity: 0;
    transform: scale(0.92);
    transition: opacity var(--dur-fade) var(--ease-out), transform 140ms var(--ease-out);
  }
  .selected .weui-radio {
    border-color: var(--brand);
    background: var(--brand);
    color: #FFFFFF;
  }
  .selected .weui-radio svg {
    opacity: 1;
    transform: scale(1);
  }

  /* Stacked Option Cards */
  .stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .pace-card {
    appearance: none;
    width: 100%;
    min-height: 66px;
    padding: 12px 16px;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out), transform var(--dur-press) var(--ease-out);
  }
  .pace-card:active { transform: scale(0.98); }
  .pace-card.selected {
    border: 1.5px solid var(--brand);
    background: var(--brand-soft);
  }
  .pace-left {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }
  .pace-num {
    font-size: var(--font-body);
    font-weight: 600;
    color: var(--ink);
  }
  .pace-card.selected .pace-num { color: var(--brand-dark); }
  .pace-tag {
    font-size: var(--font-desc);
    font-weight: 400;
    color: var(--ink-mid);
  }
  .pace-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .pace-balls { display: flex; align-items: center; gap: 4px; }

  /* Quiz Scene + Options */
  .quiz-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: var(--font-cap);
    color: var(--ink-sub);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .quiz-dots {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 1;
    max-width: 180px;
  }
  .q-dot {
    flex: 1;
    height: 4px;
    border-radius: 999px;
    background: rgba(17, 24, 39, 0.10);
    transition: background-color 150ms var(--ease-out);
  }
  .q-dot.cur { background: var(--brand); }
  .q-dot.ok { background: var(--ok); }
  .q-dot.bad { background: var(--bad); }

  .quiz-art {
    width: 100%;
    height: 96px;
    border-radius: var(--radius-card);
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .row-opt {
    appearance: none;
    width: 100%;
    min-height: 50px;
    padding: 10px 14px;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    color: var(--ink);
    font-size: var(--font-body);
    font-weight: 400;
    line-height: 1.36;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out), transform var(--dur-press) var(--ease-out);
  }
  .row-opt:active:not(:disabled) { transform: scale(0.982); }
  .row-opt.is-ok {
    border: 1.5px solid var(--ok);
    background: var(--ok-soft);
    color: var(--ok);
    font-weight: 500;
  }
  .row-opt.is-bad {
    border: 1.5px solid var(--bad);
    background: var(--bad-soft);
    color: var(--bad);
    font-weight: 500;
  }
  .row-opt:disabled { cursor: default; }

  .opt-key {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--soft);
    color: var(--ink-mid);
    font-size: var(--font-cap);
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .row-opt.is-ok .opt-key { background: var(--ok); color: #FFF; }
  .row-opt.is-bad .opt-key { background: var(--bad); color: #FFF; }

  /* Notice Banner */
  .tip-banner {
    margin-top: 10px;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: var(--font-desc);
    font-weight: 400;
    line-height: 1.44;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    animation: decoFade var(--dur-fade) var(--ease-out) both;
  }
  .tip-banner svg { flex-shrink: 0; margin-top: 2px; }
  .tip-banner span { min-width: 0; overflow-wrap: anywhere; }
  .tip-ok { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok-line); }
  .tip-warn { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line); }
  .tip-bad { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-line); }

  /* Photo Comparison + Concentric Viewfinder Button (outer 18px = inner 8px + padding 10px!) */
  .guide-pair {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .guide-box {
    flex: 1;
    min-width: 0;
    border-radius: var(--radius-card);
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    position: relative;
  }
  .guide-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    height: 20px;
    padding: 0 7px 0 6px;
    border-radius: 999px;
    font-size: var(--font-cap);
    font-weight: 500;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    color: #FFFFFF;
  }
  .guide-box.good .guide-badge { background: var(--ok); }
  .guide-box.bad .guide-badge { background: var(--bad); }
  .guide-svg {
    display: block;
    width: 100%;
    height: 108px;
  }
  .guide-lbl {
    padding: 7px 6px;
    font-size: var(--font-desc);
    font-weight: 500;
    text-align: center;
    border-top: 1px solid var(--line);
  }
  .guide-box.good .guide-lbl { color: var(--ok); background: var(--ok-soft); }
  .guide-box.bad .guide-lbl { color: var(--bad); background: var(--bad-soft); }

  /* Semantic <button> Upload Surface with Concentric 18px/8px Radius */
  .upload-area {
    appearance: none;
    width: 100%;
    flex: 1;
    min-height: 136px;
    max-height: 172px;
    border-radius: var(--radius-outer); /* 18px */
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    padding: 10px; /* 18px - 10px = 8px inner radius */
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform var(--dur-press) var(--ease-out);
  }
  .upload-area:active { transform: scale(0.985); }
  .upload-inner {
    width: 100%;
    height: 100%;
    border-radius: var(--radius-inner); /* 8px concentric */
    border: 1.5px dashed var(--stitch);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 8px;
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out);
  }
  .upload-area.done .upload-inner {
    border-style: solid;
    border-color: var(--ok-line);
    background: var(--ok-soft);
  }
  .upload-title {
    font-size: var(--font-body);
    font-weight: 500;
    color: var(--brand);
  }
  .upload-sub {
    font-size: var(--font-desc);
    color: var(--ink-sub);
  }
  .upload-area.done .upload-title { color: var(--ok); }
  .upload-area.done .upload-sub { color: var(--ok); opacity: 0.82; }

  /* Grouped Cell List */
  .cell-group {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    overflow: hidden;
  }
  .cell-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 16px;
    position: relative;
  }
  .cell-row + .cell-row::before {
    content: "";
    position: absolute;
    left: 60px;
    right: 16px;
    top: 0;
    height: 1px;
    background: var(--line);
  }
  .cell-ico {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--brand-soft);
    color: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .cell-body { min-width: 0; flex: 1; }
  .cell-main {
    font-size: var(--font-body);
    font-weight: 500;
    color: var(--ink);
    line-height: 1.35;
  }
  .cell-desc {
    font-size: var(--font-desc);
    color: var(--ink-mid);
    margin-top: 2px;
    line-height: 1.4;
  }

  /* Semantic <button role="checkbox"> Agreement Card */
  .check-card {
    appearance: none;
    width: 100%;
    margin-top: 12px;
    padding: 13px 16px;
    border-radius: var(--radius-card);
    border: 1px solid var(--brand-line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    font-size: var(--font-body);
    font-weight: 500;
    color: var(--ink);
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out), transform var(--dur-press) var(--ease-out);
  }
  .check-card:active { transform: scale(0.982); }
  .check-card.checked {
    border-color: var(--ok);
    background: var(--ok-soft);
    color: var(--ok);
  }
  .check-box {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 1.5px solid var(--input-border);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background-color var(--dur-fade) var(--ease-out), border-color var(--dur-fade) var(--ease-out);
  }
  .check-card.checked .check-box {
    background: var(--ok);
    border-color: var(--ok);
    color: #FFFFFF;
  }

  /* Trial Mushroom Guide + Semantic <button> Stitch Rows */
  .trial-visual {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    padding: 9px 14px;
    margin-bottom: 10px;
  }
  .stitch-list {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .stitch-row {
    appearance: none;
    width: 100%;
    border: none;
    background: transparent;
    padding: 10px 14px;
    min-height: 44px;
    font-size: var(--font-sub);
    font-weight: 400;
    font-family: inherit;
    color: var(--ink);
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    position: relative;
    transition: background-color var(--dur-fade) var(--ease-out);
  }
  .stitch-row:active { background: var(--soft); }
  .stitch-row + .stitch-row::before {
    content: "";
    position: absolute;
    left: 14px;
    right: 14px;
    top: 0;
    height: 1px;
    background: var(--line);
  }
  .stitch-row.active {
    background: var(--brand-soft);
    color: var(--brand-dark);
    font-weight: 600;
  }
  .stitch-row.done { color: var(--ink-mid); }
  .stitch-tag {
    display: inline-block;
    min-width: 54px;
    margin-right: 4px;
    font-size: var(--font-desc);
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .stitch-row.active .stitch-tag { color: var(--brand); font-weight: 600; }

  /* Shipping Address Card (break-ui clamp-2 on extreme warehouse addresses so zero-scroll holds!) */
  .addr-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    padding: 14px 16px;
    font-size: var(--font-sub);
    line-height: 1.55;
    color: var(--ink);
  }
  .addr-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .addr-row + .addr-row { margin-top: 4px; }
  .addr-k {
    color: var(--ink-sub);
    flex-shrink: 0;
    width: 46px;
    font-size: var(--font-desc);
    padding-top: 1px;
  }
  .addr-v {
    min-width: 0;
    flex: 1;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .addr-copy-btn {
    appearance: none;
    width: 100%;
    min-height: 44px;
    margin-top: 12px;
    border: 1px solid var(--brand-line);
    border-radius: 9px;
    background: var(--brand-soft);
    color: var(--brand);
    font-size: var(--font-sub);
    font-weight: 500;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-fade) var(--ease-out);
  }
  .addr-copy-btn:active { transform: scale(0.982); }

  /* Scan Button + Accessible Labeled Input */
  .scan-card {
    appearance: none;
    width: 100%;
    padding: 18px 16px;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    color: var(--ink);
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    margin-bottom: 12px;
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out), transform var(--dur-press) var(--ease-out);
  }
  .scan-card:active { transform: scale(0.985); background: var(--soft); }
  .scan-card.done {
    border-color: var(--ok-line);
    background: var(--ok-soft);
  }
  .scan-code {
    max-width: 100%;
    font-size: var(--font-desc);
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .field-lbl {
    display: block;
    font-size: var(--font-desc);
    font-weight: 500;
    color: var(--ink-mid);
    margin-bottom: 6px;
  }
  .big-input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border-radius: var(--radius-btn);
    border: 1px solid var(--input-border); /* >= 3:1 WCAG 1.4.11 */
    background: var(--card);
    font-size: var(--font-body); /* 17px >= 16px: prevents iOS zoom */
    font-weight: 400;
    color: var(--ink);
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    outline: none;
    transition: border-color var(--dur-fade) var(--ease-out);
  }
  .big-input::placeholder { color: var(--ink-sub); font-size: var(--font-sub); }
  .big-input:focus { border-color: var(--brand); border-width: 1.5px; }

  /* Shipping Mode Cards */
  .mode-card {
    appearance: none;
    width: 100%;
    padding: 14px 16px;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out), transform var(--dur-press) var(--ease-out);
  }
  .mode-card:active { transform: scale(0.982); }
  .mode-card.selected {
    border: 1.5px solid var(--brand);
    background: var(--brand-soft);
  }
  .mode-left { min-width: 0; display: flex; align-items: center; gap: 14px; }
  .mode-art {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    background: var(--soft);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .mode-card.selected .mode-art { background: var(--card); }

  /* Status Center Screen */
  .center-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 9px;
    padding: 0 6px;
  }
  .big-num {
    font-size: var(--font-hero);
    font-weight: 600;
    color: var(--ink);
    line-height: 1.15;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }

  .rev-trio { display: flex; gap: 8px; margin-bottom: 4px; width: 100%; justify-content: center; }
  .rev-face {
    flex: 0 1 88px;
    min-width: 0;
    padding: 10px 6px;
    border-radius: var(--radius-card);
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: var(--font-cap);
    font-weight: 500;
    color: var(--ink-mid);
  }
  .pause-chip {
    appearance: none;
    min-height: 44px;
    padding: 0 14px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink-mid);
    font-size: var(--font-cap);
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }

  /* 12 Starter Yarn Swatches */
  .yarn-4x3 {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-top: 4px;
  }
  .yarn-dot-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: var(--font-cap);
    font-weight: 500;
    color: var(--ink-mid);
  }
  .yarn-dot-card span:last-child {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .yarn-ball {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid rgba(17, 24, 39, 0.12);
    flex-shrink: 0;
  }
  .id-badge {
    font-size: var(--font-cap);
    font-weight: 600;
    color: var(--ok);
    background: var(--ok-soft);
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
    max-width: 148px;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }

  /* ===== ONE GLOBAL FIXED BOTTOM BUTTON (Forgiving Guidance — Never a Dead Silent Brick!) ===== */
  .global-footer {
    flex-shrink: 0;
    padding: 8px 20px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    position: relative;
    z-index: 10;
  }
  .next-btn {
    appearance: none;
    border: 1px solid transparent;
    width: 100%;
    height: 48px;
    border-radius: var(--radius-btn);
    background: var(--brand);
    color: #FFFFFF;
    font-size: var(--font-body);
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 12px var(--btn-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color var(--dur-fade) var(--ease-out), opacity var(--dur-fade) var(--ease-out), transform var(--dur-press) var(--ease-out);
  }
  .next-btn:active { transform: scale(0.975); }
  /* Visually muted when step prerequisite isn't met yet, while keeping >= 6.1:1 AA contrast for older eyes! */
  .next-btn[aria-disabled="true"] {
    background: #E4E8F0;
    color: #424D63;
    border-color: var(--line-strong);
    box-shadow: none;
  }

  .home-bar {
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--bg);
  }
  .home-bar span {
    width: 120px;
    height: 4px;
    border-radius: 999px;
    background: rgba(17, 24, 39, 0.18);
  }

  /* ===== Sonner-Style Origin-Aware Top Toast (positioned cleanly below WeChat nav bar) ===== */
  .toast {
    position: absolute;
    top: 92px;
    left: 50%;
    max-width: calc(100% - 32px);
    transform: translate3d(-50%, -8px, 0) scale(0.96);
    transform-origin: top center;
    background: rgba(21, 25, 34, 0.96);
    backdrop-filter: blur(8px);
    color: #FFFFFF;
    padding: 9px 15px;
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(17, 24, 39, 0.22);
    font-size: var(--font-desc);
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 150ms var(--ease-out), transform 180ms var(--ease-out);
    white-space: nowrap;
  }
  .toast span {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.show {
    opacity: 1;
    transform: translate3d(-50%, 0, 0) scale(1);
    pointer-events: auto;
  }

  /* ===== Vaul-Style Bottom Sheet (Asymmetric 240ms in / 180ms out + Single-Pointer Close Button) ===== */
  .sheet-mask {
    position: absolute;
    inset: 0;
    background: rgba(17, 24, 39, 0.46);
    z-index: 80;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity var(--dur-sheet-out) var(--ease-out), visibility var(--dur-sheet-out) var(--ease-out);
  }
  .sheet-mask.open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity var(--dur-sheet-in) var(--ease-out), visibility var(--dur-sheet-in) var(--ease-out);
  }
  .sheet-box {
    width: 100%;
    background: var(--card);
    border-radius: 18px 18px 0 0;
    padding: 10px 20px 26px;
    transform: translate3d(0, 100%, 0);
    transform-origin: bottom center;

/* ===== Origin-Aware Voice Popover ===== */
function speakText(event, text) {
  if (event) event.stopPropagation();
  if (state.speaking) {
    closeVoicePop();
    return;
  }
  state.speaking = true;
  updateSpeakUi();
  clearTimeout(speakText._timer);

  if (typeof window !== "undefined" && "speechSynthesis" in window) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = 0.9;
      u.onend = () => closeVoicePop();
      u.onerror = () => {
        clearTimeout(speakText._timer);
        speakText._timer = setTimeout(() => closeVoicePop(), 2600);
      };
      window.speechSynthesis.speak(u);
      speakText._timer = setTimeout(() => closeVoicePop(), 6500);
      return;
    } catch (_) {}
  }
  speakText._timer = setTimeout(() => closeVoicePop(), 2600);
}

function closeVoicePop() {
  clearTimeout(speakText._timer);
  if (typeof window !== "undefined" && "speechSynthesis" in window) {
    try { window.speechSynthesis.cancel(); } catch (_) {}
  }
  state.speaking = false;
  updateSpeakUi();
}

function updateSpeakUi() {
  const b = document.getElementById("speakBtn");
  const p = document.getElementById("voicePop");
  if (b) {
    b.classList.toggle("speaking", state.speaking);
    b.setAttribute("aria-expanded", String(state.speaking));
  }
  if (p) p.classList.toggle("open", state.speaking);
}

function handlePhoneOutsideClick(e) {
  if (!state.speaking) return;
  const wrap = document.querySelector(".speak-wrap");
  if (wrap && !wrap.contains(e.target)) closeVoicePop();
}

/* better-accessibility 2.5.3: aria-label starts with visible text "听一遍" */
function speakBtnHtml(text) {
  const safe = String(text).replace(/'/g, "");
  const preview = safe.length > 28 ? safe.slice(0, 28) + "…" : safe;
  return `<div class="speak-wrap c-deco">
    <button id="speakBtn" type="button" class="speak-btn ${state.speaking ? "speaking" : ""}" aria-label="听一遍本页语音说明" aria-expanded="${state.speaking}" onclick="speakText(event, '${safe}')">${ICO.speaker}<span>听一遍</span></button>
    <div id="voicePop" class="voice-pop ${state.speaking ? "open" : ""}" role="status">
      <span class="voice-bars" aria-hidden="true"><i></i><i></i><i></i></span><span>${preview}</span>
    </div>
  </div>`;
}

function showToast(msg, kind = "ok") {
  const el = document.getElementById("toast");
  const ico = kind === "warn" ? `<span style="color:#FCD34D;display:inline-flex;">${ICO.info}</span>` : `<span style="color:#86EFAC;display:inline-flex;">${ICO.check(14)}</span>`;
  el.innerHTML = `${ico}<span>${msg}</span>`;
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), kind === "warn" ? 2400 : 1800);
}

/* Forgiving Nudge Helper: guides older/low-literacy users when tapping Next early */
function nudgeTarget(selector, msg) {
  showToast(msg, "warn");
  const el = document.querySelector(selector);
  if (!el) return;
  el.classList.remove("nudge-attn");
  void el.offsetWidth;
  el.classList.add("nudge-attn");
  if (typeof el.focus === "function") el.focus({ preventScroll: true });
  setTimeout(() => el.classList.remove("nudge-attn"), 900);
}

function correctCount() {
  let n = 0;
  for (let i = 0; i < QUIZ.length; i++) {
    if (state.quizAns[i] === QUIZ[i].ans) n++;
  }
  return n;
}

function detectCarrier(v) {
  const s = String(v || "").trim().toUpperCase();
  if (s.startsWith("SF")) return "顺丰速运";
  if (s.startsWith("ZTO") || /^7[358]\d{10,}$/.test(s)) return "中通快递";
  if (s.startsWith("YT")) return "圆通速递";
  if (s.startsWith("JT")) return "极兔速递";
  if (/^77\d{11,}$/.test(s)) return "申通快递";
  if (/^[34]\d{12,}$/.test(s)) return "韵达快递";
  return "";
}

function fmtHms(sec) {
  const h = String(Math.floor(sec / 3600)).padStart(2, "0");
  const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${h}:${m}:${s}`;
}

function datePlus30() {
  const d = new Date(Date.now() + 30 * 86400 * 1000);
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}

    return `<svg width="30" height="30" viewBox="0 0 36 36" fill="none" stroke="var(--brand)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="10" width="19" height="14" rx="2.5" fill="var(--brand-soft)"/>
      <path d="M22 14h6.5l3.5 5v5H22V14z"/>
      <circle cx="9.5" cy="26" r="2.8" fill="var(--card)"/>
      <circle cx="27.5" cy="26" r="2.8" fill="var(--card)"/>
    </svg>`;
  }
  return `<svg width="30" height="30" viewBox="0 0 36 36" fill="none" stroke="var(--brand)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M5 14l3.5-7h19L31 14z" fill="var(--brand-soft)"/>
    <path d="M7 14v15h22V14"/>
    <rect x="14.5" y="20" width="7" height="9" rx="1"/>
  </svg>`;
}

function statusBadgeSvg(ok = true) {
  return ok
    ? `<div class="badge-pop" aria-hidden="true"><svg width="54" height="54" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="26" fill="var(--ok-soft)" stroke="var(--ok-line)" stroke-width="1.5"/><circle cx="28" cy="28" r="19" fill="var(--ok)"/><path d="M20 28.5l5.2 5.2L36.5 22.5" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`
    : `<div class="badge-pop" aria-hidden="true"><svg width="54" height="54" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="26" fill="var(--warn-soft)" stroke="var(--warn-line)" stroke-width="1.5"/><circle cx="28" cy="28" r="19" fill="var(--warn)"/><path d="M28 19v10M28 34.5h.02" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/></svg></div>`;
}

function renderStageBar(meta, idx) {
  const bar = document.getElementById("stageBar");
  bar.setAttribute("aria-valuenow", String(idx + 1));
  bar.innerHTML = [0, 1, 2, 3].map((i) => {
    const done = i < meta.macro;
    const width = done ? 100 : i === meta.macro ? Math.round(meta.sub * 100) : 0;
    return `<div class="stage-seg ${done ? "done" : ""}"><div class="stage-seg-fill" style="width:${width}%;"></div></div>`;
  }).join("");
}

function syncUrlParams() {
  try {
    const u = new URL(window.location.href);
    u.searchParams.set("v", state.variant);
    u.searchParams.set("data", state.dataset);
    u.searchParams.set("theme", state.theme);
    u.searchParams.set("s", state.view);
    window.history.replaceState(null, "", u.toString());
  } catch (_) {}
}

function applyDirectionAnim(dir) {
  const scr = document.getElementById("screen");
  scr.classList.remove("dir-fwd", "dir-back");
  if (dir !== "fwd" && dir !== "back") return;
  void scr.offsetWidth;
  scr.classList.add(dir === "back" ? "dir-back" : "dir-fwd");
}

        <span style="font-size:var(--font-body);font-weight:500;color:${hasNo ? "var(--ok)" : "var(--brand)"};">${hasNo ? `已识别 · ${carrier || "快递单号"}` : "点击扫描快递单条码"}</span>
        <span class="scan-code" title="${state.trackingNo}">${hasNo ? state.trackingNo : "对准面单条形码即可，免打字"}</span>
      </button>
      <div class="c-support">
        <label class="field-lbl" for="trackInput">快递单号（无法扫码时可手填）</label>
        <input
          id="trackInput"
          name="trackingNo"
          class="big-input"
          type="text"
          inputmode="text"
          autocapitalize="characters"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="done"
          maxlength="32"
          placeholder="例如 SF1234567890"
          value="${state.trackingNo}"
          oninput="onTrack(this.value)"
        />
        <div id="carHint" style="min-height:20px;margin-top:6px;font-size:var(--font-desc);color:var(--ok);font-weight:500;">
          ${carrier ? `快递公司：${carrier}` : ""}
        </div>
      </div>
    `;
    ready = hasNo;
  } else if (state.view === "ship_mode") {
    screen.innerHTML = `
      <div class="head-row">
        <h1 class="h1 c-lead">后续接单如何发货？</h1>
        ${speakBtnHtml("入驻后每次钩完订单，你希望快递上门取件，还是自己去驿站寄件？")}
      </div>
      <p class="lead c-deco">用于核定运费补贴方式，后续可在设置中修改</p>
      <div class="stack c-lead" style="gap:12px;" role="radiogroup" aria-label="选择后续发货方式">
        <button type="button" role="radio" aria-checked="${state.shippingMode === "auto_pickup"}" class="mode-card ${state.shippingMode === "auto_pickup" ? "selected" : ""}" onclick="pickMode('auto_pickup')">
          <span class="mode-left">
            <span class="mode-art">${modeArtSvg("auto_pickup")}</span>
            <span style="min-width:0;">
              <span style="display:block;font-size:var(--font-body);font-weight:500;">预约快递上门取件</span>
              <span style="display:block;font-size:var(--font-desc);color:var(--ink-mid);margin-top:2px;">自动下单，快递员上门揽收</span>
            </span>
          </span>
          ${radioHtml()}
        </button>
        <button type="button" role="radio" aria-checked="${state.shippingMode === "self_dropoff"}" class="mode-card ${state.shippingMode === "self_dropoff" ? "selected" : ""}" onclick="pickMode('self_dropoff')">
          <span class="mode-left">
            <span class="mode-art">${modeArtSvg("self_dropoff")}</span>
            <span style="min-width:0;">
              <span style="display:block;font-size:var(--font-body);font-weight:500;">自行前往村镇驿站寄件</span>
              <span style="display:block;font-size:var(--font-desc);color:var(--ink-mid);margin-top:2px;">适合村镇网点固定自寄</span>
            </span>
          </span>
          ${radioHtml()}
        </button>
      </div>
    `;
  } else if (state.view === "deposit") {
    screen.innerHTML = `
      <div class="center-block">
        ${statusBadgeSvg(true)}
        <h1 class="h1 c-lead" style="margin-top:4px;">实物验收通过，最后一步</h1>
        <div class="big-num c-lead">¥200.00</div>
        <p class="lead keep-lead c-deco" style="margin:0 0 6px;">缴纳毛线周转保证金后立即配发 12 色起步毛线</p>
        <div class="cell-group c-support" style="width:100%;text-align:left;">
          <div class="cell-row" style="padding:12px 14px;">
            <span class="cell-ico">${ICO.yarn}</span>
            <div class="cell-body"><div class="cell-main" style="font-size:var(--font-sub);">付款后即刻寄出 12 色免费毛线包</div></div>
          </div>
          <div class="cell-row" style="padding:12px 14px;">
            <span class="cell-ico">${ICO.refund}</span>
            <div class="cell-body"><div class="cell-main" style="font-size:var(--font-sub);">结清在途订单可随时原路全额退回</div></div>
          </div>
        </div>
      </div>
    `;
  } else if (state.view === "approved") {
    screen.innerHTML = `
      <div class="head-row">
        <h1 class="h1 c-lead">认证通过，欢迎加入</h1>
        <span class="id-badge badge-pop" title="${d.weaverNo}">${d.weaverNo}</span>
      </div>
      <p class="lead c-deco" style="margin-bottom:12px;">12 色起步毛线包已生成发货单，点击下一步进入接单台</p>
      <div class="yarn-4x3 c-support">
        ${YARNS_12.map((y) => `
          <div class="yarn-dot-card">
            <span class="yarn-ball" style="background:${y.c};" aria-hidden="true"></span>
            <span>${y.n}</span>
          </div>
        `).join("")}
      </div>
    `;
  } else if (state.view === "rejected") {
    const reasons = {
      quiz: "2 次规则问答均未满 7 题，请熟悉后再来报名",
      sample: "2 次实物小样未达标，建议练习针脚与充棉后再试"
    };
    screen.innerHTML = `
      <div class="center-block">
        ${statusBadgeSvg(false)}
        <h1 class="h1 c-lead" style="margin-top:4px;">暂未通过，30 天后可重报</h1>
        <p class="lead keep-lead c-support" style="margin:0;">${reasons[state.rejectReason] || reasons.quiz}</p>
        <div class="tip-banner tip-ok c-deco" style="width:100%;justify-content:center;"><span>可重新申请日期：${datePlus30()}</span></div>
      </div>
    `;
  }

  /* Forgiving aria-disabled instead of dead native disabled */
  nextBtn.setAttribute("aria-disabled", String(!ready));
  applyDirectionAnim(animDir);
  syncUrlParams();
  renderReviewer();
}

function setVariant(id) {
  const v = VARIANTS.find((x) => x.id === id) || VARIANTS[0];
  state.variant = v.id;
  document.documentElement.setAttribute("data-variant", v.id);
  render("none");
}

function setDataset(id) {
  state.dataset = id === "worst" ? "worst" : "demo";
  document.documentElement.setAttribute("data-dataset", state.dataset);
  if (state.dataset === "worst" && state.view === "ship_no" && !state.trackingNo) {
    state.trackingNo = FIXTURES.worst.scanSample;
  }
  render("none");
}

function setTheme(id) {
  const t = THEMES.find((x) => x.id === id) || THEMES[0];
  state.theme = t.id;
  document.documentElement.setAttribute("data-theme", t.id);
  render("none");
}

function renderReviewer() {
  document.getElementById("variantList").innerHTML = VARIANTS.map((v) => `
    <button type="button" class="seg-btn ${state.variant === v.id ? "active" : ""}" onclick="setVariant('${v.id}')">${v.name}</button>
  `).join("");

  document.getElementById("datasetList").innerHTML = DATASETS.map((d) => `
    <button type="button" class="seg-btn ${state.dataset === d.id ? (d.id === "worst" ? "warn-active" : "active") : ""}" onclick="setDataset('${d.id}')">${d.name}</button>
  `).join("");

  document.getElementById("revList").innerHTML = SCREENS.map((s) => `
    <button type="button" class="rev-btn ${state.view === s.id ? "active" : ""}" onclick="jump('${s.id}', 'none')">
      <span>${s.label}</span>
      <span style="opacity:0.68;">${s.stage}</span>
    </button>
  `).join("");

  document.getElementById("specJson").textContent = JSON.stringify({
    version: "v3-draft",
    variant: state.variant,
    dataset: state.dataset,
    theme: state.theme,
    view: state.view,
    stage: state.funnelStage,
    locationSource: state.locationSource,
    weaverAddr: state.weaverAddr || null,
    dailyCapacityMin: state.paceCap === 2 ? 120 : state.paceCap === 3 ? 180 : 240,
    quizAttempts: state.quizAttempts,
    ackDepositNotice: state.ackChecked,
    trackingNo: state.trackingNo || null,
    shippingMode: state.shippingMode,
    depositStatus: state.depositPaid ? "paid" : "unpaid"
  }, null, 2);
}

/* ===== Forgiving Single Global Next Button ===== */
function onNext() {
  const v = state.view;

  /* Actionable inline nudge when prerequisite isn't completed yet! */
  if (v === "addr_fallback" && state.weaverAddr.trim().length < 2) {
    return nudgeTarget("#importWxAddrBtn", "请先一键填入或手写你的收线地址");
  }
  if (v === "quiz" && state.quizAns[state.quizIdx] === undefined) {
    return nudgeTarget("#quizStack button", "请先点上方选一个答案");
  }
  if ((v === "p1" && !state.pPhotos[0]) || (v === "p2" && !state.pPhotos[1]) || (v === "p3" && !state.pPhotos[2]) ||
      (v === "t1" && !state.tPhotos[0]) || (v === "t2" && !state.tPhotos[1]) || (v === "t3" && !state.tPhotos[2])) {
    return nudgeTarget("#photoUploadBtn", "请先点上方虚线框添加照片");
  }
  if (v === "ack" && !state.ackChecked) {
    return nudgeTarget("#ackCheckBtn", "请先点上方方框打勾确认");
  }
  if (v === "ship_no" && state.trackingNo.trim().length < 6) {
    return nudgeTarget("#scanTrackBtn", "请先扫条形码或输入快递单号");
  }

  if (v === "welcome") {
    if (state.locFailed) {
      return jump("addr_fallback", "fwd");
    }
    state.locationSource = "auto_gps";
    state.weaverAddr = curData().autoLocation;
    jump("pace", "fwd");
    showToast("已自动识别常住地，免手填地址");
    return;
  }
  if (v === "addr_fallback") {
    return jump("pace", "fwd");
  }
  if (v === "pace") return jump("quiz", "fwd");
  if (v === "quiz") {
    if (state.quizIdx < QUIZ.length - 1) {
      state.quizIdx++;
      return render("fwd");
    }
    state.quizAttempts++;
    if (correctCount() < 7 && state.quizAttempts >= 2) {
      state.rejectReason = "quiz";
      state.funnelStage = "rejected";
      return jump("rejected", "fwd");
    }
    return jump("quiz_res", "fwd");
  }
  if (v === "quiz_res") {
    if (correctCount() >= 7) return jump("p1", "fwd");
    state.quizAns = {};
    state.quizIdx = 0;
    return jump("quiz", "fwd");
  }
  if (v === "p1") return jump("p2", "fwd");
  if (v === "p2") return jump("p3", "fwd");
  if (v === "p3") {
    state.portfolioAttempts++;
    return jump("waiting", "fwd");
  }
  if (v === "waiting") return jump("ack", "fwd");
  if (v === "ack") {
    state.funnelStage = "trial_make";
    return jump("trial_guide", "fwd");
  }
  if (v === "trial_guide") return jump("t1", "fwd");
  if (v === "t1") return jump("t2", "fwd");
  if (v === "t2") return jump("t3", "fwd");
  if (v === "t3") {
    state.trialAttempts++;
    state.funnelStage = "sample_inspect";
    return jump("ship_addr", "fwd");
  }
  if (v === "ship_addr") return jump("ship_no", "fwd");
  if (v === "ship_no") return jump("ship_mode", "fwd");
  if (v === "ship_mode") {
    state.sampleAttempts++;
    state.funnelStage = "pending_deposit";
    return jump("deposit", "fwd");
  }
  if (v === "deposit") {
    openPaySheet();
    return;
  }
  if (v === "approved") {
    showToast("已进入接单工作台 · " + curData().weaverNo);
    return;
  }
  if (v === "rejected") {
    state.reminded = true;
    showToast("已开启到期微信提醒");
    return;
  }
}

function goBack() {
  if (state.view === "pace") {
    return jump(state.locFailed ? "addr_fallback" : "welcome", "back");
  }
  const prev = {
    addr_fallback: "welcome", quiz: "pace",
    p1: "quiz_res", p2: "p1", p3: "p2", ship_no: "ship_addr", ship_mode: "ship_no"
  }[state.view];
  if (prev) jump(prev, "back");
}

function jump(id, animDir = "none") {
  closeVoicePop();
  clearTimeout(showToast._t);
  const toastEl = document.getElementById("toast");
  if (toastEl) toastEl.classList.remove("show");
  state.view = id;
  const meta = SCREENS.find((s) => s.id === id);
  if (meta) state.funnelStage = meta.stage;
  render(animDir);
}

function importWxAddr() {
  state.locationSource = "wx_address";
  state.weaverAddr = curData().wxImportAddr;
  showToast("已填入微信收货地址");
  render("none");
}
function onWeaverAddr(v) {
  state.locationSource = "manual_input";
  state.weaverAddr = v;
  document.getElementById("nextBtn").setAttribute("aria-disabled", String(v.trim().length < 2));
  renderReviewer();
}
function pickPace(n) { state.paceCap = n; render("none"); }
function pickQuiz(i) { state.quizAns[state.quizIdx] = i; render("none"); }
function tapP(i) { state.pPhotos[i] = true; showToast("照片已添加"); render("none"); }
function tapT(i) { state.tPhotos[i] = true; showToast("小样照片已添加"); render("none"); }
function toggleAck() { state.ackChecked = !state.ackChecked; render("none"); }
function pickStitch(i) { state.stitchIdx = i; render("none"); }
function pickMode(m) { state.shippingMode = m; render("none"); }
function toggleTimerPause() { state.slaPaused = !state.slaPaused; render("none"); }
function scanTrack() {
  state.trackingNo = curData().scanSample;
  showToast("已识别快递单号");
  render("none");
}
function copyAddr() {
  const d = curData();
  if (navigator.clipboard) navigator.clipboard.writeText(`${d.recipient} ${d.phone} ${d.address}`).catch(() => {});
  showToast("收件地址已复制");
}
function onTrack(v) {
  state.trackingNo = v;
  const c = detectCarrier(v);
  const el = document.getElementById("carHint");
  if (el) el.textContent = c ? `快递公司：${c}` : "";
  document.getElementById("nextBtn").setAttribute("aria-disabled", String(v.trim().length < 6));
  renderReviewer();
}

/* ===== Vaul Sheet with Inert Background + Focus Restoration + Multi-Touch Guard ===== */
let sheetReturnFocus = null;
function setAppBackgroundInert(inert) {
  for (const id of ["appHeader", "stageBar", "screen", "appFooter"]) {
    const el = document.getElementById(id);
    if (el) el.inert = inert;
  }
}

function openPaySheet() {
  closeVoicePop();
  sheetReturnFocus = document.activeElement;
  const mask = document.getElementById("paySheet");
  const box = document.getElementById("paySheetBox");
  box.style.transition = "";
  box.style.transform = "";
  mask.style.background = "";
  setAppBackgroundInert(true);
  mask.classList.add("open");
  setTimeout(() => document.getElementById("sheetConfirmBtn")?.focus({ preventScroll: true }), 40);
}

function closePaySheet() {
  const mask = document.getElementById("paySheet");
  const box = document.getElementById("paySheetBox");
  box.style.transition = "";
  box.style.transform = "";
  mask.style.background = "";
  mask.classList.remove("open");
  setAppBackgroundInert(false);
  if (sheetReturnFocus && typeof sheetReturnFocus.focus === "function") {
    sheetReturnFocus.focus({ preventScroll: true });
  }
}

function confirmPaid() {
  closePaySheet();
  state.depositPaid = true;
  state.funnelStage = "approved";
  showToast("保证金已缴清，欢迎入驻");
  jump("approved", "fwd");
}

(() => {
  const box = document.getElementById("paySheetBox");
  const mask = document.getElementById("paySheet");
  let dragging = false;
  let activePointerId = null;
  let startY = 0;
  let lastY = 0;
  let lastT = 0;
  let vy = 0;

  box.addEventListener("pointerdown", (e) => {
    /* gestures Hard Rule: multi-touch protection + data-vaul-no-drag guard */
    if (dragging) return;
    if (e.target.closest("[data-vaul-no-drag]")) return;
    dragging = true;
    activePointerId = e.pointerId;
    startY = lastY = e.clientY;
    lastT = performance.now();
    vy = 0;
    box.style.transition = "none";
    box.setPointerCapture(e.pointerId);
  });

  box.addEventListener("pointermove", (e) => {
    if (!dragging || e.pointerId !== activePointerId) return;
    const now = performance.now();
    const dt = Math.max(1, now - lastT);
    const dy = e.clientY - startY;
    vy = (e.clientY - lastY) / dt;
    lastY = e.clientY;
    lastT = now;

    if (dy >= 0) {
      box.style.transform = `translate3d(0, ${dy}px, 0)`;
      const fade = Math.max(0.08, 0.46 * (1 - dy / 260));
      mask.style.background = `rgba(17, 24, 39, ${fade.toFixed(3)})`;
    } else {
      const damped = -Math.pow(Math.abs(dy), 0.7) * 1.8;
      box.style.transform = `translate3d(0, ${damped.toFixed(1)}px, 0)`;
    }
  });

  const endDrag = (e) => {
    if (!dragging || e.pointerId !== activePointerId) return;
    dragging = false;
    activePointerId = null;
    const dy = lastY - startY;
    /* emil-design-eng momentum threshold: velocity > 0.25 px/ms OR distance > 72px */
    if (dy > 72 || (dy > 14 && vy > 0.25)) {
      closePaySheet();
    } else {
      box.style.transition = `transform 200ms var(--ease-drawer)`;
      box.style.transform = "translate3d(0, 0, 0)";
      mask.style.background = "";
    }
  };
  box.addEventListener("pointerup", endDrag);
  box.addEventListener("pointercancel", endDrag);
})();

/* Keyboard Shortcuts: Instant 0ms Navigation (Emil Rule) */
window.addEventListener("keydown", (e) => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "Escape") {
    if (state.speaking) { closeVoicePop(); return; }
    if (document.getElementById("paySheet").classList.contains("open")) { closePaySheet(); return; }
  }
  if (document.getElementById("paySheet").classList.contains("open")) return;
  const idx = SCREENS.findIndex((s) => s.id === state.view);
  if (e.key === "ArrowRight" && idx >= 0 && idx < SCREENS.length - 1) {
    e.preventDefault();
    jump(SCREENS[idx + 1].id, "none");
  } else if (e.key === "ArrowLeft" && idx > 0) {
    e.preventDefault();
    jump(SCREENS[idx - 1].id, "none");
  }
});

function simLocFail() {
  state.locFailed = true;
  state.locationSource = "manual_input";
  state.weaverAddr = "";
  jump("addr_fallback", "none");
}
function simLocAuto() {
  state.locFailed = false;
  state.locationSource = "auto_gps";
  state.weaverAddr = curData().autoLocation;
  jump("welcome", "none");
  showToast("已切回默认：点下一步将自动识别位置");
}
function simQuizPass() {
  QUIZ.forEach((q, i) => { state.quizAns[i] = q.ans; });
  state.quizIdx = 7;
  state.quizAttempts = Math.max(1, state.quizAttempts);
  jump("quiz_res", "none");
}
function simQuizFailOnce() {
  QUIZ.forEach((q, i) => { state.quizAns[i] = i < 6 ? q.ans : (q.ans + 1) % 3; });
  state.quizIdx = 7;
  state.quizAttempts = 1;
  jump("quiz_res", "none");
}
function resetAll() {
  Object.assign(state, {
    view: "welcome", funnelStage: "apply_entry",
    locFailed: false, locationSource: "auto_gps", weaverAddr: curData().autoLocation,
    paceCap: 3, quizIdx: 0, quizAns: {}, quizAttempts: 0,
    pPhotos: [false, false, false], portfolioAttempts: 0, slaSec: 7180, slaPaused: false, ackChecked: false,
    stitchIdx: 0, tPhotos: [false, false, false], trialAttempts: 0, shippingMode: "auto_pickup",
    trackingNo: "", sampleAttempts: 0, sampleRetry: false, depositPaid: false, rejectReason: "quiz", reminded: false,
    speaking: false
  });
  render("none");
}

setInterval(() => {
  if (state.view === "waiting" && state.slaSec > 0 && !state.slaPaused) {
    state.slaSec--;
    const el = document.getElementById("slaClock");
    if (el) el.textContent = fmtHms(state.slaSec);
  }
}, 1000);

/* Hydrate URL Params (?v=, ?data=, ?theme=, ?s=) */
(() => {
  try {
    const sp = new URLSearchParams(window.location.search);
    const v = sp.get("v");
    const d = sp.get("data");
    const th = sp.get("theme");
    const s = sp.get("s");
    if (v && VARIANTS.some((x) => x.id === v)) state.variant = v;
    if (d === "worst") state.dataset = "worst";
    if (th && THEMES.some((x) => x.id === th)) state.theme = th;
    if (s === "region" || s === "city") {
      state.view = "pace";
    } else if (s && SCREENS.some((x) => x.id === s)) {
      state.view = s;
    }
  } catch (_) {}
  document.documentElement.setAttribute("data-variant", state.variant);
  document.documentElement.setAttribute("data-dataset", state.dataset);
  document.documentElement.setAttribute("data-theme", state.theme);
  render("none");
})();
</script>
