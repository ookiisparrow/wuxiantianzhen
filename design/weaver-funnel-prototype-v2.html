<!DOCTYPE html>
<html lang="zh-CN" data-theme="slate_indigo" data-variant="choreo">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>无限天真 · 织女准入小程序 v2（WeUI × Emil Kowalski 交互与动效标准版）</title>
<style>
  /* ===== 1. Color System (Locked Default: 质检靛青灰 slate_indigo, Minimal Variance) ===== */
  :root,
  [data-theme="slate_indigo"] {
    --stage-bg: #E2E5EC;
    --bg: #F5F6F8;
    --card: #FFFFFF;
    --soft: #EEF0F4;
    --line: rgba(21, 25, 34, 0.08);
    --line-strong: #CFD5E2;
    --stitch: #94A0B8;

    --brand: #293B63;
    --brand-dark: #1D2B4A;
    --brand-soft: #F0F3F9;
    --brand-line: rgba(41, 59, 99, 0.22);
    --btn-shadow: rgba(29, 43, 74, 0.12);

    --ok: #177245;
    --ok-soft: #ECF6F0;
    --ok-line: rgba(23, 114, 69, 0.22);

    --warn: #9A5B13;
    --warn-soft: #FDF5E8;
    --warn-line: rgba(154, 91, 19, 0.22);

    --bad: #C93B2B;
    --bad-soft: #FDF0EE;
    --bad-line: rgba(201, 59, 43, 0.22);

    --ink: rgba(17, 24, 39, 0.92);
    --ink-mid: rgba(17, 24, 39, 0.64);
    --ink-sub: rgba(17, 24, 39, 0.44);
  }

  [data-theme="trust_blue"] {
    --stage-bg: #DCE3ED;
    --bg: #F4F6FA;
    --card: #FFFFFF;
    --soft: #EBF0F7;
    --line: rgba(17, 24, 39, 0.08);
    --line-strong: #CDD8E7;
    --stitch: #90A8C7;

    --brand: #1B56B5;
    --brand-dark: #133F87;
    --brand-soft: #EEF4FC;
    --brand-line: rgba(27, 86, 181, 0.22);
    --btn-shadow: rgba(27, 86, 181, 0.14);

    --ok: #177245;
    --ok-soft: #ECF6F0;
    --ok-line: rgba(23, 114, 69, 0.22);
    --warn: #9A5B13;
    --warn-soft: #FDF5E8;
    --warn-line: rgba(154, 91, 19, 0.22);
    --bad: #C93B2B;
    --bad-soft: #FDF0EE;
    --bad-line: rgba(201, 59, 43, 0.22);

    --ink: rgba(17, 24, 39, 0.92);
    --ink-mid: rgba(17, 24, 39, 0.64);
    --ink-sub: rgba(17, 24, 39, 0.44);
  }

  [data-theme="wechat_jade"] {
    --stage-bg: #DDE5E0;
    --bg: #F4F6F5;
    --card: #FFFFFF;
    --soft: #E9EFEC;
    --line: rgba(18, 29, 24, 0.08);
    --line-strong: #CBD8D1;
    --stitch: #8DAE9E;

    --brand: #077A55;
    --brand-dark: #055A3E;
    --brand-soft: #EAF5F0;
    --brand-line: rgba(7, 122, 85, 0.22);
    --btn-shadow: rgba(7, 122, 85, 0.14);

    --ok: #077A55;
    --ok-soft: #EAF5F0;
    --ok-line: rgba(7, 122, 85, 0.22);
    --warn: #9A5B13;
    --warn-soft: #FDF5E8;
    --warn-line: rgba(154, 91, 19, 0.22);
    --bad: #C93B2B;
    --bad-soft: #FDF0EE;
    --bad-line: rgba(201, 59, 43, 0.22);

    --ink: rgba(17, 26, 22, 0.92);
    --ink-mid: rgba(17, 26, 22, 0.64);
    --ink-sub: rgba(17, 26, 22, 0.44);
  }

  [data-theme="crisp_ink"] {
    --stage-bg: #E2E4E6;
    --bg: #F6F7F8;
    --card: #FFFFFF;
    --soft: #ECEEF0;
    --line: rgba(15, 20, 25, 0.09);
    --line-strong: #C9CFD6;
    --stitch: #89949F;

    --brand: #0B6B7C;
    --brand-dark: #074D5A;
    --brand-soft: #EAF5F7;
    --brand-line: rgba(11, 107, 124, 0.22);
    --btn-shadow: rgba(11, 107, 124, 0.14);

    --ok: #177245;
    --ok-soft: #ECF6F0;
    --ok-line: rgba(23, 114, 69, 0.22);
    --warn: #9A5B13;
    --warn-soft: #FDF5E8;
    --warn-line: rgba(154, 91, 19, 0.22);
    --bad: #C93B2B;
    --bad-soft: #FDF0EE;
    --bad-line: rgba(201, 59, 43, 0.22);

    --ink: rgba(15, 20, 25, 0.94);
    --ink-mid: rgba(15, 20, 25, 0.66);
    --ink-sub: rgba(15, 20, 25, 0.45);
  }

  /* ===== 2. Official WeUI v2 Typography + Emil Kowalski Motion Tokens ===== */
  :root {
    --font-hero: 34px;   /* 核心看板大数字 */
    --font-h1: 22px;     /* WeUI 页面大标题 22px / 44rpx */
    --font-body: 17px;   /* WeUI 主正文 / 导航 / 主按钮 / 选项主文案 17px / 34rpx */
    --font-sub: 15px;    /* WeUI 次要正文 15px / 30rpx */
    --font-desc: 14px;   /* WeUI 辅助说明 14px / 28rpx */
    --font-cap: 12px;    /* WeUI 次级标签 / 状态栏 12px / 24rpx */

    --radius-card: 12px; /* 统一卡片圆角，减少随意变化 */
    --radius-btn: 10px;
    --card-shadow: 0 1px 2px rgba(17, 24, 39, 0.03), 0 4px 12px rgba(17, 24, 39, 0.025);

    /* Emil Motion Rules: Custom ease-out ONLY (never ease-in), all UI motion < 300ms */
    --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);
    --ease-vaul: cubic-bezier(0.32, 0.72, 0, 1);
    --dur-fade: 125ms;   /* Emil's 125ms custom ease-out fade recipe */
    --dur-ui: 170ms;     /* Tunable via Motion Inspector, capped <= 280ms */
    --dur-sheet: 240ms;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  /* /mobile-native: Prevent accidental long-press text selection on UI controls */
  .phone {
    -webkit-user-select: none;
    user-select: none;
  }
  input, .selectable {
    -webkit-user-select: text;
    user-select: text;
  }

  /* /mobile-native: Eliminate 300ms tap delay & double-tap zoom on interactive elements */
  button, input, [role="button"], .tappable {
    touch-action: manipulation;
  }

  ::selection {
    background: var(--brand-soft);
    color: var(--brand-dark);
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--stage-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ===== Desktop Stage ===== */
  .stage {
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 16px 24px;
  }

  /* ===== 375pt WeChat Viewport ===== */
  .phone {
    width: 375px;
    height: min(760px, calc(100vh - 32px));
    min-height: 620px;
    background: var(--bg);
    border-radius: 42px;
    box-shadow:
      0 0 0 8px #1E222B,
      0 0 0 9.5px rgba(255, 255, 255, 0.18),
      0 24px 56px rgba(17, 24, 39, 0.20);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  /* WeChat Top Chrome */
  .wx-top {
    flex-shrink: 0;
    background: var(--bg);
    position: relative;
    z-index: 20;
  }
  .wx-status {
    height: 42px;
    padding: 12px 24px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: var(--font-cap);
    font-weight: 600;
    letter-spacing: 0.2px;
    color: var(--ink);
  }
  .wx-notch {
    width: 104px;
    height: 24px;
    background: #14171F;
    border-radius: 999px;
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
  }
  .wx-nav {
    height: 44px;
    padding: 0 12px 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .wx-back {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: var(--font-sub);
    font-weight: 400;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 6px 4px 6px 0;
    cursor: pointer;
    font-family: inherit;
    min-width: 84px;
    transition: opacity var(--dur-fade) var(--ease-out), transform 100ms var(--ease-out);
  }
  .wx-back:active { opacity: 0.55; transform: translateX(-1px); }
  .wx-back.hidden { visibility: hidden; pointer-events: none; }
  .wx-title {
    font-size: var(--font-body);
    font-weight: 500;
    color: var(--ink);
    text-align: center;
  }
  .wx-capsule {
    width: 84px;
    height: 30px;
    border-radius: 999px;
    border: 0.5px solid rgba(17, 24, 39, 0.12);
    background: rgba(255, 255, 255, 0.68);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: space-evenly;
  }
  .wx-cap-div {
    width: 0.5px;
    height: 16px;
    background: rgba(17, 24, 39, 0.14);
  }

  /* Hairline 4-Stage Progress Bar */
  .stage-bar {
    flex-shrink: 0;
    padding: 4px 20px 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .stage-seg {
    flex: 1;
    height: 3px;
    border-radius: 999px;
    background: rgba(17, 24, 39, 0.08);
    overflow: hidden;
  }
  .stage-seg-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--brand);
    transition: width 220ms var(--ease-out), background-color 180ms var(--ease-out);
  }
  .stage-seg.done .stage-seg-fill {
    background: var(--ok);
    width: 100%;
  }

  /* ===== Importance-Based Choreography (/choreograph) =====
     Only triggered on user flow step transitions (.flow-enter), NEVER on keyboard jump or in-page click!
     Ordered by semantic importance (1: Primary task/heading, 2: Visual guide, 3: Auxiliary lead & top-right audio chip).
  */
  @keyframes choreoIn {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes snappyFade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  /* Never animate from scale(0): badges & feedback settle from scale(0.94) */
  @keyframes badgeSettle {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }

  [data-variant="choreo"] .screen.flow-enter .c-p1 {
    animation: choreoIn var(--dur-ui) var(--ease-out) both;
  }
  [data-variant="choreo"] .screen.flow-enter .c-p2 {
    animation: choreoIn var(--dur-ui) var(--ease-out) 35ms both;
  }
  [data-variant="choreo"] .screen.flow-enter .c-p3 {
    animation: choreoIn var(--dur-fade) var(--ease-out) 65ms both;
  }

  [data-variant="snappy"] .screen.flow-enter {
    animation: snappyFade var(--dur-fade) var(--ease-out) both;
  }
  /* data-variant="still": 0ms — "Sometimes the best animation is no animation" */

  .badge-pop {
    animation: badgeSettle 180ms var(--ease-out) both;
  }

  /* ===== Main Viewport: STRICT NO VERTICAL SCROLL ===== */
  .screen {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    padding: 12px 20px 8px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    position: relative;
  }

  /* Page Header Row */
  .head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
    position: relative;
  }
  .h1 {
    margin: 0;
    font-size: var(--font-h1);
    font-weight: 600;
    line-height: 1.36;
    letter-spacing: -0.2px;
    color: var(--ink);
    text-wrap: balance;
  }
  .lead {
    margin: 0 0 16px;
    font-size: var(--font-desc);
    font-weight: 400;
    line-height: 1.5;
    color: var(--ink-mid);
    text-wrap: pretty;
  }

  /* Origin-Aware Voice Trigger + Popover (scales from top-right trigger, never center!) */
  .speak-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .speak-btn {
    appearance: none;
    position: relative;
    height: 30px;
    padding: 0 10px 0 9px;
    border-radius: 999px;
    border: 1px solid var(--brand-line);
    background: var(--card);
    color: var(--brand);
    font-size: var(--font-cap);
    font-weight: 500;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(17, 24, 39, 0.03);
    transition: background-color var(--dur-fade) var(--ease-out), color var(--dur-fade) var(--ease-out), transform 100ms var(--ease-out);
  }
  /* Invisible 44px touch hit-target expansion for older thumbs without bloating visual height */
  .speak-btn::after {
    content: "";
    position: absolute;
    inset: -7px -4px;
  }
  .speak-btn:active { transform: scale(0.96); }
  .speak-btn.speaking {
    background: var(--brand);
    border-color: var(--brand);
    color: #FFFFFF;
  }

  /* Origin-aware voice popover anchored to trigger (transform-origin: top right, scale 0.95 -> 1) */
  .voice-pop {
    position: absolute;
    top: 36px;
    right: 0;
    width: 216px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(21, 25, 34, 0.92);
    backdrop-filter: blur(8px);
    color: #FFFFFF;
    font-size: var(--font-cap);
    line-height: 1.45;
    box-shadow: 0 10px 24px rgba(17, 24, 39, 0.18);
    transform-origin: top right;
    opacity: 0;
    transform: scale(0.95) translateY(-3px);
    pointer-events: none;
    transition: opacity var(--dur-fade) var(--ease-out), transform 150ms var(--ease-out);
    z-index: 45;
  }
  .voice-pop.open {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }
  .voice-bars {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    height: 10px;
    margin-right: 5px;
    vertical-align: middle;
  }
  .voice-bars i {
    display: block;
    width: 2px;
    height: 8px;
    border-radius: 1px;
    background: #93C5FD;
    animation: eqBar 520ms var(--ease-out) infinite alternate;
  }
  .voice-bars i:nth-child(2) { animation-delay: 140ms; height: 10px; }
  .voice-bars i:nth-child(3) { animation-delay: 260ms; height: 6px; }
  @keyframes eqBar {
    from { transform: scaleY(0.45); }
    to   { transform: scaleY(1); }
  }

  /* ===== Welcome Screen ===== */
  .hero-art {
    width: 100%;
    height: 184px;
    border-radius: var(--radius-card);
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .pillar-group {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    display: flex;
    margin-top: auto;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .pillar-chip {
    flex: 1;
    padding: 14px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    position: relative;
  }
  .pillar-chip + .pillar-chip::before {
    content: "";
    position: absolute;
    left: 0;
    top: 18px;
    bottom: 18px;
    width: 1px;
    background: var(--line);
  }
  .pillar-ico {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--brand-soft);
    color: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pillar-txt {
    font-size: var(--font-desc);
    font-weight: 500;
    color: var(--ink);
  }

  /* ===== Interactive Option Cards (Tactile Press, Zero Sticky Hover) ===== */
  .grid-2 {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .big-opt {
    appearance: none;
    flex: 1 1 calc(50% - 5px);
    height: 56px;
    padding: 0 16px;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    color: var(--ink);
    font-size: var(--font-body);
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out), transform 100ms var(--ease-out);
  }
  .big-opt:active { transform: scale(0.985); background: var(--soft); }
  .big-opt.selected {
    border: 1.5px solid var(--brand);
    background: var(--brand-soft);
    color: var(--brand-dark);
    font-weight: 600;
  }
  .big-opt.full {
    flex: 1 1 100%;
    height: 52px;
  }

  /* WeUI Radio Indicator (Checkmark settles from scale 0.92, never scale 0!) */
  .weui-radio {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--line-strong);
    background: var(--card);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background-color var(--dur-fade) var(--ease-out), border-color var(--dur-fade) var(--ease-out);
  }
  .weui-radio svg {
    opacity: 0;
    transform: scale(0.92);
    transition: opacity var(--dur-fade) var(--ease-out), transform 140ms var(--ease-out);
  }
  .selected .weui-radio {
    border-color: var(--brand);
    background: var(--brand);
    color: #FFFFFF;
  }
  .selected .weui-radio svg {
    opacity: 1;
    transform: scale(1);
  }

  /* Stacked Option Cards */
  .stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .pace-card {
    appearance: none;
    width: 100%;
    height: 68px;
    padding: 0 16px;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out), transform 100ms var(--ease-out);
  }
  .pace-card:active { transform: scale(0.988); }
  .pace-card.selected {
    border: 1.5px solid var(--brand);
    background: var(--brand-soft);
  }
  .pace-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }
  .pace-num {
    font-size: var(--font-body);
    font-weight: 600;
    color: var(--ink);
  }
  .pace-card.selected .pace-num { color: var(--brand-dark); }
  .pace-tag {
    font-size: var(--font-desc);
    font-weight: 400;
    color: var(--ink-mid);
  }
  .pace-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pace-balls {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Quiz Scene + Options */
  .quiz-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: var(--font-cap);
    color: var(--ink-sub);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .quiz-dots {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 1;
    max-width: 180px;
  }
  .q-dot {
    flex: 1;
    height: 4px;
    border-radius: 999px;
    background: rgba(17, 24, 39, 0.10);
    transition: background-color 150ms var(--ease-out);
  }
  .q-dot.cur { background: var(--brand); }
  .q-dot.ok { background: var(--ok); }
  .q-dot.bad { background: var(--bad); }

  .quiz-art {
    width: 100%;
    height: 100px;
    border-radius: var(--radius-card);
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    overflow: hidden;
  }

  .row-opt {
    appearance: none;
    width: 100%;
    min-height: 50px;
    padding: 11px 14px;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    color: var(--ink);
    font-size: var(--font-body);
    font-weight: 400;
    line-height: 1.38;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out), transform 100ms var(--ease-out);
  }
  .row-opt:active:not(:disabled) { transform: scale(0.988); }
  .row-opt.is-ok {
    border: 1.5px solid var(--ok);
    background: var(--ok-soft);
    color: var(--ok);
    font-weight: 500;
  }
  .row-opt.is-bad {
    border: 1.5px solid var(--bad);
    background: var(--bad-soft);
    color: var(--bad);
    font-weight: 500;
  }
  .row-opt:disabled { cursor: default; }

  .opt-key {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--soft);
    color: var(--ink-mid);
    font-size: var(--font-cap);
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .row-opt.is-ok .opt-key { background: var(--ok); color: #FFF; }
  .row-opt.is-bad .opt-key { background: var(--bad); color: #FFF; }

  /* Notice Banner (125ms ease-out entrance) */
  .tip-banner {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: var(--font-desc);
    font-weight: 400;
    line-height: 1.45;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: snappyFade var(--dur-fade) var(--ease-out) both;
  }
  .tip-ok { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok-line); }
  .tip-warn { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line); }
  .tip-bad { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-line); }

  /* Photo Comparison + Viewfinder Upload */
  .guide-pair {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .guide-box {
    flex: 1;
    border-radius: var(--radius-card);
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    position: relative;
  }
  .guide-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    height: 20px;
    padding: 0 7px;
    border-radius: 999px;
    font-size: var(--font-cap);
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    color: #FFFFFF;
  }
  .guide-box.good .guide-badge { background: var(--ok); }
  .guide-box.bad .guide-badge { background: var(--bad); }
  .guide-svg {
    display: block;
    width: 100%;
    height: 112px;
  }
  .guide-lbl {
    padding: 7px 8px;
    font-size: var(--font-desc);
    font-weight: 500;
    text-align: center;
    border-top: 1px solid var(--line);
  }
  .guide-box.good .guide-lbl { color: var(--ok); background: var(--ok-soft); }
  .guide-box.bad .guide-lbl { color: var(--bad); background: var(--bad-soft); }

  .upload-area {
    width: 100%;
    flex: 1;
    min-height: 140px;
    max-height: 176px;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    padding: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 100ms var(--ease-out);
  }
  .upload-area:active { transform: scale(0.99); }
  .upload-inner {
    width: 100%;
    height: 100%;
    border-radius: 9px;
    border: 1.5px dashed var(--stitch);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out);
  }
  .upload-area.done .upload-inner {
    border-style: solid;
    border-color: var(--ok-line);
    background: var(--ok-soft);
  }
  .upload-title {
    font-size: var(--font-body);
    font-weight: 500;
    color: var(--brand);
  }
  .upload-sub {
    font-size: var(--font-desc);
    color: var(--ink-sub);
  }
  .upload-area.done .upload-title { color: var(--ok); }
  .upload-area.done .upload-sub { color: var(--ok); opacity: 0.82; }

  /* Grouped Cell List */
  .cell-group {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    overflow: hidden;
  }
  .cell-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    position: relative;
  }
  .cell-row + .cell-row::before {
    content: "";
    position: absolute;
    left: 60px;
    right: 16px;
    top: 0;
    height: 1px;
    background: var(--line);
  }
  .cell-ico {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--brand-soft);
    color: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .cell-main {
    font-size: var(--font-body);
    font-weight: 500;
    color: var(--ink);
    line-height: 1.35;
  }
  .cell-desc {
    font-size: var(--font-desc);
    color: var(--ink-mid);
    margin-top: 2px;
  }

  /* Agreement Check Card */
  .check-card {
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: var(--radius-card);
    border: 1px solid var(--brand-line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    font-size: var(--font-body);
    font-weight: 500;
    color: var(--ink);
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out), transform 100ms var(--ease-out);
  }
  .check-card:active { transform: scale(0.988); }
  .check-card.checked {
    border-color: var(--ok);
    background: var(--ok-soft);
    color: var(--ok);
  }
  .check-box {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 1.5px solid var(--stitch);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background-color var(--dur-fade) var(--ease-out), border-color var(--dur-fade) var(--ease-out);
  }
  .check-card.checked .check-box {
    background: var(--ok);
    border-color: var(--ok);
    color: #FFFFFF;
  }

  /* Trial Mushroom Guide */
  .trial-visual {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    padding: 10px 14px;
    margin-bottom: 10px;
  }
  .stitch-list {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    overflow: hidden;
  }
  .stitch-row {
    padding: 11px 14px;
    font-size: var(--font-sub);
    font-weight: 400;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    position: relative;
    transition: background-color var(--dur-fade) var(--ease-out);
  }
  .stitch-row:active { background: var(--soft); }
  .stitch-row + .stitch-row::before {
    content: "";
    position: absolute;
    left: 14px;
    right: 14px;
    top: 0;
    height: 1px;
    background: var(--line);
  }
  .stitch-row.active {
    background: var(--brand-soft);
    color: var(--brand-dark);
    font-weight: 600;
  }
  .stitch-row.done { color: var(--ink-mid); }
  .stitch-tag {
    display: inline-block;
    min-width: 52px;
    margin-right: 4px;
    font-size: var(--font-desc);
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .stitch-row.active .stitch-tag { color: var(--brand); font-weight: 600; }

  /* Shipping Address & Scan Cards */
  .addr-tap {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    padding: 16px;
    font-size: var(--font-sub);
    line-height: 1.65;
    color: var(--ink);
    cursor: pointer;
    transition: transform 100ms var(--ease-out);
  }
  .addr-tap:active { transform: scale(0.99); background: var(--soft); }
  .addr-row { display: flex; gap: 8px; }
  .addr-k {
    color: var(--ink-sub);
    flex-shrink: 0;
    font-size: var(--font-desc);
    padding-top: 1px;
  }
  .addr-copy-pill {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    color: var(--brand);
    font-size: var(--font-sub);
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .scan-card {
    width: 100%;
    padding: 22px 16px;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    margin-bottom: 12px;
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out), transform 100ms var(--ease-out);
  }
  .scan-card:active { transform: scale(0.99); background: var(--soft); }
  .scan-card.done {
    border-color: var(--ok-line);
    background: var(--ok-soft);
  }
  /* /mobile-native: font-size 17px (>= 16px) prevents iOS WebView auto-zoom on focus! */
  .big-input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border-radius: var(--radius-btn);
    border: 1px solid var(--line-strong);
    background: var(--card);
    font-size: var(--font-body);
    font-weight: 400;
    color: var(--ink);
    font-family: inherit;
    outline: none;
    transition: border-color var(--dur-fade) var(--ease-out);
  }
  .big-input::placeholder { color: var(--ink-sub); font-size: var(--font-sub); }
  .big-input:focus { border-color: var(--brand); }

  /* Shipping Mode Cards */
  .mode-card {
    appearance: none;
    width: 100%;
    padding: 14px 16px;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out), transform 100ms var(--ease-out);
  }
  .mode-card:active { transform: scale(0.988); }
  .mode-card.selected {
    border: 1.5px solid var(--brand);
    background: var(--brand-soft);
  }
  .mode-left { display: flex; align-items: center; gap: 14px; }
  .mode-art {
    width: 52px;
    height: 52px;
    border-radius: 10px;
    background: var(--soft);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .mode-card.selected .mode-art { background: var(--card); }

  /* Status Center Screen + Smooth Tabular Numerals */
  .center-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    padding: 0 8px;
  }
  .big-num {
    font-size: var(--font-hero);
    font-weight: 600;
    color: var(--ink);
    line-height: 1.15;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }
  .tick-sec {
    display: inline-block;
    transition: transform 140ms var(--ease-out), opacity 140ms var(--ease-out);
  }

  .rev-trio {
    display: flex;
    gap: 10px;
    margin-bottom: 6px;
  }
  .rev-face {
    width: 76px;
    padding: 10px 6px;
    border-radius: var(--radius-card);
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: var(--font-cap);
    font-weight: 500;
    color: var(--ink-mid);
  }

  /* 12 Starter Yarn Swatches */
  .yarn-4x3 {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }
  .yarn-dot-card {
    flex: 1 1 calc(25% - 6px);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: var(--font-cap);
    font-weight: 500;
    color: var(--ink-mid);
  }
  .yarn-ball {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid rgba(17, 24, 39, 0.12);
  }

  /* ===== ONE GLOBAL FIXED BOTTOM BUTTON ===== */
  .global-footer {
    flex-shrink: 0;
    padding: 8px 20px 12px;
    background: var(--bg);
    position: relative;
    z-index: 10;
  }
  .next-btn {
    appearance: none;
    border: none;
    width: 100%;
    height: 48px;
    border-radius: var(--radius-btn);
    background: var(--brand);
    color: #FFFFFF;
    font-size: var(--font-body);
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 12px var(--btn-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color var(--dur-fade) var(--ease-out), transform 100ms var(--ease-out);
  }
  .next-btn:active:not(:disabled) {
    opacity: 0.88;
    transform: scale(0.986);
  }
  .next-btn:disabled {
    background: var(--line-strong);
    color: rgba(255, 255, 255, 0.88);
    cursor: not-allowed;
    box-shadow: none;
  }

  .home-bar {
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--bg);
  }
  .home-bar span {
    width: 120px;
    height: 4px;
    border-radius: 999px;
    background: rgba(17, 24, 39, 0.18);
  }

  /* ===== Sonner-Style Origin-Aware Top Toast (Swipe-to-Dismiss + Scale 0.96 -> 1) ===== */
  .toast {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translate3d(-50%, -10px, 0) scale(0.96);
    transform-origin: top center;
    background: rgba(21, 25, 34, 0.92);
    backdrop-filter: blur(8px);
    color: #FFFFFF;
    padding: 8px 14px;
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(17, 24, 39, 0.16);
    font-size: var(--font-desc);
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 150ms var(--ease-out), transform 180ms var(--ease-out);
    white-space: nowrap;
    cursor: grab;
  }
  .toast.show {
    opacity: 1;
    transform: translate3d(-50%, 0, 0) scale(1);
    pointer-events: auto;
  }

  /* ===== Vaul-Style Origin-Aware Bottom Sheet (Rubber-Band + Velocity Momentum) ===== */
  .sheet-mask {
    position: absolute;
    inset: 0;
    background: rgba(17, 24, 39, 0.46);
    z-index: 80;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity var(--dur-sheet) var(--ease-out), visibility var(--dur-sheet) var(--ease-out);
  }
  .sheet-mask.open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }
  .sheet-box {
    width: 100%;
    background: var(--card);
    border-radius: 18px 18px 0 0;
    padding: 10px 20px 28px;
    transform: translate3d(0, 100%, 0);
    transform-origin: bottom center;
    transition: transform var(--dur-sheet) var(--ease-vaul);
    will-change: transform;
    touch-action: none;
  }
  .sheet-mask.open .sheet-box {
    transform: translate3d(0, 0, 0);
  }
  .sheet-grabber {
    width: 36px;
    height: 4px;
    border-radius: 999px;
    background: rgba(17, 24, 39, 0.16);
    margin: 0 auto 14px;
  }

  /* ===== External Reviewer & /prototype Motion Studio (Desktop Only) ===== */
  .reviewer {
    width: 324px;
    height: min(760px, calc(100vh - 32px));
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--card-shadow);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    overflow-y: auto;
  }
  .rev-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .rev-title {
    margin: 0;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink);
  }
  .v1-link {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--brand);
    text-decoration: none;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--brand-soft);
  }
  .rev-note {
    margin: 0;
    font-size: 11.5px;
    line-height: 1.48;
    color: var(--ink-mid);
  }
  .panel-card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .panel-lbl {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-mid);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .seg-row {
    display: flex;
    gap: 4px;
  }
  .seg-btn {
    appearance: none;
    flex: 1;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-mid);
    padding: 5px 4px;
    border-radius: 7px;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
  }
  .seg-btn.active {
    border-color: var(--brand);
    background: var(--brand);
    color: #FFFFFF;
    font-weight: 600;
  }
  .tuner-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--ink-mid);
    font-variant-numeric: tabular-nums;
  }
  .tuner-row input[type="range"] {
    flex: 1;
    accent-color: var(--brand);
    cursor: pointer;
  }
  .theme-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
  }
  .theme-chip {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    padding: 5px 8px;
    border-radius: 7px;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .theme-chip.active {
    border-color: var(--brand);
    background: var(--brand-soft);
    color: var(--brand-dark);
    font-weight: 600;
  }
  .swatch-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.14);
    flex-shrink: 0;
  }
  .rev-list {
    display: flex;
    flex-direction: column;
    gap: 2.5px;
  }
  .rev-btn {
    appearance: none;
    border: 1px solid transparent;
    background: var(--bg);
    color: var(--ink-mid);
    padding: 5.5px 9px;
    border-radius: 7px;
    font-size: 11.5px;
    font-weight: 400;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    justify-content: space-between;
  }
  .rev-btn.active {
    background: var(--brand);
    color: #FFFFFF;
    font-weight: 500;
  }
  .rev-sim-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .rev-sim {
    appearance: none;
    border: 1px solid var(--line-strong);
    background: var(--card);
    color: var(--ink-mid);
    padding: 4.5px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .rev-json {
    margin: 0;
    padding: 9px;
    border-radius: 9px;
    background: #161922;
    color: #E2E8F0;
    font-size: 10.5px;
    line-height: 1.48;
    overflow-x: auto;
    white-space: pre-wrap;
  }

  /* /mobile-native: Hover effects ONLY on devices with true pointer hover! */
  @media (hover: hover) and (pointer: fine) {
    .big-opt:not(.selected):hover,
    .pace-card:not(.selected):hover,
    .row-opt:not(:disabled):not(.is-ok):not(.is-bad):hover,
    .mode-card:not(.selected):hover {
      border-color: var(--line-strong);
    }
    .rev-sim:hover { border-color: var(--brand); color: var(--brand); }
    .v1-link:hover { opacity: 0.85; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (max-width: 780px) {
    .stage { flex-direction: column; align-items: center; padding: 10px; height: auto; min-height: 100vh; overflow-y: auto; }
    .reviewer { width: 375px; max-width: 100%; height: auto; max-height: none; }

/* ===== Origin-Aware Voice Read-Aloud Popover (Anchored to Trigger) ===== */
function speakText(event, text) {
  if (event) event.stopPropagation();
  if (state.speaking) {
    closeVoicePop();
    return;
  }
  state.speaking = true;
  state.spokenPreview = text;
  updateSpeakUi();
  clearTimeout(speakText._timer);

  if (typeof window !== "undefined" && "speechSynthesis" in window) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = 0.9;
      u.onend = () => closeVoicePop();
      u.onerror = () => {
        clearTimeout(speakText._timer);
        speakText._timer = setTimeout(() => closeVoicePop(), 2600);
      };
      window.speechSynthesis.speak(u);
      speakText._timer = setTimeout(() => closeVoicePop(), 6500);
      return;
    } catch (_) {}
  }
  speakText._timer = setTimeout(() => closeVoicePop(), 2600);
}

function closeVoicePop() {
  clearTimeout(speakText._timer);
  if (typeof window !== "undefined" && "speechSynthesis" in window) {
    try { window.speechSynthesis.cancel(); } catch (_) {}
  }
  state.speaking = false;
  updateSpeakUi();
}

function updateSpeakUi() {
  const b = document.getElementById("speakBtn");

}

function detectCarrier(v) {
  const s = String(v || "").trim().toUpperCase();
  if (s.startsWith("SF")) return "顺丰速运";
  if (s.startsWith("ZTO") || /^7[358]\d{10,}$/.test(s)) return "中通快递";
  if (s.startsWith("YT")) return "圆通速递";
  if (s.startsWith("JT")) return "极兔速递";
  if (/^77\d{11,}$/.test(s)) return "申通快递";
  if (/^[34]\d{12,}$/.test(s)) return "韵达快递";
  return "";
}

  return `${h}:${m}:<span id="slaSec" class="tick-sec">${s}</span>`;
}

    u.searchParams.set("theme", state.theme);

}

function setVariant(id) {
  const v = VARIANTS.find((x) => x.id === id) || VARIANTS[0];
  state.variant = v.id;
  document.documentElement.setAttribute("data-variant", v.id);
  triggerFlowEnter();
  syncUrlParams();
  renderReviewer();
}

function setDuration(ms) {
  const n = Math.max(100, Math.min(280, Number(ms) || 170));
  state.durMs = n;
  document.documentElement.style.setProperty("--dur-ui", `${n}ms`);
  document.getElementById("durVal").textContent = `${n}ms`;
  syncUrlParams();
  renderReviewer();
}

function replayChoreo() {
  triggerFlowEnter();
}

function setTheme(id) {
  const t = THEMES.find((x) => x.id === id) || THEMES[0];
  state.theme = t.id;
  document.documentElement.setAttribute("data-theme", t.id);
  render("none");
}

function renderReviewer() {
  document.getElementById("variantList").innerHTML = VARIANTS.map((v) => `
    <button type="button" class="seg-btn ${state.variant === v.id ? "active" : ""}" onclick="setVariant('${v.id}')">${v.name}</button>
  `).join("");

  document.getElementById("themeList").innerHTML = THEMES.map((t) => `
    <button type="button" class="theme-chip ${state.theme === t.id ? "active" : ""}" onclick="setTheme('${t.id}')">
      <span>${t.name}</span>
      <span class="swatch-dot" style="background:${t.brand};"></span>
    </button>
  `).join("");

  document.getElementById("revList").innerHTML = SCREENS.map((s) => `
    <button type="button" class="rev-btn ${state.view === s.id ? "active" : ""}" onclick="jump('${s.id}', 'instant')">
      <span>${s.label}</span>
      <span style="opacity:0.68;">${s.stage}</span>
    </button>
  `).join("");

  document.getElementById("specJson").textContent = JSON.stringify({
    version: "v2-emil",
    variant: state.variant,
    durMs: state.durMs,
    theme: state.theme,
    view: state.view,
    stage: state.funnelStage,
    province: state.nonJzh ? "其他省" : state.province,
    city: state.city,
    dailyCapacityMin: state.paceCap === 2 ? 120 : state.paceCap === 3 ? 180 : 240,
    quizAttempts: state.quizAttempts,
    ackDepositNotice: state.ackChecked,
    sampleAttempts: state.sampleAttempts,
    trackingNo: state.trackingNo || null,
    shippingMode: state.shippingMode,
    depositStatus: state.depositPaid ? "paid" : "unpaid"
  }, null, 2);
}

function onNext() {
  const v = state.view;
  if (v === "welcome") return jump("region", "flow");
  if (v === "region") {
    if (state.nonJzh) {
      if (!state.waitlisted) {
        state.waitlisted = true;
        showToast("已登记，开区后微信通知你");
        return render("none");
      }
      state.nonJzh = false;
      state.waitlisted = false;
      return render("none");
    }
    return jump("city", "flow");
  }
  if (v === "city") return jump("pace", "flow");
  if (v === "pace") return jump("quiz", "flow");
  if (v === "quiz") {
    if (state.quizIdx < QUIZ.length - 1) {
      state.quizIdx++;
      return render("flow");
    }
    state.quizAttempts++;
    if (correctCount() < 7 && state.quizAttempts >= 2) {
      state.rejectReason = "quiz";
      state.funnelStage = "rejected";
      return jump("rejected", "flow");
    }
    return jump("quiz_res", "flow");
  }
  if (v === "quiz_res") {
    if (correctCount() >= 7) return jump("p1", "flow");
    state.quizAns = {};
    state.quizIdx = 0;
    return jump("quiz", "flow");
  }
  if (v === "p1") return jump("p2", "flow");
  if (v === "p2") return jump("p3", "flow");
  if (v === "p3") {
    state.portfolioAttempts++;
    return jump("waiting", "flow");
  }
  if (v === "waiting") return jump("ack", "flow");
  if (v === "ack") {
    state.funnelStage = "trial_make";
    return jump("trial_guide", "flow");
  }
  if (v === "trial_guide") return jump("t1", "flow");
  if (v === "t1") return jump("t2", "flow");
  if (v === "t2") return jump("t3", "flow");
  if (v === "t3") {
    state.trialAttempts++;
    state.funnelStage = "sample_inspect";
    return jump("ship_addr", "flow");
  }
  if (v === "ship_addr") return jump("ship_no", "flow");
  if (v === "ship_no") return jump("ship_mode", "flow");
  if (v === "ship_mode") {
    state.sampleAttempts++;
    state.funnelStage = "pending_deposit";
    return jump("deposit", "flow");
  }
  if (v === "deposit") {
    openPaySheet();
    return;
  }
  if (v === "approved") {
    showToast("已进入接单工作台 · WV-JZH-018");
    return;
  }
  if (v === "rejected") {
    state.reminded = true;
    showToast("已开启到期微信提醒");
    return;
  }
}

function goBack() {
  const prev = {
    region: "welcome", city: "region", pace: "city", quiz: "pace",
    p1: "quiz_res", p2: "p1", p3: "p2", ship_no: "ship_addr", ship_mode: "ship_no"
  }[state.view];
  if (prev) jump(prev, "flow");
}

function jump(id, mode = "instant") {
  closeVoicePop();
  clearTimeout(showToast._t);
  const toastEl = document.getElementById("toast");
  if (toastEl) toastEl.classList.remove("show");
  state.view = id;
  const meta = SCREENS.find((s) => s.id === id);
  if (meta) state.funnelStage = meta.stage;
  render(mode);
}

/* In-screen state mutations render with 'none' — zero redundant page entrance motion! */
function pickProv(p) { state.nonJzh = false; state.waitlisted = false; state.province = p; state.city = CITIES_BY_PROV[p][0]; render("none"); }
function pickOtherProv() { state.nonJzh = true; render("none"); }
function pickCity(c) { state.city = c; render("none"); }
function pickPace(n) { state.paceCap = n; render("none"); }
function pickQuiz(i) { state.quizAns[state.quizIdx] = i; render("none"); }
function tapP(i) { state.pPhotos[i] = true; showToast("照片已添加"); render("none"); }
function tapT(i) { state.tPhotos[i] = true; showToast("小样照片已添加"); render("none"); }
function toggleAck() { state.ackChecked = !state.ackChecked; render("none"); }
function pickStitch(i) { state.stitchIdx = i; render("none"); }
function pickMode(m) { state.shippingMode = m; render("none"); }
function scanTrack() {
  state.trackingNo = "SF1234567890";
  showToast("已识别顺丰单号");
  render("none");
}
function copyAddr() {
  if (navigator.clipboard) navigator.clipboard.writeText("无限天真质检组 13805718899 浙江省杭州市滨江区江南大道3号楼204").catch(() => {});
  showToast("收件地址已复制");
}
function onTrack(v) {
  state.trackingNo = v;
  const c = detectCarrier(v);
  const el = document.getElementById("carHint");
  if (el) el.textContent = c ? `快递公司：${c}` : "";
  document.getElementById("nextBtn").disabled = v.trim().length < 6;

/* ===== Vaul-Grade Bottom Sheet Controller + Rubber-Banding & Velocity Gesture ===== */
function openPaySheet() {
  closeVoicePop();
  const mask = document.getElementById("paySheet");
  const box = document.getElementById("paySheetBox");
  box.style.transition = "";
  box.style.transform = "";
  mask.style.background = "";
  mask.classList.add("open");
}

function closePaySheet() {
  const mask = document.getElementById("paySheet");
  const box = document.getElementById("paySheetBox");
  box.style.transition = "";
  box.style.transform = "";
  mask.style.background = "";
  mask.classList.remove("open");
}

function confirmPaid() {
  closePaySheet();
  state.depositPaid = true;
  state.funnelStage = "approved";
  showToast("保证金已缴清，欢迎入驻");
  jump("approved", "flow");
}

(() => {
  const box = document.getElementById("paySheetBox");
  const mask = document.getElementById("paySheet");
  let dragging = false;
  let startY = 0;
  let lastY = 0;
  let lastT = 0;
  let vy = 0;

  box.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    dragging = true;
    startY = lastY = e.clientY;
    lastT = performance.now();
    vy = 0;
    box.style.transition = "none";
    box.setPointerCapture(e.pointerId);
  });

  box.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const now = performance.now();
    const dt = Math.max(1, now - lastT);
    const dy = e.clientY - startY;
    vy = (e.clientY - lastY) / dt;
    lastY = e.clientY;
    lastT = now;

    if (dy >= 0) {
      box.style.transform = `translate3d(0, ${dy}px, 0)`;
      const fade = Math.max(0.1, 0.46 * (1 - dy / 280));
      mask.style.background = `rgba(17, 24, 39, ${fade.toFixed(3)})`;
    } else {
      /* Emil / Vaul Rubber-Banding when pulling upward past top */
      const damped = -Math.pow(Math.abs(dy), 0.7) * 1.8;
      box.style.transform = `translate3d(0, ${damped.toFixed(1)}px, 0)`;
    }
  });

  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    const dy = lastY - startY;
    /* Dismiss on fast downward flick (velocity > 0.42 px/ms) OR drag distance > 74px */
    if (dy > 74 || (dy > 18 && vy > 0.42)) {
      closePaySheet();
    } else {
      box.style.transition = `transform 220ms var(--ease-vaul)`;
      box.style.transform = "translate3d(0, 0, 0)";
      mask.style.background = "";
    }
  };
  box.addEventListener("pointerup", endDrag);
  box.addEventListener("pointercancel", endDrag);

  /* Sonner-Style Upward Swipe-to-Dismiss on Toast */
  const toast = document.getElementById("toast");
  let tStartY = 0;
  let tDrag = false;
  toast.addEventListener("pointerdown", (e) => {
    tDrag = true;
    tStartY = e.clientY;
    toast.style.transition = "none";
    toast.setPointerCapture(e.pointerId);
  });
  toast.addEventListener("pointermove", (e) => {
    if (!tDrag) return;
    const dy = Math.min(12, e.clientY - tStartY);
    toast.style.transform = `translate3d(-50%, ${dy}px, 0) scale(1)`;
  });
  toast.addEventListener("pointerup", (e) => {
    if (!tDrag) return;
    tDrag = false;
    toast.style.transition = "";
    toast.style.transform = "";
    if (e.clientY - tStartY < -14) {
      clearTimeout(showToast._t);
      toast.classList.remove("show");
    }
  });
})();

/* ===== Emil Rule: Keyboard Shortcuts Never Trigger Animation! ===== */
window.addEventListener("keydown", (e) => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "Escape") {
    if (state.speaking) { closeVoicePop(); return; }
    if (document.getElementById("paySheet").classList.contains("open")) { closePaySheet(); return; }
  }
  const idx = SCREENS.findIndex((s) => s.id === state.view);
  if (e.key === "ArrowRight" && idx >= 0 && idx < SCREENS.length - 1) {
    e.preventDefault();
    jump(SCREENS[idx + 1].id, "instant");
  } else if (e.key === "ArrowLeft" && idx > 0) {
    e.preventDefault();
    jump(SCREENS[idx - 1].id, "instant");
  }
});

function simNonJzh() { state.nonJzh = true; state.waitlisted = false; jump("region", "instant"); }
function simQuizPass() {
  QUIZ.forEach((q, i) => { state.quizAns[i] = q.ans; });
  state.quizIdx = 7;
  state.quizAttempts = Math.max(1, state.quizAttempts);

}

  state.quizIdx = 7;
  state.quizAttempts = 1;
  jump("quiz_res", "instant");
}
function simSampleFailOnce() { state.sampleRetry = true; state.sampleAttempts = 1; jump("ship_addr", "instant"); }

    nonJzh: false, waitlisted: false, paceCap: 3, quizIdx: 0, quizAns: {}, quizAttempts: 0,

    stitchIdx: 0, tPhotos: [false, false, false], trialAttempts: 0, shippingMode: "auto_pickup",
    trackingNo: "", sampleAttempts: 0, sampleRetry: false, depositPaid: false, rejectReason: "quiz", reminded: false,
    speaking: false
  });

}

/* Smooth Tabular Countdown Tick */
setInterval(() => {
  if (state.view === "waiting" && state.slaSec > 0) {
    state.slaSec--;
    const el = document.getElementById("slaClock");
    if (el) el.innerHTML = fmtHmsHtml(state.slaSec);
  }
}, 1000);

/* Hydrate from URL Query Params (?v=, ?ms=, ?theme=, ?s=) */
(() => {
  try {
    const sp = new URLSearchParams(window.location.search);
    const v = sp.get("v");
    const ms = sp.get("ms");
    const th = sp.get("theme");
    const s = sp.get("s");
    if (v && VARIANTS.some((x) => x.id === v)) state.variant = v;
    if (ms) state.durMs = Math.max(100, Math.min(280, Number(ms) || 170));
    if (th && THEMES.some((x) => x.id === th)) state.theme = th;
    if (s && SCREENS.some((x) => x.id === s)) state.view = s;
  } catch (_) {}
  document.documentElement.setAttribute("data-variant", state.variant);
  document.documentElement.setAttribute("data-theme", state.theme);
  document.documentElement.style.setProperty("--dur-ui", `${state.durMs}ms`);
  const r = document.getElementById("durRange");
  const rv = document.getElementById("durVal");
  if (r) r.value = String(state.durMs);
  if (rv) rv.textContent = `${state.durMs}ms`;
  render("instant");
})();
</script>
