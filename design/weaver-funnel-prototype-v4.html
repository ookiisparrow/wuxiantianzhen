<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#F5F6F8" />
<title>无限天真 · 织女筛选流程原型 v4（微信授权 + 审美暗测 + 静默分层入库）</title>
<style>
  /* ===== 1. Adopted Palette: 质检靛青灰 (slate_indigo) + WeUI Typography Tokens ===== */
  :root {
    --stage-bg: #E2E5EC;
    --bg: #F5F6F8;
    --card: #FFFFFF;
    --soft: #EEF0F4;
    --line: rgba(21, 25, 34, 0.08);
    --line-strong: #C7CFDF;
    --input-border: #8590A6;
    --stitch: #8E9BB5;

    --brand: #293B63;
    --brand-dark: #1D2B4A;
    --brand-soft: #F0F3F9;
    --brand-line: rgba(41, 59, 99, 0.24);
    --btn-shadow: rgba(29, 43, 74, 0.12);

    --wx-green: #07C160;
    --wx-green-soft: #EAF9F0;

    --ok: #177245;
    --ok-soft: #ECF6F0;
    --ok-line: rgba(23, 114, 69, 0.24);

    --warn: #945610;
    --warn-soft: #FDF5E8;
    --warn-line: rgba(148, 86, 16, 0.26);

    --bad: #C43626;
    --bad-soft: #FDF0EE;
    --bad-line: rgba(196, 54, 38, 0.26);

    --ink: rgba(17, 24, 39, 0.92);
    --ink-mid: rgba(17, 24, 39, 0.64);
    --ink-sub: rgba(17, 24, 39, 0.46);

    --font-hero: 34px;
    --font-h1: 22px;     /* WeUI 页面大标题 22px / 44rpx */
    --font-body: 17px;   /* WeUI 主正文 / 导航栏 / 主按钮 / 选项主文案 17px / 34rpx */
    --font-sub: 15px;    /* WeUI 次要正文 15px / 30rpx */
    --font-desc: 14px;   /* WeUI 辅助说明 14px / 28rpx */
    --font-cap: 12px;    /* WeUI 次级标签 / 状态栏 12px / 24rpx */

    --radius-card: 12px;
    --radius-outer: 18px;
    --radius-inner: 8px;
    --radius-btn: 10px;
    --card-shadow: 0 1px 2px rgba(17, 24, 39, 0.03), 0 4px 12px rgba(17, 24, 39, 0.025);

    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --dur-press: 120ms;
    --dur-fade: 125ms;
    --dur-enter: 175ms;
    --dur-sheet-in: 240ms;
    --dur-sheet-out: 180ms;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--stage-bg);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  button, [role="radio"], [role="checkbox"], .wx-top, .stage-bar {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  button, input, a, [role="radio"], [role="checkbox"] {
    touch-action: manipulation;
  }

  button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }

  /* ===== Stage Layout ===== */
  .stage {
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 16px 24px;
  }

  /* ===== 375pt WeChat Standard Viewport ===== */
  .phone {
    width: 375px;
    height: min(760px, calc(100vh - 32px));
    min-height: 620px;
    background: var(--bg);
    border-radius: 42px;
    box-shadow:
      0 0 0 8px #1E222B,
      0 0 0 9.5px rgba(255, 255, 255, 0.18),
      0 24px 56px rgba(17, 24, 39, 0.20);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .wx-top {
    flex-shrink: 0;
    background: var(--bg);
    position: relative;
    z-index: 20;
  }
  .wx-status {
    height: 42px;
    padding: 12px 24px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: var(--font-cap);
    font-weight: 600;
    letter-spacing: 0.2px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .wx-notch {
    width: 104px;
    height: 24px;
    background: #14171F;
    border-radius: 999px;
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
  }
  .wx-nav {
    height: 44px;
    padding: 0 12px 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .wx-back {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: var(--font-sub);
    font-weight: 400;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 8px 6px 8px 0;
    min-height: 44px;
    cursor: pointer;
    font-family: inherit;
    min-width: 84px;
    transition: opacity var(--dur-fade) var(--ease-out), transform var(--dur-press) var(--ease-out);
  }
  .wx-back:active { opacity: 0.55; transform: translateX(-2px); }
  .wx-back.hidden { visibility: hidden; pointer-events: none; }
  .wx-title {
    font-size: var(--font-body);
    font-weight: 500;
    color: var(--ink);
    text-align: center;
    white-space: nowrap;
  }
  .wx-capsule {
    width: 84px;
    height: 30px;
    border-radius: 999px;
    border: 0.5px solid rgba(17, 24, 39, 0.12);
    background: rgba(255, 255, 255, 0.68);
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    flex-shrink: 0;
  }
  .wx-cap-div {
    width: 0.5px;
    height: 16px;
    background: rgba(17, 24, 39, 0.14);
  }

  /* 5-Macro-Phase Hairline Progress Bar */
  .stage-bar {
    flex-shrink: 0;
    padding: 4px 20px 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .stage-seg {
    flex: 1;
    height: 3px;
    border-radius: 999px;
    background: rgba(17, 24, 39, 0.08);
    overflow: hidden;
  }
  .stage-seg-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--brand);
    transition: width 220ms var(--ease-out), background-color 180ms var(--ease-out);
  }
  .stage-seg.done .stage-seg-fill {
    background: var(--ok);
    width: 100%;
  }

  /* Motion */
  @keyframes enterFwd  { from { opacity: 0; transform: translateX(8px); }  to { opacity: 1; transform: translateX(0); } }
  @keyframes enterBack { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes fadeOnly  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes badgePop  { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
  @keyframes gentleNudge { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-4px); } 65% { transform: translateX(4px); } }

  @media (prefers-reduced-motion: no-preference) {
    .screen.dir-fwd  > * { animation: enterFwd var(--dur-enter) var(--ease-out) both; }
    .screen.dir-back > * { animation: enterBack var(--dur-enter) var(--ease-out) both; }
    .badge-pop { animation: badgePop 180ms var(--ease-out) both; }
    .nudge-attn {
      animation: gentleNudge 240ms var(--ease-out);
      box-shadow: 0 0 0 2px var(--brand) !important;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen.dir-fwd > *, .screen.dir-back > * { animation: fadeOnly 120ms ease both; }
    .nudge-attn { box-shadow: 0 0 0 2px var(--brand) !important; }
  }

  /* ===== Main Viewport: STRICT NO SCROLL ===== */
  .screen {
    flex: 1;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
    padding: 12px 20px 8px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    position: relative;
  }

  .head-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
    position: relative;
  }
  .h1 {
    margin: 0;
    min-width: 0;
    flex: 1;
    font-size: var(--font-h1);
    font-weight: 600;
    line-height: 1.34;
    letter-spacing: -0.2px;
    color: var(--ink);
  }
  .lead {
    margin: 0 0 14px;
    font-size: var(--font-desc);
    font-weight: 400;
    line-height: 1.48;
    color: var(--ink-mid);
  }

  /* Audio Guide Button + Popover */
  .speak-wrap { position: relative; flex-shrink: 0; padding-top: 1px; }
  .speak-btn {
    appearance: none;
    position: relative;
    height: 30px;
    padding: 0 11px 0 9px;
    border-radius: 999px;
    border: 1px solid var(--brand-line);
    background: var(--card);
    color: var(--brand);
    font-size: var(--font-cap);
    font-weight: 500;
    font-family: inherit;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(17, 24, 39, 0.03);
    transition: background-color var(--dur-fade) var(--ease-out), color var(--dur-fade) var(--ease-out), transform var(--dur-press) var(--ease-out);
  }
  .speak-btn::after { content: ""; position: absolute; inset: -7px -4px; }
  .speak-btn:active { transform: scale(0.97); }
  .speak-btn.speaking { background: var(--brand); border-color: var(--brand); color: #FFFFFF; }

  .voice-pop {
    position: absolute;
    top: 36px;
    right: 0;
    width: 224px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(21, 25, 34, 0.94);
    color: #FFFFFF;
    font-size: var(--font-cap);
    line-height: 1.45;
    box-shadow: 0 10px 24px rgba(17, 24, 39, 0.18);
    transform-origin: top right;
    opacity: 0;
    transform: scale(0.95) translateY(-3px);
    pointer-events: none;
    transition: opacity var(--dur-fade) var(--ease-out), transform 150ms var(--ease-out);
    z-index: 45;
  }
  .voice-pop.open { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }

  /* ===== Step 0: Manual WeChat Login Consent ===== */
  .wx-login-card {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .wx-brand-mark {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--brand);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wx-acct-row {
    width: 100%;
    margin-top: 6px;
    padding: 11px 12px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
  }
  .wx-avatar {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: var(--wx-green-soft);
    color: var(--ok);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: var(--font-sub);
    font-weight: 600;
  }

  /* ===== Welcome ===== */
  .wx-bound-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    align-self: flex-start;
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
    background: var(--ok-soft);
    border: 1px solid var(--ok-line);
    color: var(--ok);
    font-size: var(--font-cap);
    font-weight: 500;
    margin-bottom: 10px;
  }
  .hero-art {
    width: 100%;
    height: 158px;
    border-radius: var(--radius-card);
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .pillar-group {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    display: flex;
    margin-top: auto;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .pillar-chip {
    flex: 1;
    min-width: 0;
    padding: 12px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
  }
  .pillar-chip + .pillar-chip::before {
    content: "";
    position: absolute;
    left: 0; top: 16px; bottom: 16px;
    width: 1px;
    background: var(--line);
  }
  .pillar-ico {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--brand-soft);
    color: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .pillar-txt { font-size: var(--font-desc); font-weight: 500; color: var(--ink); text-align: center; }

  /* ===== Aesthetic A/B Comparison Cards (Neutral Selection — Zero Right/Wrong Hint) ===== */
  .aes-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
    flex: 1;
    align-content: start;
  }
  .aes-card {
    appearance: none;
    padding: 0;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    overflow: hidden;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    display: flex;
    flex-direction: column;
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out), transform var(--dur-press) var(--ease-out);
  }
  .aes-card:active { transform: scale(0.98); }
  .aes-card.selected {
    border: 1.5px solid var(--brand);
    background: var(--brand-soft);
  }
  .aes-art {
    width: 100%;
    height: 184px;
    background: #F9FAFB;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid var(--line);
  }
  .aes-foot {
    padding: 12px 12px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: var(--font-body);
    font-weight: 500;
    color: var(--ink);
  }
  .aes-card.selected .aes-foot { color: var(--brand-dark); font-weight: 600; }

  /* ===== Cards, Cells & Choices ===== */
  .cell-group {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    overflow: hidden;
  }
  .cell-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 16px;
    position: relative;
  }
  .cell-row + .cell-row::before {
    content: "";
    position: absolute;
    left: 60px; right: 16px; top: 0;
    height: 1px;
    background: var(--line);
  }
  .cell-ico {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--brand-soft);
    color: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .cell-body { min-width: 0; flex: 1; }
  .cell-main { font-size: var(--font-body); font-weight: 500; color: var(--ink); line-height: 1.35; }
  .cell-desc { font-size: var(--font-desc); color: var(--ink-mid); margin-top: 2px; line-height: 1.4; }

  .check-card {
    appearance: none;
    width: 100%;
    margin-top: 12px;
    padding: 13px 16px;
    border-radius: var(--radius-card);
    border: 1px solid var(--brand-line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    font-size: var(--font-body);
    font-weight: 500;
    color: var(--ink);
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out), transform var(--dur-press) var(--ease-out);
  }
  .check-card:active { transform: scale(0.982); }
  .check-card.checked { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
  .check-box {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 1.5px solid var(--input-border);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .check-card.checked .check-box { background: var(--ok); border-color: var(--ok); color: #FFFFFF; }

  .stack { display: flex; flex-direction: column; gap: 10px; }
  .grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }

  .choice-card {
    appearance: none;
    width: 100%;
    min-height: 76px;
    padding: 14px 16px;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
    transition: border-color var(--dur-fade) var(--ease-out), background-color var(--dur-fade) var(--ease-out), transform var(--dur-press) var(--ease-out);
  }
  .choice-card:active { transform: scale(0.982); }
  .choice-card.selected { border: 1.5px solid var(--brand); background: var(--brand-soft); }
  .choice-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .choice-art {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--soft);
    color: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .choice-card.selected .choice-art { background: var(--card); }

  .weui-radio {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--line-strong);
    background: var(--card);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .weui-radio svg { opacity: 0; }
  .selected .weui-radio { border-color: var(--brand); background: var(--brand); color: #FFFFFF; }
  .selected .weui-radio svg { opacity: 1; }

  /* Step Meta + Price Estimation */
  .step-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: var(--font-cap);
    color: var(--ink-sub);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .step-dots { display: flex; gap: 6px; width: 120px; }
  .s-dot { flex: 1; height: 4px; border-radius: 999px; background: rgba(17, 24, 39, 0.10); }
  .s-dot.cur { background: var(--brand); }
  .s-dot.done { background: var(--ok); }

  .sample-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    overflow: hidden;
    margin-bottom: 12px;
  }
  .sample-art {
    height: 126px;
    background: #F9FAFB;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .sample-badge {
    position: absolute;
    bottom: 8px;
    right: 10px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--line);
    font-size: var(--font-cap);
    color: var(--ink-mid);
    font-weight: 500;
  }
  .sample-bar { padding: 9px 14px; border-top: 1px solid var(--line); }
  .sample-name { font-size: var(--font-sub); font-weight: 600; color: var(--ink); }

  .price-opt {
    appearance: none;
    min-height: 54px;
    padding: 10px 14px;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    color: var(--ink);
    font-size: var(--font-body);
    font-weight: 500;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
  }
  .price-opt:active { transform: scale(0.975); }
  .price-opt.selected { border: 1.5px solid var(--brand); background: var(--brand-soft); color: var(--brand-dark); font-weight: 600; }

  /* One-Tap Primary Action Card + Labeled Input */
  .action-card {
    appearance: none;
    width: 100%;
    padding: 18px 16px;
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--card-shadow);
    color: var(--ink);
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    margin-bottom: 14px;
  }

/* ===== Audio Guide ===== */
function speakText(event, text) {
  if (event) event.stopPropagation();
  if (state.speaking) { closeVoicePop(); return; }
  state.speaking = true;
  updateSpeakUi();
  clearTimeout(speakText._timer);
  if (typeof window !== "undefined" && "speechSynthesis" in window) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = 0.9;
      u.onend = () => closeVoicePop();
      u.onerror = () => { clearTimeout(speakText._timer); speakText._timer = setTimeout(() => closeVoicePop(), 2600); };
      window.speechSynthesis.speak(u);
      speakText._timer = setTimeout(() => closeVoicePop(), 6500);
      return;
    } catch (_) {}
  }
  speakText._timer = setTimeout(() => closeVoicePop(), 2600);
}
function closeVoicePop() {
  clearTimeout(speakText._timer);
  if (typeof window !== "undefined" && "speechSynthesis" in window) {
    try { window.speechSynthesis.cancel(); } catch (_) {}
  }
  state.speaking = false;
  updateSpeakUi();
}
function updateSpeakUi() {
  const b = document.getElementById("speakBtn");
  const p = document.getElementById("voicePop");
  if (b) { b.classList.toggle("speaking", state.speaking); b.setAttribute("aria-expanded", String(state.speaking)); }
  if (p) p.classList.toggle("open", state.speaking);
}
function handlePhoneOutsideClick(e) {
  if (!state.speaking) return;
  const wrap = document.querySelector(".speak-wrap");
  if (wrap && !wrap.contains(e.target)) closeVoicePop();
}
function speakBtnHtml(text) {
  const safe = String(text).replace(/'/g, "");
  const preview = safe.length > 28 ? safe.slice(0, 28) + "…" : safe;
  return `<div class="speak-wrap">
    <button id="speakBtn" type="button" class="speak-btn ${state.speaking ? "speaking" : ""}" aria-label="听一遍本页说明" aria-expanded="${state.speaking}" onclick="speakText(event, '${safe}')">${ICO.speaker}<span>听一遍</span></button>
    <div id="voicePop" class="voice-pop ${state.speaking ? "open" : ""}" role="status"><span>${preview}</span></div>
  </div>`;
}

function showToast(msg, kind = "ok") {
  const el = document.getElementById("toast");
  const ico = kind === "warn" ? `<span style="color:#FCD34D;display:inline-flex;">${ICO.info}</span>` : `<span style="color:#86EFAC;display:inline-flex;">${ICO.check(14)}</span>`;
  el.innerHTML = `${ico}<span>${msg}</span>`;
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), kind === "warn" ? 2400 : 1800);
}

function nudgeTarget(selector, msg) {
  showToast(msg, "warn");
  const el = document.querySelector(selector);
  if (!el) return;
  el.classList.remove("nudge-attn");
  void el.offsetWidth;
  el.classList.add("nudge-attn");
  if (typeof el.focus === "function") el.focus({ preventScroll: true });
  setTimeout(() => el.classList.remove("nudge-attn"), 900);
}

function detectCarrier(v) {
  const s = String(v || "").trim().toUpperCase();
  if (s.startsWith("SF")) return "顺丰速运";
  if (s.startsWith("ZTO") || /^7[358]\d{10,}$/.test(s)) return "中通快递";
  if (s.startsWith("YT")) return "圆通速递";
  if (s.startsWith("JT")) return "极兔速递";
  return "";
}

/* ===== Hidden Tag & Standard-Answer Evaluation Engine (Backend Only) ===== */
function evaluateHiddenCriteria() {
  const tags = [];
  let score = 0;
  let aesPassedCount = 0;

  AESTHETIC_QUESTIONS.forEach((q) => {
    const a = state.aesAns[q.idx];
    const status = a === undefined ? "pending" : a === q.standardAns ? "pass" : "miss";
    if (status === "pass") { score += 16; aesPassedCount++; }
    tags.push({ key: q.tagKey, label: q.tagName, status });
  });

  const expStatus = state.hasExperience === null ? "pending" : state.hasExperience ? "pass" : "miss";
  if (state.hasExperience === true) score += 10;
  tags.push({ key: "exp_commercial", label: "接单经历", status: expStatus });

  PRICE_QUESTIONS.forEach((q) => {
    const a = state.priceAns[q.idx];
    const status = a === undefined ? "pending" : a === q.standardAns ? "pass" : "miss";
    if (status === "pass") score += 10;
    else if (a !== undefined && Math.abs(a - q.standardAns) === 1) score += 4;
    tags.push({ key: q.tagKey, label: q.tagName, status });
  });

  const proofStatus = state.hasExperience === false ? "pending" : state.orderProofUploaded ? "pass" : "pending";
  if (state.orderProofUploaded) score += 6;
  tags.push({ key: "order_proof", label: "接单凭证", status: proofStatus });

  const photosReady = state.pPhotos.every(Boolean);
  if (photosReady) score += 6;
  tags.push({ key: "portfolio_3", label: "作品3图", status: photosReady ? "pass" : "pending" });

  let computedTier = "silent_out";
  if (aesPassedCount === 3 && score >= 82) computedTier = "priority";
  else if (aesPassedCount >= 2 && score >= 62) computedTier = "reserve";

  const activeTier = state.poolMode === "auto" ? computedTier : state.poolMode;
  return { tags, score, aesPassedCount, computedTier, activeTier };
}

function syncUrlParams() {
  try {
    const u = new URL(window.location.href);
    u.searchParams.set("s", state.view);
    window.history.replaceState(null, "", u.toString());
  } catch (_) {}
}

function applyDirectionAnim(dir) {
  const scr = document.getElementById("screen");
  scr.classList.remove("dir-fwd", "dir-back");
  if (dir !== "fwd" && dir !== "back") return;
  void scr.offsetWidth;
  scr.classList.add(dir === "back" ? "dir-back" : "dir-fwd");
}

        <input id="trackInput" class="big-input" type="text" placeholder="例如 SF1234567890" value="${state.trackingNo}" oninput="onTrack(this.value)" />
        <div id="carHint" style="min-height:20px;margin-top:6px;font-size:var(--font-desc);color:var(--ok);font-weight:500;">${carrier ? `快递公司：${carrier}` : ""}</div>
      </div>
    `;
    ready = hasNo;
  } else if (state.view === "wait_3") {
    screen.innerHTML = renderCalmWaitScreen({
      title: "快递单号已登记",
      lead: "仓库收到作品后将做实物核对，有进展微信通知",
      line1: `已登记单号：${state.trackingNo || "SF1234567890"}`,
      line2: "核对通过后，将通过微信邀你完成实名与押金开单"
    });
  } else if (state.view === "bind_id") {
    screen.innerHTML = `
      <div class="head-row">
        <h1 class="h1">实名绑定身份证</h1>
        ${speakBtnHtml("实物作品已通过。请拍一下身份证人像面自动识别，用于实名签约和打款结算，信息严格加密保护。")}
      </div>
      <p class="lead">实物已通过，实名后工钱才能按单结算到账</p>
      <button id="idUploadBtn" type="button" class="upload-area ${state.idBound ? "done" : ""}" onclick="scanIdCard()">
        <span class="upload-inner">
          ${state.idBound ? `<span class="badge-pop" style="width:34px;height:34px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;color:#FFF;">${ICO.check(18)}</span>` : ICO.idCard}
          <span class="upload-title">${state.idBound ? "身份证已核验通过" : "拍身份证人像面自动识别"}</span>
          <span class="upload-sub">${state.idBound ? "点击可重新拍摄" : "免手输 18 位数字，仅用于实名打款"}</span>
        </span>
      </button>
      ${state.idBound ? `
        <div class="id-verified-box">
          <div style="font-size:var(--font-sub);font-weight:600;color:var(--ink);">姓名：${state.idName}</div>
          <div style="font-size:var(--font-desc);color:var(--ink-mid);font-variant-numeric:tabular-nums;">证件号：${state.idNumberMasked}</div>
        </div>
      ` : `
        <div class="tip-banner tip-soft">
          ${ICO.shield}
          <span>证件信息仅用于工钱合规结算，平台严格加密保管。</span>
        </div>
      `}
    `;
    ready = state.idBound;
  } else if (state.view === "deposit_pay") {
    screen.innerHTML = `
      <div class="center-block">
        ${calmBadgeSvg(true)}
        <h1 class="h1" style="margin-top:4px;">最后一步：交 200 元保证金</h1>
        <div class="big-num">¥200.00</div>
        <p class="lead" style="margin:0 0 6px;">交完即刻寄出 12 色免费起步毛线，正式开单</p>
        <div class="cell-group" style="width:100%;text-align:left;">
          <div class="cell-row" style="padding:12px 14px;">
            <span class="cell-ico">${ICO.yarn}</span>
            <div class="cell-body"><div class="cell-main" style="font-size:var(--font-sub);">付款后即刻寄出 12 色起步毛线包</div></div>
          </div>
          <div class="cell-row" style="padding:12px 14px;">
            <span class="cell-ico">${ICO.refund}</span>
            <div class="cell-body"><div class="cell-main" style="font-size:var(--font-sub);">结清在途订单可随时原路全额退回</div></div>
          </div>
        </div>
      </div>
    `;
  } else if (state.view === "approved") {
    screen.innerHTML = `
      <div class="head-row">
        <h1 class="h1">已开通接单，欢迎加入</h1>
        <span class="id-badge badge-pop">工号 WV-2026-018</span>
      </div>
      <p class="lead" style="margin-bottom:12px;">12 色免费起步毛线包已安排寄出，点下一步进入接单台</p>
      <div class="yarn-4x3">
        ${YARNS_12.map((y) => `
          <div class="yarn-dot-card">
            <span class="yarn-ball" style="background:${y.c};" aria-hidden="true"></span>
            <span>${y.n}</span>
          </div>
        `).join("")}
      </div>
    `;
  }

  nextBtn.setAttribute("aria-disabled", String(!ready));
  applyDirectionAnim(animDir);
  syncUrlParams();
  renderReviewer();
}

function renderReviewer() {
  const ev = evaluateHiddenCriteria();
  const tierMeta = {
    silent_out: { pill: "silent",   label: "未达及格线·静默不入库", desc: "未满足暗中标准，不入织女库，等待页静默停留，不发任何失败告知。" },
    reserve:    { pill: "reserve",  label: "过及格线·入织女储备库", desc: "已达隐藏及格线，进入织女库等待后续开放更多渠道，暂不推进测试题。" },
    priority:   { pill: "priority", label: "高分达标·进测试/接单库", desc: "暗审全标达线且排名靠前，可放行进入钩织测试题与优先接单织女库。" }
  }[ev.activeTier];

  const badge = document.getElementById("poolBadge");
  badge.className = `pool-pill ${tierMeta.pill}`;
  badge.textContent = `${tierMeta.label} (${ev.score}分)`;

  document.getElementById("hiddenTagGrid").innerHTML = ev.tags.map((t) => {
    const sym = t.status === "pass" ? "✓" : t.status === "miss" ? "×" : "·";
    return `<span class="h-tag ${t.status}">${sym} ${t.label}</span>`;
  }).join("");

  document.getElementById("poolNote").textContent = tierMeta.desc;

  document.getElementById("poolBtns").innerHTML = POOL_MODES.map((m) => `
    <button type="button" class="seg-btn ${state.poolMode === m.id ? "active" : ""}" onclick="setPoolMode('${m.id}')">${m.name}</button>
  `).join("");

  document.getElementById("revList").innerHTML = SCREENS.map((s) => {
    const skipped = (s.id === "order_proof" && state.hasExperience === false) || (s.id === "addr_fallback" && !state.locFailed);
    return `<button type="button" class="rev-btn ${state.view === s.id ? "active" : ""} ${skipped ? "muted-skip" : ""}" onclick="jump('${s.id}', 'none')">
      <span>${s.label}</span>
      <span style="opacity:0.68;">${skipped ? "自动跳过" : s.stage}</span>
    </button>`;
  }).join("");

  document.getElementById("specJson").textContent = JSON.stringify({
    version: "v4-hidden-tags",
    wxConsentedAndBound: state.wxAgreed ? state.wxUserId : false,
    depositAccepted: state.depositAccepted,
    locationSource: state.locationSource,
    phone: state.phone || null,
    hiddenScore: ev.score,
    aestheticPassed: ev.aesPassedCount + "/3",
    hiddenTags: Object.fromEntries(ev.tags.map((t) => [t.key, t.status])),
    backendPoolTier: ev.activeTier,
    canEnterTrialTest: ev.activeTier === "priority",
    weaverFailureNoticeShown: false
  }, null, 2);
}

/* ===== Single Global Next Button Logic ===== */
function onNext() {
  const v = state.view;

  if (v === "wx_login" && !state.wxAgreed) return nudgeTarget("#wxConsentCheck", "请先勾选同意微信一键登录");
  if (v === "deposit_notice" && !state.depositAccepted) return nudgeTarget("#depAckBtn", "请先勾选接受 200 元保证金规则");
  if (v === "addr_fallback" && state.weaverAddr.trim().length < 2) return nudgeTarget("#importWxAddrBtn", "请先一键填入或手写你的地址");
  if (v === "bind_phone" && state.phone.trim().length < 11) return nudgeTarget("#wxPhoneBtn", "请先一键绑定或输入 11 位手机号");
  if (v === "aes_1" && state.aesAns[0] === undefined) return nudgeTarget("#aesGrid button", "请先点选作品 A 或作品 B");
  if (v === "aes_2" && state.aesAns[1] === undefined) return nudgeTarget("#aesGrid button", "请先点选作品 A 或作品 B");
  if (v === "aes_3" && state.aesAns[2] === undefined) return nudgeTarget("#aesGrid button", "请先点选作品 A 或作品 B");
  if (v === "experience" && state.hasExperience === null) return nudgeTarget("#expStack button", "请先选择以前有没有接过单");
  if (v === "price_1" && state.priceAns[0] === undefined) return nudgeTarget("#priceGrid button", "请先选一个大概价位");
  if (v === "price_2" && state.priceAns[1] === undefined) return nudgeTarget("#priceGrid button", "请先选一个大概价位");
  if (v === "price_3" && state.priceAns[2] === undefined) return nudgeTarget("#priceGrid button", "请先选一个大概价位");
  if (v === "order_proof" && !state.orderProofUploaded) return nudgeTarget("#photoUploadBtn", "请先上传一张接单截图凭证");
  if ((v === "p1" && !state.pPhotos[0]) || (v === "p2" && !state.pPhotos[1]) || (v === "p3" && !state.pPhotos[2]) ||
      (v === "t1" && !state.tPhotos[0]) || (v === "t2" && !state.tPhotos[1]) || (v === "t3" && !state.tPhotos[2])) {
    return nudgeTarget("#photoUploadBtn", "请先点上方虚线框添加照片");
  }
  if (v === "ship_no" && state.trackingNo.trim().length < 6) return nudgeTarget("#scanTrackBtn", "请先扫条形码或输入快递单号");
  if (v === "bind_id" && !state.idBound) return nudgeTarget("#idUploadBtn", "请先拍摄身份证人像面完成实名");

  if (v === "wx_login") {
    jump("welcome", "fwd");
    showToast("已同意并自动绑定微信账号");
    return;
  }
  if (v === "welcome") return jump("deposit_notice", "fwd");
  if (v === "deposit_notice") {
    if (state.locFailed) return jump("addr_fallback", "fwd");
    state.locationSource = "auto_gps";
    state.weaverAddr = "浙江省杭州市滨江区西兴街道";
    jump("bind_phone", "fwd");
    showToast("已自动识别定位，免手填地址");
    return;
  }
  if (v === "addr_fallback") return jump("bind_phone", "fwd");
  if (v === "bind_phone") return jump("aes_1", "fwd");
  if (v === "aes_1") return jump("aes_2", "fwd");
  if (v === "aes_2") return jump("aes_3", "fwd");
  if (v === "aes_3") return jump("experience", "fwd");
  if (v === "experience") return jump("price_1", "fwd");
  if (v === "price_1") return jump("price_2", "fwd");
  if (v === "price_2") return jump("price_3", "fwd");
  if (v === "price_3") return jump(state.hasExperience === false ? "p1" : "order_proof", "fwd");
  if (v === "order_proof") return jump("p1", "fwd");
  if (v === "p1") return jump("p2", "fwd");
  if (v === "p2") return jump("p3", "fwd");
  if (v === "p3") return jump("wait_1", "fwd");

  /* Silent Elimination Gate: ONLY priority-tier weavers advance into trial test & downstream! */
  if (v === "wait_1" || v === "wait_2" || v === "wait_3") {
    const ev = evaluateHiddenCriteria();
    if (ev.activeTier !== "priority") {
      showToast("已登记好，有新名额时微信会通知你");
      return;
    }
    if (v === "wait_1") return jump("test_guide", "fwd");
    if (v === "wait_2") return jump("ship_addr", "fwd");
    if (v === "wait_3") return jump("bind_id", "fwd");
  }

  if (v === "test_guide") return jump("t1", "fwd");
  if (v === "t1") return jump("t2", "fwd");
  if (v === "t2") return jump("t3", "fwd");
  if (v === "t3") return jump("wait_2", "fwd");
  if (v === "ship_addr") return jump("ship_no", "fwd");
  if (v === "ship_no") return jump("wait_3", "fwd");
  if (v === "bind_id") return jump("deposit_pay", "fwd");
  if (v === "deposit_pay") { openPaySheet(); return; }
  if (v === "approved") { showToast("已进入接单工作台 · WV-2026-018"); return; }
}

function goBack() {
  if (state.view === "bind_phone") return jump(state.locFailed ? "addr_fallback" : "deposit_notice", "back");
  if (state.view === "p1") return jump(state.hasExperience === false ? "price_3" : "order_proof", "back");
  const prev = {
    welcome: "wx_login",
    deposit_notice: "welcome",
    addr_fallback: "deposit_notice",
    aes_1: "bind_phone",
    aes_2: "aes_1",
    aes_3: "aes_2",
    experience: "aes_3",
    price_1: "experience",
    price_2: "price_1",
    price_3: "price_2",
    order_proof: "price_3",
    p2: "p1",
    p3: "p2",
    t1: "test_guide",
    t2: "t1",
    t3: "t2",
    ship_no: "ship_addr",
    deposit_pay: "bind_id"
  }[state.view];
  if (prev) jump(prev, "back");
}

function jump(id, animDir = "none") {
  closeVoicePop();
  clearTimeout(showToast._t);
  const toastEl = document.getElementById("toast");
  if (toastEl) toastEl.classList.remove("show");
  state.view = id;
  render(animDir);
}

/* ===== Interactions ===== */
function toggleWxConsent() { state.wxAgreed = !state.wxAgreed; render("none"); }
function toggleDepAck() { state.depositAccepted = !state.depositAccepted; render("none"); }
function importWxAddr() {
  state.locationSource = "wx_address";
  state.weaverAddr = "四川省绵阳市涪城区跃进路 26 号";
  showToast("已填入微信收货地址");
  render("none");
}
function onWeaverAddr(v) {
  state.locationSource = "manual_input";
  state.weaverAddr = v;
  document.getElementById("nextBtn").setAttribute("aria-disabled", String(v.trim().length < 2));
  renderReviewer();
}
function bindWxPhone() {
  state.phone = "13805718899";
  state.phoneSource = "wx_quick";
  showToast("已绑定微信手机号");
  render("none");
}
function onPhoneInput(v) {
  state.phone = v.replace(/\D/g, "").slice(0, 11);
  state.phoneSource = "manual";
  document.getElementById("nextBtn").setAttribute("aria-disabled", String(state.phone.length < 11));
  renderReviewer();
}
function pickAes(qIdx, oIdx) { state.aesAns[qIdx] = oIdx; render("none"); }
function pickExp(flag) { state.hasExperience = flag; render("none"); }
function pickPrice(qIdx, oIdx) { state.priceAns[qIdx] = oIdx; render("none"); }
function tapOrderProof() { state.orderProofUploaded = true; showToast("接单截图已添加"); render("none"); }
function tapP(i) { state.pPhotos[i] = true; showToast("作品照片已添加"); render("none"); }
function pickStitch(i) { state.stitchIdx = i; render("none"); }
function tapT(i) { state.tPhotos[i] = true; showToast("测试照片已添加"); render("none"); }
function copyAddr() {
  if (navigator.clipboard) navigator.clipboard.writeText("无限天真质检组 138-0571-8899 浙江省杭州市滨江区江南大道 3 号楼 204").catch(() => {});
  showToast("收件地址已复制");
}
function scanTrack() { state.trackingNo = "SF1234567890"; showToast("已识别快递单号"); render("none"); }
function onTrack(v) {
  state.trackingNo = v;
  const c = detectCarrier(v);
  const el = document.getElementById("carHint");
  if (el) el.textContent = c ? `快递公司：${c}` : "";
  document.getElementById("nextBtn").setAttribute("aria-disabled", String(v.trim().length < 6));
  renderReviewer();
}
function scanIdCard() {
  state.idBound = true;
  state.idName = "林秀珍";
  state.idNumberMasked = "330108********2426";
  showToast("身份证信息已核验");
  render("none");
}
function openPaySheet() { closeVoicePop(); document.getElementById("paySheet").classList.add("open"); }
function closePaySheet() { document.getElementById("paySheet").classList.remove("open"); }
function confirmPaid() {
  closePaySheet();
  state.depositPaid = true;
  showToast("保证金已缴清，欢迎开单");
  jump("approved", "fwd");
}

/* ===== Reviewer Simulators ===== */
function setPoolMode(id) {
  state.poolMode = id;
  renderReviewer();
  showToast(id === "auto" ? "已切回：按实际答题暗标自动判定" : "已切换后台强制分流模拟");
}
function simFillPass() {
  state.wxAgreed = true;
  state.depositAccepted = true;
  state.phone = "13805718899";
  state.phoneSource = "wx_quick";
  state.aesAns = { 0: 0, 1: 1, 2: 0 };
  state.hasExperience = true;
  state.priceAns = { 0: 1, 1: 2, 2: 2 };
  state.orderProofUploaded = true;
  state.pPhotos = [true, true, true];
  state.poolMode = "auto";
  jump("wait_1", "none");
  showToast("已按标准答案填满：点下一步可进测试题");
}
function simFillMiss() {
  state.wxAgreed = true;
  state.depositAccepted = true;
  state.phone = "13805718899";
  state.aesAns = { 0: 1, 1: 0, 2: 1 };
  state.hasExperience = false;
  state.priceAns = { 0: 0, 1: 0, 2: 0 };
  state.pPhotos = [true, true, true];
  state.poolMode = "auto";
  jump("wait_1", "none");
  showToast("已模拟暗标不达标：前台静默停留，无失败提示");
}
function simLocFail() { state.locFailed = true; state.locationSource = "manual_input"; state.weaverAddr = ""; jump("addr_fallback", "none"); }
function resetAll() {
  Object.assign(state, {
    view: "wx_login", wxAgreed: false, depositAccepted: false, locFailed: false, locationSource: "auto_gps",
    weaverAddr: "浙江省杭州市滨江区西兴街道", phone: "", phoneSource: "", aesAns: {}, hasExperience: null,
    priceAns: {}, orderProofUploaded: false, pPhotos: [false, false, false], stitchIdx: 0,
    tPhotos: [false, false, false], trackingNo: "", idBound: false, idName: "", idNumberMasked: "",
    depositPaid: false, poolMode: "auto", speaking: false
  });
  render("none");
}

window.addEventListener("keydown", (e) => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "Escape") { closeVoicePop(); closePaySheet(); return; }
  const idx = SCREENS.findIndex((s) => s.id === state.view);
  if (e.key === "ArrowRight" && idx >= 0 && idx < SCREENS.length - 1) { e.preventDefault(); jump(SCREENS[idx + 1].id, "none"); }
  else if (e.key === "ArrowLeft" && idx > 0) { e.preventDefault(); jump(SCREENS[idx - 1].id, "none"); }
});

(() => {
  try {
    const s = new URLSearchParams(window.location.search).get("s");
    if (s && SCREENS.some((x) => x.id === s)) state.view = s;
  } catch (_) {}
  render("none");
})();
</script>
</body>
</html>
